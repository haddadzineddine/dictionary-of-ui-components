<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictionary of UI Components — Graph</title>
    <style>
      :root {
        --bg: #edede9;
        --panel: #f5f5f1;
        --ink: #1c1c1a;
        --muted: #6d6d68;
        --line: #d4d4cf;
        --mono:
          ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 var(--sans);
        overflow: hidden;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      #app {
        display: flex;
        height: 100dvh;
      }
      #stage {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }
      #graph {
        position: absolute;
        inset: 0;
      }

      .round {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
      }
      .round:hover {
        border-color: var(--ink);
      }
      .round svg {
        width: 16px;
        height: 16px;
      }

      #top-left {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #brand {
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #info-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 3;
        font-family: var(--mono);
        font-size: 13px;
      }
      #hint {
        position: absolute;
        bottom: 16px;
        left: 18px;
        z-index: 2;
        margin: 0;
        font: 12px var(--mono);
        color: var(--muted);
        pointer-events: none;
      }

      .popover {
        position: absolute;
        top: 66px;
        z-index: 4;
        width: min(360px, calc(100% - 36px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.1);
      }
      #search {
        left: 18px;
        overflow: hidden;
      }
      #search input {
        width: 100%;
        padding: 12px 14px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        font: 15px var(--sans);
        color: var(--ink);
        outline: none;
      }
      #results {
        max-height: min(55vh, 420px);
        margin: 0;
        padding: 4px;
        overflow-y: auto;
        list-style: none;
      }
      #results li {
        padding: 7px 10px;
        border-radius: 7px;
        cursor: pointer;
      }
      #results li[aria-selected="true"] {
        background: var(--ink);
        color: var(--panel);
      }
      #results small {
        display: block;
        overflow: hidden;
        font-size: 12px;
        opacity: 0.7;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #results .none {
        color: var(--muted);
        cursor: default;
      }
      #info {
        right: 18px;
        padding: 16px 18px;
        font-size: 14px;
      }
      #info h2 {
        margin: 0 0 6px;
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      #info p {
        margin: 0 0 8px;
      }
      #info p:last-child {
        margin-bottom: 0;
      }
      kbd {
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: 12px var(--mono);
      }

      #panel {
        position: relative;
        flex: 0 0 var(--panel-width, min(560px, 42vw));
        height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--line);
      }
      #resizer {
        position: relative;
        z-index: 5;
        flex: 0 0 11px;
        margin: 0 -6px 0 -5px;
        cursor: col-resize;
        touch-action: none;
      }
      #resizer::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 4px;
        width: 3px;
        background: transparent;
        transition: background 0.12s;
      }
      #resizer:hover::after,
      #resizer:focus-visible::after,
      .resizing #resizer::after {
        background: var(--ink);
      }
      #resizer:focus-visible {
        outline: none;
      }
      .resizing {
        cursor: col-resize;
        user-select: none;
      }
      #close {
        position: sticky;
        top: 16px;
        z-index: 2;
        float: right;
        margin: 16px 16px 0 0;
        font-size: 18px;
        line-height: 1;
      }
      #panel-body {
        padding: 30px 30px 44px;
      }
      .eyebrow,
      .label {
        font: 11px var(--mono);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #panel h1 {
        margin: 6px 48px 12px 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
        outline: none;
      }
      .lede {
        margin: 0;
        font-size: 16px;
      }
      .block {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .label {
        display: block;
        margin-bottom: 12px;
      }
      .bubbles {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: 88%;
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 10px;
      }
      .bubble:nth-child(odd) {
        align-self: flex-start;
        background: #fbfbf8;
        border: 1px solid var(--line);
      }
      .bubble:nth-child(even) {
        align-self: flex-end;
        background: var(--ink);
        color: #f5f5f1;
      }
      .bubble code {
        background: rgb(127 127 127 / 0.22);
      }
      .avoid {
        margin: 0;
        font-size: 14px;
        color: #3b3b38;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        padding: 3px 11px;
        font-size: 13px;
        text-decoration: none;
        background: transparent;
        border: 1px solid #a9a9a3;
        border-radius: 999px;
      }
      .chip:hover {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--panel);
      }
      details summary {
        cursor: pointer;
        list-style-position: inside;
      }
      details .label {
        display: inline;
        margin: 0;
      }
      .entry {
        margin-top: 12px;
        font-size: 14px;
      }
      .entry p,
      .entry ul,
      .entry ol,
      .entry blockquote,
      .entry pre,
      .entry .table {
        margin: 0 0 12px;
      }
      .entry ul,
      .entry ol {
        padding-left: 20px;
      }
      .entry h4 {
        margin: 16px 0 6px;
        font-size: 14px;
      }
      .entry blockquote {
        padding-left: 12px;
        border-left: 2px solid var(--line);
      }
      .entry .table {
        overflow-x: auto;
      }
      .entry table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .entry th,
      .entry td {
        padding: 6px 8px 6px 0;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      .entry pre {
        padding: 10px;
        overflow-x: auto;
        background: #e7e7e2;
        border-radius: 6px;
      }
      code {
        padding: 1px 4px;
        font: 0.9em var(--mono);
        background: #e7e7e2;
        border-radius: 4px;
      }
      pre code {
        padding: 0;
        background: none;
      }

      @media (max-width: 720px) {
        #app {
          flex-direction: column;
        }
        #panel {
          flex: 0 0 58dvh;
          width: 100%;
          height: 58dvh;
          border-top: 1px solid var(--line);
          border-left: 0;
        }
        #panel-body {
          padding: 22px 20px 36px;
        }
        #hint,
        #resizer,
        .has-selection #brand {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <div
          id="graph"
          role="img"
          aria-label="Force-directed graph of entries and the links between them. Use search to reach one by keyboard."
        ></div>
        <div id="top-left">
          <button
            id="search-btn"
            class="round"
            aria-label="Search entries"
            title="Search (/)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.8-3.8" />
            </svg>
          </button>
          <span id="brand">Dictionary of UI Components</span>
        </div>
        <button
          id="info-btn"
          class="round"
          aria-label="About this graph"
          aria-expanded="false"
          title="About"
        >
          i
        </button>
        <div id="search" class="popover" hidden>
          <input
            id="search-input"
            type="search"
            placeholder="Search entries"
            aria-label="Search entries"
            role="combobox"
            aria-expanded="true"
            aria-controls="results"
            autocomplete="off"
            spellcheck="false"
          />
          <ul id="results" role="listbox" aria-label="Matching entries"></ul>
        </div>
        <div id="info" class="popover" hidden>
          <h2>Reading the graph</h2>
          <p id="info-counts"></p>
          <p>
            Larger, darker circles are linked to by more entries. Dots on a line
            move in the direction of the link.
          </p>
          <p>
            Click a circle to read it. Drag to rearrange, scroll to zoom.
            <kbd>/</kbd> searches, <kbd>Esc</kbd> closes.
          </p>
        </div>
        <p id="hint">Click a circle, or press / to search</p>
      </main>
      <div
        id="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize details panel"
        aria-controls="panel"
        tabindex="0"
        title="Drag to resize, double-click to reset"
        hidden
      ></div>
      <aside id="panel" aria-label="Term details" hidden>
        <button id="close" class="round" aria-label="Close details">×</button>
        <div id="panel-body"></div>
      </aside>
    </div>

    <script id="graph-data" type="application/json">
      {"title":"Dictionary of UI Components","noun":"entry","nouns":"entries","labels":{"quotes":"Heard in the wild","note":"Note","outgoing":"Connects to","incoming":"Linked from","body":"Full entry"},"sections":["Actions","Form Controls","Form Patterns","Navigation","Overlays","Feedback","Data Display","Layout and Foundations","Component Architecture","Interaction States"],"terms":[{"name":"Button","section":0,"description":"A control that performs an action when activated, such as saving, submitting a form or opening a dialog.","body":"\u003cp>A button is a control that performs an action when activated, such as saving a record, submitting a form or opening a \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a>. Use the native \u003ccode>&lt;button&gt;\u003c/code> element. It receives keyboard focus, activates on Enter and Space, and is announced as a button by screen readers, the software that reads an interface aloud. A \u003ccode>&lt;div&gt;\u003c/code> with a click handler has none of this, which is why some controls work with a mouse and do nothing from the keyboard.\u003c/p>\u003cp>The nearest alternative is a link, and the choice depends on what happens next.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Element\u003c/th>\u003cth>Use it when\u003c/th>\u003cth>Activates with\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>&lt;button&gt;\u003c/code>\u003c/td>\u003ctd>The action changes this page or sends data\u003c/td>\u003ctd>Enter, Space\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;a href&gt;\u003c/code>\u003c/td>\u003ctd>The action goes to another URL\u003c/td>\u003ctd>Enter\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A link styled to look like a button should stay a link, because users expect to open it in a new tab or copy its address.\u003c/p>\u003cp>A common bug comes from the default type. Inside a \u003ccode>&lt;form&gt;\u003c/code>, a \u003ccode>&lt;button&gt;\u003c/code> with no \u003ccode>type\u003c/code> attribute is a submit button. A &quot;Cancel&quot; or &quot;Show password&quot; button then submits the form and can reload the page, losing what the user typed. Set the type on every button.\u003c/p>\u003cpre>\u003ccode>&lt;button type=&quot;button&quot;&gt;Cancel&lt;/button&gt;\n&lt;button type=&quot;submit&quot;&gt;Save invoice&lt;/button&gt;\u003c/code>\u003c/pre>\u003cp>The accessible name, which is the text a screen reader announces, comes from the button's content. Prefer a specific label such as &quot;Delete invoice&quot; over &quot;Click here&quot;. After activation, focus should land somewhere sensible. If the button opens a dialog, focus moves inside it.\u003c/p>\u003cp>The native \u003ccode>disabled\u003c/code> attribute removes a button from the Tab order, so keyboard users may never discover it. \u003ccode>aria-disabled=&quot;true&quot;\u003c/code> keeps it focusable, but your script must then block the action. See \u003ca href=\"#Disabled%20state\" data-term=\"Disabled state\">disabled state\u003c/a> for that trade-off, and \u003ca href=\"#Touch%20target\" data-term=\"Touch target\">touch target\u003c/a> for minimum sizes.\u003c/p>","avoid":"","usage":["The cancel button on the settings form keeps saving people's changes.","It has no \u003ccode>type\u003c/code>, so it defaults to submit. Add \u003ccode>type=&quot;button&quot;\u003c/code>."],"out":[42,105,106]},{"name":"Icon button","section":0,"description":"A button that shows a symbol with no visible text, and needs a separate accessible name to make sense to assistive technology.","body":"\u003cp>An icon \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> is a button that shows a symbol and no visible text, such as a bin for delete or a cross for close. It saves space in dense interfaces such as a \u003ca href=\"#Toolbar\" data-term=\"Toolbar\">toolbar\u003c/a> or a table row. Use one only when the symbol is widely understood. If people would have to guess, use a text label or put a visible word beside the icon.\u003c/p>\u003cp>The usual failure is a missing name. With no text inside, a screen reader (software that reads the interface aloud) may announce only &quot;button&quot;, so the user cannot tell whether it deletes, closes or shares. Provide the name with \u003ccode>aria-label\u003c/code> or visually hidden text, and hide the decorative graphic.\u003c/p>\u003cpre>\u003ccode>&lt;button type=&quot;button&quot; aria-label=&quot;Delete invoice 1042&quot;&gt;\n  &lt;svg aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot;&gt;...&lt;/svg&gt;\n&lt;/button&gt;\u003c/code>\u003c/pre>\u003cp>Names in repeated rows should say which item they act on. Twenty controls all called &quot;Delete&quot; are hard to tell apart when listed by a screen reader.\u003c/p>\u003cp>Keyboard behaviour matches any button: Tab reaches it, and Enter or Space activates it. Inside a toolbar, arrow keys move between controls instead.\u003c/p>\u003cp>A \u003ca href=\"#Tooltip\" data-term=\"Tooltip\">tooltip\u003c/a> helps sighted users learn what the symbol means, and it must appear on keyboard focus as well as hover. It does not replace the accessible name. If the tooltip repeats that name, do not also attach it with \u003ccode>aria-describedby\u003c/code>, or the same words are announced twice.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concern\u003c/th>\u003cth>What to check\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Target size\u003c/td>\u003ctd>At least 24 by 24 CSS pixels (WCAG 2.5.8), unless an exception applies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contrast\u003c/td>\u003ctd>Icon at 3:1 against adjacent colours (WCAG 1.4.11)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>State\u003c/td>\u003ctd>Use a \u003ca href=\"#Toggle%20button\" data-term=\"Toggle button\">toggle button\u003c/a> for on and off\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A small glyph can sit inside a larger clickable area, so padding is the usual way to reach the \u003ca href=\"#Touch%20target\" data-term=\"Touch target\">touch target\u003c/a> size.\u003c/p>","avoid":"","usage":["VoiceOver just says 'button' for every action in this table row.","They're icon buttons with no names. Add an \u003ccode>aria-label\u003c/code> that includes the invoice number."],"out":[0,6,47,2,106]},{"name":"Toggle button","section":0,"description":"A button with a pressed and an unpressed state, used for on-off commands such as Bold or Mute.","body":"\u003cp>A toggle \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> is a button with two states, pressed and not pressed, such as Bold in a text editor or Mute in a video player. HTML has no dedicated element for it. Use a native \u003ccode>&lt;button&gt;\u003c/code> and expose the state with \u003ccode>aria-pressed\u003c/code>.\u003c/p>\u003cpre>\u003ccode>&lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;Mute&lt;/button&gt;\u003c/code>\u003c/pre>\u003cp>Enter and Space flip the state, and focus stays on the control. A screen reader (software that reads the interface aloud) announces something like &quot;Mute, toggle button, not pressed&quot;. Styling from the attribute, with \u003ccode>[aria-pressed=&quot;true&quot;]\u003c/code>, keeps the visual state and the exposed state from drifting apart.\u003c/p>\u003cp>There are two valid ways to communicate the state, and mixing them is the common bug.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>Label\u003c/th>\u003cth>State attribute\u003c/th>\u003cth>User hears\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pressed state\u003c/td>\u003ctd>Stays &quot;Mute&quot;\u003c/td>\u003ctd>\u003ccode>aria-pressed\u003c/code>\u003c/td>\u003ctd>&quot;Mute, pressed&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Label change\u003c/td>\u003ctd>&quot;Mute&quot; to &quot;Unmute&quot;\u003c/td>\u003ctd>None\u003c/td>\u003ctd>&quot;Unmute, button&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>If the label changes and \u003ccode>aria-pressed\u003c/code> is also set, the user can hear &quot;Unmute, pressed&quot; and has no way to tell whether the sound is on. The WAI-ARIA Authoring Practices state that the label on a toggle must not change when its state changes. Pick one approach per control.\u003c/p>\u003cp>Choose the nearest alternative by what the control means. A toggle button suits a command in a \u003ca href=\"#Toolbar\" data-term=\"Toolbar\">toolbar\u003c/a> that applies to the current content. A \u003ca href=\"#Switch\" data-term=\"Switch\">switch\u003c/a> suits a setting that is on or off, such as email alerts. A \u003ca href=\"#Checkbox\" data-term=\"Checkbox\">checkbox\u003c/a> suits a choice that is submitted later with a form. For one choice among several, use a \u003ca href=\"#Segmented%20control\" data-term=\"Segmented control\">segmented control\u003c/a>.\u003c/p>\u003cp>The pressed look must not rely on colour alone (WCAG 1.4.1). A filled background, border or icon change is easier to perceive, particularly when two neighbouring toggles are in different states.\u003c/p>","avoid":"","usage":["The screen reader says 'Unmute, pressed'. Is the audio on or off?","We're swapping the label and setting \u003ccode>aria-pressed\u003c/code>. Keep the label as 'Mute' and only change the state."],"out":[0,6,11,9,4]},{"name":"Split button","section":0,"description":"A primary action joined to a small arrow that opens a menu of related alternatives.","body":"\u003cp>A split \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> is two controls drawn as one: a main button that runs the default action, and a narrow arrow button that opens a list of related actions. A &quot;Merge&quot; control with &quot;Squash and merge&quot; and &quot;Rebase and merge&quot; behind the arrow is a typical example. Use it when one action is clearly the common choice and the others are variations of it. If no option is the default, a plain \u003ca href=\"#Dropdown%20menu\" data-term=\"Dropdown menu\">dropdown menu\u003c/a> is clearer.\u003c/p>\u003cp>The WAI-ARIA Authoring Practices have no dedicated split button pattern, so build it from two patterns they do define.\u003c/p>\u003cpre>\u003ccode>&lt;div role=&quot;group&quot; aria-label=&quot;Merge options&quot;&gt;\n  &lt;button type=&quot;button&quot;&gt;Merge&lt;/button&gt;\n  &lt;button type=&quot;button&quot; aria-haspopup=&quot;menu&quot; aria-expanded=&quot;false&quot;\n          aria-label=&quot;More merge options&quot;&gt;&lt;/button&gt;\n&lt;/div&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Role\u003c/th>\u003cth>Keyboard\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Main action\u003c/td>\u003ctd>\u003ccode>button\u003c/code>\u003c/td>\u003ctd>Enter or Space runs the default action\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Arrow\u003c/td>\u003ctd>Menu button\u003c/td>\u003ctd>Enter, Space or Down Arrow opens the menu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open menu\u003c/td>\u003ctd>\u003ccode>menu\u003c/code>\u003c/td>\u003ctd>Arrows move, Enter activates, Escape closes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Each half is its own Tab stop unless the pair sits inside a \u003ca href=\"#Toolbar\" data-term=\"Toolbar\">toolbar\u003c/a>. When the menu closes with Escape, focus returns to the arrow.\u003c/p>\u003cp>A common structural bug is nesting the arrow inside the main button. HTML does not allow interactive content inside a \u003ccode>&lt;button&gt;\u003c/code>, and clicks on the arrow can also trigger the main action. Keep them as siblings and join them visually with CSS.\u003c/p>\u003cp>The arrow needs its own accessible name, because a chevron alone is announced as an unnamed button. It also needs a usable size: narrow arrows often fall below the 24 by 24 CSS pixel \u003ca href=\"#Touch%20target\" data-term=\"Touch target\">touch target\u003c/a> minimum in WCAG 2.5.8.\u003c/p>\u003cp>Some products remember the last chosen option and make it the new default. If you do this, update the visible label, or people will press &quot;Merge&quot; and get a different merge from the one they expect.\u003c/p>","avoid":"","usage":["Clicking the little arrow also fires the deploy.","The arrow is nested inside the main button. Split the button into two siblings so the click only opens the menu."],"out":[0,36,6,106]},{"name":"Segmented control","section":0,"description":"A row of joined options where one is active, used to choose a view or value from a small set.","body":"\u003cp>A segmented control is a row of joined options where one is active, such as Day, Week and Month on a calendar. It keeps every choice visible and changes with one click. Use it for a small set of short labels. For a long list, or labels that do not fit, a \u003ca href=\"#Select\" data-term=\"Select\">select\u003c/a> is a better fit.\u003c/p>\u003cp>The look does not define the semantics, and ARIA, the attributes that describe controls to assistive technology, has no segmented control role. Decide what the control does, then use the matching pattern.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>What it does\u003c/th>\u003cth>Build it as\u003c/th>\u003cth>Keyboard\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Sets a value\u003c/td>\u003ctd>\u003ca href=\"#Radio%20group\" data-term=\"Radio group\">Radio group\u003c/a>\u003c/td>\u003ctd>Arrows move and choose\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shows a different panel\u003c/td>\u003ctd>\u003ca href=\"#Tabs\" data-term=\"Tabs\">Tabs\u003c/a>\u003c/td>\u003ctd>Arrows move between tabs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Turns options on independently\u003c/td>\u003ctd>\u003ca href=\"#Toggle%20button\" data-term=\"Toggle button\">Toggle buttons\u003c/a>\u003c/td>\u003ctd>Tab, then Enter or Space\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>For the value case, native radio inputs provide the behaviour without scripting. Hide the circle visually and style the label.\u003c/p>\u003cpre>\u003ccode>&lt;fieldset class=&quot;segmented&quot;&gt;\n  &lt;legend&gt;Calendar view&lt;/legend&gt;\n  &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;view&quot; value=&quot;day&quot; /&gt; Day&lt;/label&gt;\n  &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;view&quot; value=&quot;week&quot; checked /&gt; Week&lt;/label&gt;\n  &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;view&quot; value=&quot;month&quot; /&gt; Month&lt;/label&gt;\n&lt;/fieldset&gt;\u003c/code>\u003c/pre>\u003cp>The common way this breaks is hiding the inputs with \u003ccode>display: none\u003c/code>. That removes them from the keyboard and the accessibility tree, so the control works only with a mouse. Clip them visually or set \u003ccode>opacity: 0\u003c/code> on an input that stays in the layout, and show focus on the label with \u003ccode>:has(:focus-visible)\u003c/code>.\u003c/p>\u003cp>Two other problems recur. The active segment is often marked by a subtle tint alone, which fails WCAG 1.4.1 if colour is the only cue. Labels can also overflow when the page is zoomed, because the row cannot wrap. WCAG 1.4.10 expects content to reflow at a width of 320 CSS pixels, so let the segments wrap or change to a select at a narrow \u003ca href=\"#Breakpoint\" data-term=\"Breakpoint\">breakpoint\u003c/a>.\u003c/p>","avoid":"","usage":["I can't reach the Week and Month options with the keyboard.","The radios are \u003ccode>display: none\u003c/code> in the segmented control. Hide them visually instead so they stay focusable."],"out":[12,10,33,2,84]},{"name":"Floating action button","section":0,"description":"A prominent round button fixed above the content, usually in a bottom corner, for a screen's main action.","body":"\u003cp>A floating action \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>, often shortened to FAB, is a prominent button fixed above the content, usually in a bottom corner of a mobile screen. It holds the main action on that screen, such as composing a message. Use it when one action dominates and the user needs it at any scroll position. If a screen has several equal actions, or the action fits in the page header or a \u003ca href=\"#Toolbar\" data-term=\"Toolbar\">toolbar\u003c/a>, an ordinary button is simpler.\u003c/p>\u003cp>The FAB has no special role. Build it as a native \u003ccode>&lt;button&gt;\u003c/code> with an accessible name, since most FABs show only an icon. Tab reaches it, and Enter or Space activates it.\u003c/p>\u003cpre>\u003ccode>.fab {\n  position: fixed;\n  inset-block-end: calc(16px + env(safe-area-inset-bottom));\n  inset-inline-end: 16px;\n}\u003c/code>\u003c/pre>\u003cp>The common failure is covering content. The last row of a list ends up under the button, so its menu or link cannot be tapped. Reserve space at the end of the scrolling content and account for the device \u003ca href=\"#Safe%20area\" data-term=\"Safe area\">safe area\u003c/a>.\u003c/p>\u003cp>The same overlap affects keyboard users. WCAG 2.4.11 requires that a focused element is not entirely hidden by author-created content, and a fixed button can hide one as the page scrolls to it. Setting \u003ccode>scroll-padding-block-end\u003c/code> on the scroll container keeps focused items clear.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Problem\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Last list item is covered\u003c/td>\u003ctd>Add bottom padding to the list\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focused element sits underneath\u003c/td>\u003ctd>Use \u003ccode>scroll-padding-block-end\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Clashes with tab bar\u003c/td>\u003ctd>Offset it above \u003ca href=\"#Bottom%20navigation\" data-term=\"Bottom navigation\">bottom navigation\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Fixed positioning changes where the button appears, but not its place in the Tab order, which follows the DOM. A FAB at the end of the markup is reached last.\u003c/p>\u003cp>If the button expands into several actions, treat it as a menu button with \u003ccode>aria-haspopup=&quot;menu&quot;\u003c/code> and \u003ccode>aria-expanded\u003c/code>, and follow the \u003ca href=\"#Dropdown%20menu\" data-term=\"Dropdown menu\">dropdown menu\u003c/a> keyboard behaviour.\u003c/p>","avoid":"","usage":["I can't tap the kebab menu on the last row. The compose button is on top of it.","The FAB overlaps the list end. Add bottom padding to the list that matches its height."],"out":[0,6,83,39,36]},{"name":"Toolbar","section":0,"description":"A labelled group of related controls that takes one Tab stop and uses arrow keys to move between them.","body":"\u003cp>A toolbar is a labelled group of related controls, such as the formatting row above a \u003ca href=\"#Rich%20text%20editor\" data-term=\"Rich text editor\">rich text editor\u003c/a>. In the ARIA sense, using \u003ccode>role=&quot;toolbar&quot;\u003c/code>, the whole group takes a single Tab stop and arrow keys move between its controls. This keeps a keyboard user from pressing Tab twenty times to get past a row of formatting commands.\u003c/p>\u003cp>The WAI-ARIA Authoring Practices recommend the role only for groups of three or more controls. For a pair of \u003ca href=\"#Button\" data-term=\"Button\">buttons\u003c/a>, or a row of unrelated actions, use a plain container or \u003ccode>role=&quot;group&quot;\u003c/code> and leave each one as a normal Tab stop.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Action in a horizontal toolbar\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tab, Shift+Tab\u003c/td>\u003ctd>Move focus into or out of the toolbar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Right, Left Arrow\u003c/td>\u003ctd>Move to the next or previous control\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Home, End\u003c/td>\u003ctd>Optionally move to the first or last control\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter, Space\u003c/td>\u003ctd>Activate the focused control\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>In a vertical toolbar, set \u003ccode>aria-orientation=&quot;vertical&quot;\u003c/code>, and Up and Down Arrow do the moving. Wrapping from the last control to the first is optional.\u003c/p>\u003cpre>\u003ccode>&lt;div role=&quot;toolbar&quot; aria-label=&quot;Text formatting&quot;&gt;\n  &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot; tabindex=&quot;0&quot;&gt;Bold&lt;/button&gt;\n  &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Italic&lt;/button&gt;\n  &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Underline&lt;/button&gt;\n&lt;/div&gt;\u003c/code>\u003c/pre>\u003cp>The single Tab stop is usually built with a \u003ca href=\"#Roving%20tabindex\" data-term=\"Roving tabindex\">roving tabindex\u003c/a>, where one control has \u003ccode>tabindex=&quot;0&quot;\u003c/code> and the rest have \u003ccode>-1\u003c/code>. On first entry, focus goes to the first enabled control. On return, it can go back to the last one used.\u003c/p>\u003cp>The common bug is adding the role without the keyboard behaviour. A screen reader then announces a toolbar, but arrow keys do nothing. The reverse problem comes from controls that need the same arrow keys, such as a text input or \u003ca href=\"#Slider\" data-term=\"Slider\">slider\u003c/a> in a horizontal toolbar. Avoid them, or include only one and place it last. Disabled controls are usually skipped, but can stay focusable when users need to discover them.\u003c/p>","avoid":"","usage":["Tabbing through the editor takes forever because every format button is a stop.","Make it a real toolbar with one Tab stop and arrow keys between the buttons."],"out":[22,0,107,17]},{"name":"Text field","section":1,"description":"A single-line input for short typed values such as a name, email address or phone number.","body":"\u003cp>A text field is a single-line input for short typed values, such as a name, email address or phone number. Use the native \u003ccode>&lt;input&gt;\u003c/code> element with a visible \u003ccode>&lt;label&gt;\u003c/code>. For content that may run over several lines, use a \u003ca href=\"#Textarea\" data-term=\"Textarea\">textarea\u003c/a>. When the value must come from a known list, use a \u003ca href=\"#Select\" data-term=\"Select\">select\u003c/a> or \u003ca href=\"#Combobox\" data-term=\"Combobox\">combobox\u003c/a>.\u003c/p>\u003cp>The \u003ccode>type\u003c/code> attribute changes the on-screen keyboard and the validation the browser performs, while the field looks much the same.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Value\u003c/th>\u003cth>Use for\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>text\u003c/code>\u003c/td>\u003ctd>General short text\u003c/td>\u003ctd>No format check\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>email\u003c/code>\u003c/td>\u003ctd>Email addresses\u003c/td>\u003ctd>Format check, keyboard with \u003ccode>@\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>tel\u003c/code>\u003c/td>\u003ctd>Phone numbers\u003c/td>\u003ctd>Phone keypad, no format check\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>url\u003c/code>\u003c/td>\u003ctd>Web addresses\u003c/td>\u003ctd>Format check, URL keyboard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>password\u003c/code>\u003c/td>\u003ctd>Secrets\u003c/td>\u003ctd>Masks characters\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cpre>\u003ccode>&lt;label for=&quot;email&quot;&gt;Work email&lt;/label&gt;\n&lt;input id=&quot;email&quot; name=&quot;email&quot; type=&quot;email&quot; autocomplete=&quot;email&quot; /&gt;\u003c/code>\u003c/pre>\u003cp>The \u003ccode>autocomplete\u003c/code> attribute tells browsers and password managers what the field holds, so they can fill it in. WCAG 1.3.5 expects this on fields that collect information about the user.\u003c/p>\u003cp>A common failure is using a placeholder as the label. The text disappears as soon as the user starts typing, so anyone who pauses or returns to check the field cannot tell what it asks for. A placeholder may add an example, but the label should stay visible. The \u003ca href=\"#Form%20field\" data-term=\"Form field\">form field\u003c/a> entry covers how the label, hint and error fit together.\u003c/p>\u003cp>A native input needs no keyboard work: Tab focuses it, and arrows, Home and End move the caret. Pressing Enter usually submits the surrounding form.\u003c/p>\u003cp>Use \u003ccode>readonly\u003c/code> when a value should be visible, focusable and submitted but not edited. A \u003ccode>disabled\u003c/code> field is skipped by Tab and is not submitted. Blocking paste makes entry harder, especially for people using password managers, so leave it enabled.\u003c/p>","avoid":"","usage":["Users keep emailing to ask what the second box on the signup form is for.","Its only label is a placeholder, so it vanishes on typing. Give the text field a real label."],"out":[8,12,13,23]},{"name":"Textarea","section":1,"description":"A multi-line plain text input for longer content such as comments, messages and descriptions.","body":"\u003cp>A textarea is a multi-line plain text input for longer content such as comments, messages and descriptions. Use the native \u003ccode>&lt;textarea&gt;\u003c/code> with a visible \u003ccode>&lt;label&gt;\u003c/code>. For a short single value, use a \u003ca href=\"#Text%20field\" data-term=\"Text field\">text field\u003c/a>. If people need headings, links or bold, use a \u003ca href=\"#Rich%20text%20editor\" data-term=\"Rich text editor\">rich text editor\u003c/a>.\u003c/p>\u003cp>Initial content goes between the tags rather than in a \u003ccode>value\u003c/code> attribute, and any whitespace there becomes part of the value. Indenting the closing tag in a template is a common reason a textarea appears to start with stray spaces.\u003c/p>\u003cpre>\u003ccode>&lt;label for=&quot;note&quot;&gt;Delivery note&lt;/label&gt;\n&lt;textarea id=&quot;note&quot; name=&quot;note&quot; rows=&quot;4&quot; maxlength=&quot;500&quot;&gt;&lt;/textarea&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Attribute or property\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>rows\u003c/code>\u003c/td>\u003ctd>Visible lines. Defaults to 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cols\u003c/code>\u003c/td>\u003ctd>Visible width in average characters. Defaults to 20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>maxlength\u003c/code>\u003c/td>\u003ctd>Limit in UTF-16 code units\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>wrap=&quot;hard&quot;\u003c/code>\u003c/td>\u003ctd>Inserts line breaks on submit. Requires \u003ccode>cols\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>resize\u003c/code> (CSS)\u003c/td>\u003ctd>Controls the drag handle\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Character limits are a frequent source of bugs. \u003ccode>maxlength\u003c/code> counts UTF-16 code units, so many emoji count as two. Line breaks are normalised to two characters on submission, so a value that fits the counter in the browser can exceed a server limit. Pasted text can also be cut off at the limit with no message. Show a live count, validate on the server using the same counting rule, and tell the user when text was trimmed.\u003c/p>\u003cp>Enter inserts a new line and Tab moves focus to the next control. Do not intercept Tab to insert indentation unless the user has a documented way to leave, because WCAG 2.1.2 forbids keyboard traps.\u003c/p>\u003cp>Removing the resize handle takes away a control people use to read their own text. For auto-growing fields, MDN lists \u003ccode>field-sizing: content\u003c/code> as newly available across current browsers since June 2026. Older browsers ignore it, so keep a sensible \u003ccode>rows\u003c/code> value.\u003c/p>","avoid":"","usage":["The form says 500 characters left, but the API rejects it as too long.","The textarea counts a newline as one and the submitted value counts it as two. Match the server's rule."],"out":[7,22]},{"name":"Checkbox","section":1,"description":"A control for an independent yes-or-no choice, or for choosing any number of options from a group.","body":"\u003cp>A checkbox is a control for an independent yes-or-no choice, or for choosing any number of options from a group. Use the native \u003ccode>&lt;input type=&quot;checkbox&quot;&gt;\u003c/code> with a \u003ccode>&lt;label&gt;\u003c/code>. Clicking the label toggles the box, which gives a larger target for free.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Control\u003c/th>\u003cth>Choices\u003c/th>\u003cth>Takes effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Checkbox\u003c/td>\u003ctd>Zero, one or many\u003c/td>\u003ctd>Usually on form submit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Radio%20group\" data-term=\"Radio group\">Radio group\u003c/a>\u003c/td>\u003ctd>Exactly one\u003c/td>\u003ctd>Usually on form submit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Switch\" data-term=\"Switch\">Switch\u003c/a>\u003c/td>\u003ctd>On or off\u003c/td>\u003ctd>Immediately\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Space toggles a focused checkbox. Enter does not, and in a form it may submit instead. Each box is its own Tab stop. Screen readers (software that reads the interface aloud) announce the label, the role and whether it is checked.\u003c/p>\u003cpre>\u003ccode>&lt;fieldset&gt;\n  &lt;legend&gt;Notify me about&lt;/legend&gt;\n  &lt;label&gt;&lt;input type=&quot;checkbox&quot; name=&quot;notify&quot; value=&quot;invoices&quot; /&gt; Invoices&lt;/label&gt;\n  &lt;label&gt;&lt;input type=&quot;checkbox&quot; name=&quot;notify&quot; value=&quot;reports&quot; /&gt; Reports&lt;/label&gt;\n&lt;/fieldset&gt;\u003c/code>\u003c/pre>\u003cp>Wrap related boxes in a \u003ccode>&lt;fieldset&gt;\u003c/code> with a \u003ccode>&lt;legend&gt;\u003c/code>, so the group's question is available alongside each option.\u003c/p>\u003cp>An unchecked checkbox sends nothing on submission, so the server receives no field at all rather than \u003ccode>false\u003c/code>. An update handler that only writes fields it receives will leave the old value in place, and the user's &quot;off&quot; never saves. Treat a missing field as false, or send the state explicitly. Several boxes sharing a \u003ccode>name\u003c/code> send one pair each, so the server must read all values and not just the last.\u003c/p>\u003cp>A parent checkbox for a group can show a third, partly checked state. Set it from script with \u003ccode>input.indeterminate = true\u003c/code>, as no HTML attribute exists for it. The property is visual and has no effect on submission, which depends only on \u003ccode>checked\u003c/code>. For custom controls, the equivalent is \u003ccode>aria-checked=&quot;mixed&quot;\u003c/code>.\u003c/p>\u003cp>If you restyle the box, keep the real input in place and visually hidden. Using \u003ccode>display: none\u003c/code> removes it from the keyboard.\u003c/p>","avoid":"","usage":["People untick marketing emails, save, and it comes back ticked.","An unchecked checkbox isn't submitted, so our update skips the field. Treat missing as false."],"out":[10,11]},{"name":"Radio group","section":1,"description":"A set of options where exactly one can be chosen, with arrow keys moving the choice inside a single Tab stop.","body":"\u003cp>A radio group is a set of options where only one can be chosen at a time, such as a delivery speed. All options stay visible, so people can compare them before deciding. Build it from native \u003ccode>&lt;input type=&quot;radio&quot;&gt;\u003c/code> elements that share a \u003ccode>name\u003c/code>, wrapped in a \u003ccode>&lt;fieldset&gt;\u003c/code> with a \u003ccode>&lt;legend&gt;\u003c/code> that states the question.\u003c/p>\u003cpre>\u003ccode>&lt;fieldset&gt;\n  &lt;legend&gt;Delivery speed&lt;/legend&gt;\n  &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;speed&quot; value=&quot;standard&quot; checked /&gt; Standard&lt;/label&gt;\n  &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;speed&quot; value=&quot;express&quot; /&gt; Express&lt;/label&gt;\n&lt;/fieldset&gt;\u003c/code>\u003c/pre>\u003cp>The group behaves as one Tab stop, and the arrow keys change the choice.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Behaviour\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tab\u003c/td>\u003ctd>Enters the group at the checked option, or the first one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Down, Right Arrow\u003c/td>\u003ctd>Moves to the next option and checks it, wrapping at the end\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Up, Left Arrow\u003c/td>\u003ctd>Moves to the previous option and checks it, wrapping\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Space\u003c/td>\u003ctd>Checks the focused option if it is unchecked\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Because arrow keys change the value as they move, a handler that acts on every change breaks keyboard use. If choosing an option reloads results or navigates away, a keyboard user cannot get past the first option. WCAG 3.2.2 says changing a setting must not cause a change of context without warning. Apply the choice with a separate \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>, or limit the change to updating content nearby.\u003c/p>\u003cp>Once a radio is checked, a user cannot uncheck it by clicking it again. An optional question therefore needs an explicit &quot;None&quot; option. If nothing is checked, the group is left out of the submitted data entirely, and \u003ccode>required\u003c/code> on any radio in the group makes one choice mandatory.\u003c/p>\u003cp>Compared with its alternatives, a radio group suits a short list that benefits from being read in full. A \u003ca href=\"#Select\" data-term=\"Select\">select\u003c/a> takes less room for a long list. A \u003ca href=\"#Checkbox\" data-term=\"Checkbox\">checkbox\u003c/a> group is for choosing several, and a \u003ca href=\"#Segmented%20control\" data-term=\"Segmented control\">segmented control\u003c/a> is a compact visual treatment of the same single choice.\u003c/p>","avoid":"","usage":["With the keyboard, pressing Down on the sort options reloads the page every time.","The radio group submits on change. Add an Apply button so arrow keys can move freely."],"out":[0,12,9,4]},{"name":"Switch","section":1,"description":"An on-off control for a setting that takes effect immediately, without a separate save step.","body":"\u003cp>A switch is an on-off control for a setting that takes effect immediately, such as turning on email alerts. People expect the change to apply at once. The usual confusion comes from placing one inside a form with a Save \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>: the user flips it, leaves the page, and the setting was never stored. If a choice applies only on submit, use a \u003ca href=\"#Checkbox\" data-term=\"Checkbox\">checkbox\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Control\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Applies\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Switch\u003c/td>\u003ctd>A setting is on or off\u003c/td>\u003ctd>Immediately\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Checkbox\u003c/td>\u003ctd>An option is chosen\u003c/td>\u003ctd>Usually on submit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Toggle%20button\" data-term=\"Toggle button\">Toggle button\u003c/a>\u003c/td>\u003ctd>A command is active\u003c/td>\u003ctd>Immediately\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The simplest robust build is a native checkbox with the \u003ccode>switch\u003c/code> role. It keeps focus, form and label behaviour, and assistive technology announces it as a switch.\u003c/p>\u003cpre>\u003ccode>&lt;label&gt;\n  &lt;input type=&quot;checkbox&quot; role=&quot;switch&quot; name=&quot;alerts&quot; checked /&gt;\n  Email alerts\n&lt;/label&gt;\u003c/code>\u003c/pre>\u003cp>HTML also has a newer \u003ccode>switch\u003c/code> attribute on checkbox inputs. MDN describes it as experimental with limited support, and browsers without support ignore it and show a normal checkbox.\u003c/p>\u003cp>Space toggles a focused switch. The WAI-ARIA Authoring Practices list Enter as optional, and a native checkbox does not toggle on Enter. A custom element needs \u003ccode>role=&quot;switch&quot;\u003c/code>, \u003ccode>aria-checked\u003c/code>, \u003ccode>tabindex=&quot;0&quot;\u003c/code> and its own key handling.\u003c/p>\u003cp>Keep the label constant. &quot;Email alerts, on&quot; is clear, whereas a label that changes to &quot;Email alerts disabled&quot; can be announced as &quot;Email alerts disabled, on&quot;. The state also needs more than a colour change to satisfy WCAG 1.4.1, so use thumb position, an icon or on and off text.\u003c/p>\u003cp>Because a switch applies at once, the save can fail after the thumb has already moved. Show a pending state if the request is slow. On failure, move the switch back and report the error in text, for example with a \u003ca href=\"#Toast\" data-term=\"Toast\">toast\u003c/a>, so the display does not claim a setting that was not saved.\u003c/p>","avoid":"","usage":["I turned off alerts, but I'm still getting emails.","The switch only updates local state until you press Save. Either persist it on change or use a checkbox."],"out":[0,9,2,53]},{"name":"Select","section":1,"description":"A native control that opens a list of predefined options and shows the chosen one when closed.","body":"\u003cp>A select is a control that opens a list of predefined options and shows the chosen one when closed, such as a country picker. Use the native \u003ccode>&lt;select&gt;\u003c/code> element whenever it fits. It comes with keyboard support, type-ahead and the operating system's picker on phones, all of which a custom replacement has to rebuild.\u003c/p>\u003cpre>\u003ccode>&lt;label for=&quot;country&quot;&gt;Country&lt;/label&gt;\n&lt;select id=&quot;country&quot; name=&quot;country&quot; required&gt;\n  &lt;option value=&quot;&quot;&gt;Choose a country&lt;/option&gt;\n  &lt;optgroup label=&quot;Europe&quot;&gt;\n    &lt;option value=&quot;fr&quot;&gt;France&lt;/option&gt;\n    &lt;option value=&quot;de&quot;&gt;Germany&lt;/option&gt;\n  &lt;/optgroup&gt;\n&lt;/select&gt;\u003c/code>\u003c/pre>\u003cp>The empty first option makes \u003ccode>required\u003c/code> work: if the user leaves it, the form reports the field as missing. Without it, the first real option is submitted silently, so a form can collect a default country nobody chose.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Situation\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A few options worth comparing\u003c/td>\u003ctd>\u003ca href=\"#Radio%20group\" data-term=\"Radio group\">Radio group\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A longer fixed list\u003c/td>\u003ctd>Select\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hundreds of options, or typing helps\u003c/td>\u003ctd>\u003ca href=\"#Combobox\" data-term=\"Combobox\">Combobox\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Several values allowed\u003c/td>\u003ctd>\u003ca href=\"#Multi-select\" data-term=\"Multi-select\">Multi-select\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A list of actions, not values\u003c/td>\u003ctd>\u003ca href=\"#Dropdown%20menu\" data-term=\"Dropdown menu\">Dropdown menu\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A single-choice dropdown is exposed to assistive technology with the \u003ccode>combobox\u003c/code> role, and a list with \u003ccode>size\u003c/code> above 1 or the \u003ccode>multiple\u003c/code> attribute is exposed as \u003ccode>listbox\u003c/code>. Exact key behaviour varies by browser and platform. In general, Tab focuses it, arrow keys or Space work with the list, and typing jumps to a matching option.\u003c/p>\u003cp>A select that navigates or submits as soon as its value changes can break keyboard use. On some browsers, arrowing through options fires a change for each one, so keyboard users are sent away on the first press. WCAG 3.2.2 requires advance warning for this kind of context change, so use a submit \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> instead.\u003c/p>\u003cp>Styling has been the main reason teams replace the element. Customizable select, enabled with \u003ccode>appearance: base-select\u003c/code>, allows full styling of the button and picker. MDN lists it as limited availability, but unsupported browsers fall back to a standard select, so it works as an enhancement.\u003c/p>","avoid":"","usage":["Why do so many signups list Afghanistan?","The select defaults to the first country. Add an empty option and mark the field required."],"out":[10,13,14,36,0]},{"name":"Combobox","section":1,"description":"An input paired with a popup of suggestions, letting people type to filter and choose a value from a long list.","body":"\u003cp>A combobox is an input paired with a popup of suggestions, so people can type to filter a long list and then choose a value. City and assignee pickers are common examples. Choose it over a \u003ca href=\"#Select\" data-term=\"Select\">select\u003c/a> when the list is too long to scan. If the value is free text with occasional hints, the native \u003ccode>&lt;datalist&gt;\u003c/code> is simpler, although its popup cannot be styled and some screen reader and browser pairings do not announce it.\u003c/p>\u003cp>The WAI-ARIA Authoring Practices define two kinds. An editable combobox accepts typing, and a select-only combobox behaves like a custom select with no text entry. In both, DOM focus stays on the input while \u003ccode>aria-activedescendant\u003c/code> points to the highlighted option, so the user can keep typing.\u003c/p>\u003cpre>\u003ccode>&lt;label for=&quot;city&quot;&gt;City&lt;/label&gt;\n&lt;input id=&quot;city&quot; role=&quot;combobox&quot; aria-expanded=&quot;true&quot;\n       aria-controls=&quot;city-list&quot; aria-autocomplete=&quot;list&quot;\n       aria-activedescendant=&quot;city-2&quot; /&gt;\n&lt;ul id=&quot;city-list&quot; role=&quot;listbox&quot;&gt;\n  &lt;li id=&quot;city-1&quot; role=&quot;option&quot;&gt;Paris&lt;/li&gt;\n  &lt;li id=&quot;city-2&quot; role=&quot;option&quot; aria-selected=&quot;true&quot;&gt;Porto&lt;/li&gt;\n&lt;/ul&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Down Arrow\u003c/td>\u003ctd>Opens the popup or moves to the next option\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Up Arrow\u003c/td>\u003ctd>Optionally moves to the previous or last option\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter\u003c/td>\u003ctd>Accepts the highlighted option\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Escape\u003c/td>\u003ctd>Closes the popup, and may then clear the input\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alt+Down Arrow\u003c/td>\u003ctd>Optionally opens the popup without moving into it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tab\u003c/td>\u003ctd>Leaves the field. The popup is not a Tab stop\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Several failures recur. Enter can submit the surrounding form while the popup is open, because the handler did not prevent the default. \u003ccode>aria-expanded\u003c/code> may stay \u003ccode>false\u003c/code> after opening, so screen readers never report the list. Filtering may change the options without announcing anything, so add a \u003ccode>role=&quot;status&quot;\u003c/code> message such as &quot;4 results&quot;, which WCAG 4.1.3 expects for this kind of update.\u003c/p>\u003cp>Async options add a race: a slow response for &quot;pa&quot; can arrive after the one for &quot;par&quot; and replace it. Discard stale responses. Decide also what happens to text that matches no option when focus leaves, since keeping it silently can submit an invalid value.\u003c/p>","avoid":"","usage":["Pressing Enter on a suggestion submits the whole form.","The combobox isn't preventing the default. Enter should accept the option while the popup is open."],"out":[12]},{"name":"Multi-select","section":1,"description":"A control for choosing any number of values from a known list of options.","body":"\u003cp>A multi-\u003ca href=\"#Select\" data-term=\"Select\">select\u003c/a> is a control for choosing any number of values from a known list, such as assigning several labels to a ticket. Pick a form based on how long the list is and how much room you have.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Form\u003c/th>\u003cth>Fits\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Checkbox\" data-term=\"Checkbox\">Checkbox\u003c/a> group\u003c/td>\u003ctd>Short lists\u003c/td>\u003ctd>Takes vertical space\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;select multiple&gt;\u003c/code>\u003c/td>\u003ctd>Basic internal tools\u003c/td>\u003ctd>Modifier keys are hard to discover\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Listbox with \u003ccode>aria-multiselectable\u003c/code>\u003c/td>\u003ctd>Custom scrolling lists\u003c/td>\u003ctd>You build all keyboard behaviour\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Combobox\" data-term=\"Combobox\">Combobox\u003c/a> with \u003ca href=\"#Chip\" data-term=\"Chip\">chips\u003c/a>\u003c/td>\u003ctd>Long, searchable lists\u003c/td>\u003ctd>Most complex to build\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>If people need to add values that are not in the list, use a \u003ca href=\"#Tag%20input\" data-term=\"Tag input\">tag input\u003c/a>.\u003c/p>\u003cp>The native \u003ccode>&lt;select multiple&gt;\u003c/code> has a well-known trap. A plain click replaces the whole selection, so someone carefully choosing items with Ctrl or Command can lose them all with one unmodified click. MDN notes that its keyboard mechanisms are not standardised and differ across browsers and operating systems.\u003c/p>\u003cp>For a custom listbox, the WAI-ARIA Authoring Practices recommend a model where moving focus does not change the selection.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Up, Down Arrow\u003c/td>\u003ctd>Move focus\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Space\u003c/td>\u003ctd>Toggle the focused option\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shift+Space\u003c/td>\u003ctd>Optionally select a contiguous range\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ctrl+A\u003c/td>\u003ctd>Optionally select or clear all\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Mark options with \u003ccode>aria-selected\u003c/code> or \u003ccode>aria-checked\u003c/code>, not both, and use the same one across the product. Keep the popup open after each choice so people can pick several in a row.\u003c/p>\u003cp>Filtering causes a recurring problem: chosen items vanish from the list when the search text no longer matches them, and users think their picks were lost. Show the current selection outside the filtered list.\u003c/p>\u003cp>On submission, each value is sent as its own pair, such as \u003ccode>label=bug&amp;label=urgent\u003c/code>. A server that reads only one value will silently keep just the last one.\u003c/p>","avoid":"","usage":["I picked eight labels, clicked one more, and the other eight disappeared.","That's the native multi-select needing Ctrl. Replace it with a checkbox list."],"out":[12,9,13,73,15]},{"name":"Tag input","section":1,"description":"A text input that turns each entered value into a removable tag, for free-form lists such as labels or email recipients.","body":"\u003cp>A tag input is a text input that turns each entered value into a removable item, such as labels on an article or recipients in an email. Each item is usually drawn as a \u003ca href=\"#Chip\" data-term=\"Chip\">chip\u003c/a> inside the field. Use it when people can add values of their own. If the values must come from a fixed list, a \u003ca href=\"#Multi-select\" data-term=\"Multi-select\">multi-select\u003c/a> prevents typos and duplicates.\u003c/p>\u003cp>The WAI-ARIA Authoring Practices have no tag input pattern, so the behaviour below is convention built from native parts. A simple structure is a list of tags, each with a real remove \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>, followed by a labelled text input.\u003c/p>\u003cpre>\u003ccode>&lt;label for=&quot;tags&quot;&gt;Labels&lt;/label&gt;\n&lt;ul&gt;\n  &lt;li&gt;design &lt;button type=&quot;button&quot; aria-label=&quot;Remove design&quot;&gt;×&lt;/button&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;input id=&quot;tags&quot; aria-describedby=&quot;tags-hint&quot; /&gt;\n&lt;p id=&quot;tags-hint&quot;&gt;Press Enter or comma to add a label.&lt;/p&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key or action\u003c/th>\u003cth>Common behaviour\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Enter or comma\u003c/td>\u003ctd>Commits the typed text as a tag\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Backspace, empty input\u003c/td>\u003ctd>Focuses or removes the last tag\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tab\u003c/td>\u003ctd>Moves on, and should commit or keep pending text\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paste\u003c/td>\u003ctd>Splits a list into separate tags\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Enter may submit the surrounding form instead of adding the tag, so prevent the default only when there is text to commit. Text left in the input when the user tabs away can be lost silently. Backspace that deletes a tag at once is easy to trigger by accident, so many implementations focus the tag on the first press and remove it on the second.\u003c/p>\u003cp>Input method editors, used to compose characters in languages such as Chinese and Japanese, also use Enter to confirm text. A handler that ignores this creates a broken tag mid-word. Check \u003ccode>event.isComposing\u003c/code> before committing.\u003c/p>\u003cp>When a tag is removed, its button disappears and focus would fall to the page body. Move focus to the next tag or back to the input. Announce additions and removals through a \u003ccode>role=&quot;status&quot;\u003c/code> region, since nothing else tells a screen reader user the list changed.\u003c/p>","avoid":"","usage":["Japanese users get half-finished tags every time they confirm a word.","Enter is committing during IME composition. Have the tag input check \u003ccode>isComposing\u003c/code> first."],"out":[73,14,0]},{"name":"Number input","section":1,"description":"A field for numeric quantities, with step controls and range limits, and a poor fit for digit strings such as card numbers.","body":"\u003cp>A number input is a field for numeric quantities, such as how many tickets to buy. The native \u003ccode>&lt;input type=&quot;number&quot;&gt;\u003c/code> validates the entry, supports \u003ccode>min\u003c/code>, \u003ccode>max\u003c/code> and \u003ccode>step\u003c/code>, and is exposed to assistive technology with the \u003ccode>spinbutton\u003c/code> role. Use it for values where adding or subtracting one makes sense. For an approximate value, use a \u003ca href=\"#Slider\" data-term=\"Slider\">slider\u003c/a>.\u003c/p>\u003cp>Many values that contain digits are not numbers. Card numbers, postal codes, phone numbers and one-time codes should not use it, because arrow keys can change them and leading zeros have no numeric meaning. For these, use a \u003ca href=\"#Text%20field\" data-term=\"Text field\">text field\u003c/a> with \u003ccode>inputmode\u003c/code>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Value\u003c/th>\u003cth>Markup\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Quantity\u003c/td>\u003ctd>\u003ccode>type=&quot;number&quot; min=&quot;1&quot; step=&quot;1&quot;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Price\u003c/td>\u003ctd>\u003ccode>type=&quot;text&quot; inputmode=&quot;decimal&quot;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Postal code\u003c/td>\u003ctd>\u003ccode>type=&quot;text&quot; autocomplete=&quot;postal-code&quot;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Numeric PIN\u003c/td>\u003ctd>\u003ccode>type=&quot;text&quot; inputmode=&quot;numeric&quot;\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The default \u003ccode>step\u003c/code> is 1, so a value of \u003ccode>1.5\u003c/code> is invalid unless you set \u003ccode>step=&quot;0.5&quot;\u003c/code> or \u003ccode>step=&quot;any&quot;\u003c/code>. This is a frequent reason a form refuses a price that looks correct. When the typed text is not a valid number, the input's \u003ccode>.value\u003c/code> is typically an empty string, so code can read a blank where the user can see text. Check \u003ccode>input.validity.badInput\u003c/code> to tell the two apart.\u003c/p>\u003cp>For a custom control, the WAI-ARIA Authoring Practices define these keys for the \u003ccode>spinbutton\u003c/code> role.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Up, Down Arrow\u003c/td>\u003ctd>Increase or decrease by one step\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Page Up, Page Down\u003c/td>\u003ctd>Optionally change by a larger step\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Home, End\u003c/td>\u003ctd>Go to the minimum or maximum, if known\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Focus stays in the text field, and increment \u003ca href=\"#Button\" data-term=\"Button\">buttons\u003c/a> are usually left out of the Tab order because the arrow keys do the same job. Set \u003ccode>aria-valuenow\u003c/code>, \u003ccode>aria-valuemin\u003c/code> and \u003ccode>aria-valuemax\u003c/code>, and \u003ccode>aria-invalid=&quot;true&quot;\u003c/code> when the value is out of range.\u003c/p>","avoid":"","usage":["The price field rejects 19.99 with a 'nearest valid value' error.","That number input has the default step of 1. Set \u003ccode>step=&quot;0.01&quot;\u003c/code>, or use text with \u003ccode>inputmode=&quot;decimal&quot;\u003c/code>."],"out":[17,7,0]},{"name":"Slider","section":1,"description":"A control for choosing a value along a range by moving a thumb, suited to approximate values such as volume.","body":"\u003cp>A slider is a control for choosing a value along a range by moving a thumb, such as volume or brightness. It suits values where the approximate position matters more than the exact figure. If people need a specific value, such as a price of 149, use a \u003ca href=\"#Number%20input\" data-term=\"Number input\">number input\u003c/a>, or pair the two so either can set the value.\u003c/p>\u003cp>Use the native \u003ccode>&lt;input type=&quot;range&quot;&gt;\u003c/code>, which has the \u003ccode>slider\u003c/code> role and built-in keyboard support. It defaults to a range of 0 to 100 with a starting value halfway along, so an untouched slider can submit 50 as if the user chose it.\u003c/p>\u003cpre>\u003ccode>&lt;label for=&quot;volume&quot;&gt;Volume&lt;/label&gt;\n&lt;input id=&quot;volume&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;1&quot; value=&quot;4&quot; /&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Right, Up Arrow\u003c/td>\u003ctd>Increase by one step\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Left, Down Arrow\u003c/td>\u003ctd>Decrease by one step\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Home, End\u003c/td>\u003ctd>Go to the minimum or maximum\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Page Up, Page Down\u003c/td>\u003ctd>Optionally move by a larger step\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>When the raw number means little, set \u003ccode>aria-valuetext\u003c/code> so a screen reader (software that reads the interface aloud) announces something useful, such as &quot;Medium&quot; or &quot;£40&quot; rather than &quot;2&quot;. Also show the current value on screen.\u003c/p>\u003cp>WCAG 2.5.7 requires a single-pointer alternative to dragging. Letting users click or tap the track satisfies it. Native sliders generally do this, and custom ones often do not.\u003c/p>\u003cp>A range slider with two thumbs needs two focusable elements. Each is its own Tab stop, and the Tab order stays fixed even if the thumbs swap visual position. When one thumb limits the other, update the dependent \u003ccode>aria-valuemin\u003c/code> or \u003ccode>aria-valuemax\u003c/code> as it moves.\u003c/p>\u003cp>Firing a request on every \u003ccode>input\u003c/code> event makes dragging stutter. Update the display on \u003ccode>input\u003c/code> and fetch on \u003ccode>change\u003c/code>. Some touch screen readers may not operate custom sliders, so test on real devices.\u003c/p>","avoid":"","usage":["The price filter refetches on every pixel of drag, and the page locks up.","The slider is wired to \u003ccode>input\u003c/code>. Update the label there and run the query on \u003ccode>change\u003c/code>."],"out":[16]},{"name":"Date picker","section":1,"description":"A control for entering a calendar date by typing or by choosing from a month grid.","body":"\u003cp>A date picker is a control for entering a calendar date, by typing or by choosing from a month grid. The native \u003ccode>&lt;input type=&quot;date&quot;&gt;\u003c/code> handles locale display, a built-in picker and range limits. Its appearance varies by browser, but it is the first option to try.\u003c/p>\u003cpre>\u003ccode>&lt;label for=&quot;start&quot;&gt;Start date&lt;/label&gt;\n&lt;input id=&quot;start&quot; type=&quot;date&quot; min=&quot;2026-01-01&quot; max=&quot;2026-12-31&quot; /&gt;\u003c/code>\u003c/pre>\u003cp>The displayed format follows the user's locale, while \u003ccode>value\u003c/code> is always \u003ccode>yyyy-mm-dd\u003c/code>. A common bug comes from parsing it with \u003ccode>new Date(&quot;2026-03-01&quot;)\u003c/code>. JavaScript treats a date-only string as midnight UTC, so a user west of UTC sees 28 February. Keep calendar dates as plain strings unless a time zone is part of the meaning.\u003c/p>\u003cp>For a date of birth, paging back decades is slow, so a typed field or separate day, month and year inputs work better. For a date close to today, a calendar helps people see weekdays. In any custom picker, keep a typed input available too.\u003c/p>\u003cp>A custom calendar usually opens in a \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a> with a grid of days. The WAI-ARIA Authoring Practices example uses these keys.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Action in the grid\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Arrow keys\u003c/td>\u003ctd>Previous or next day, or same day by week\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Home, End\u003c/td>\u003ctd>First or last day of the week\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Page Up, Page Down\u003c/td>\u003ctd>Previous or next month\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shift+Page Up, Down\u003c/td>\u003ctd>Same month in previous or next year\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter, Space\u003c/td>\u003ctd>Choose the date and close\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Escape\u003c/td>\u003ctd>Close without choosing\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Only one day is in the Tab order at a time, using a \u003ca href=\"#Roving%20tabindex\" data-term=\"Roving tabindex\">roving tabindex\u003c/a>. The chosen day has \u003ccode>aria-selected=&quot;true&quot;\u003c/code>, and today can use \u003ccode>aria-current=&quot;date&quot;\u003c/code>. The month heading should be a polite live region so that paging is announced.\u003c/p>\u003cp>After choosing, focus returns to the trigger.\u003c/p>","avoid":"","usage":["Customers in New York book March 1st, and the confirmation says February 28th.","The date picker value is parsed as UTC. Keep it as a plain date string."],"out":[42,107]},{"name":"File upload","section":1,"description":"A control for choosing files from a device and sending them, often with a drop zone, progress and per-file errors.","body":"\u003cp>A file upload is a control for choosing files from a device and sending them to a server. The native \u003ccode>&lt;input type=&quot;file&quot;&gt;\u003c/code> opens the system file picker, works from the keyboard, and on phones can offer the camera. A custom drop zone is an addition to this control and should not replace it.\u003c/p>\u003cpre>\u003ccode>&lt;label for=&quot;receipts&quot;&gt;Upload receipts (PDF or JPEG)&lt;/label&gt;\n&lt;input id=&quot;receipts&quot; type=&quot;file&quot; name=&quot;receipts&quot;\n       accept=&quot;.pdf,image/jpeg&quot; multiple /&gt;\u003c/code>\u003c/pre>\u003cp>The \u003ccode>accept\u003c/code> attribute is only a hint to the file picker. Users can usually override it, so a wrong file type can still arrive. Check type and size in the browser for quick feedback, and validate again on the server, which is the only check that can be trusted.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>What the interface does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Choose\u003c/td>\u003ctd>Picker or drop, with accepted types and limits stated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Check\u003c/td>\u003ctd>Reject wrong type or size with a specific message\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Upload\u003c/td>\u003ctd>Show a \u003ca href=\"#Progress%20bar\" data-term=\"Progress bar\">progress bar\u003c/a> per file\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Finish\u003c/td>\u003ctd>List the file name with a remove \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fail\u003c/td>\u003ctd>Keep the file listed, with the reason and a retry\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A dropzone built only on \u003ca href=\"#Drag%20and%20drop\" data-term=\"Drag and drop\">drag and drop\u003c/a> excludes keyboard users and anyone who cannot drag. WCAG 2.5.7 requires a single-pointer alternative to dragging, and a visible &quot;Choose files&quot; control provides it.\u003c/p>\u003cp>Styled upload controls often break because the real input is hidden with \u003ccode>display: none\u003c/code>, which takes it out of the Tab order. Keep it visually hidden but focusable, or use a real button that calls \u003ccode>input.click()\u003c/code>.\u003c/p>\u003cp>Choosing the same file twice does nothing by default. The \u003ccode>change\u003c/code> event does not fire because the value did not change. Clear it after handling with \u003ccode>input.value = &quot;&quot;\u003c/code>.\u003c/p>\u003cp>Announce progress milestones and results through a \u003ccode>role=&quot;status&quot;\u003c/code> region, so that screen reader users know when the upload ends.\u003c/p>","avoid":"","usage":["If an upload fails and I pick the same file again, nothing happens.","The file upload input keeps its old value, so \u003ccode>change\u003c/code> doesn't fire. Reset it after each attempt."],"out":[57,0,108]},{"name":"OTP input","section":1,"description":"A field for a short one-time passcode sent by SMS, email or an authenticator app during sign-in.","body":"\u003cp>An OTP input is a field for a one-time passcode, the short code sent by SMS, email or an authenticator app during sign-in. Designs often show it as six separate boxes. The more robust build is one input styled to look like boxes, because a single field handles paste, autofill and deletion without any script.\u003c/p>\u003cpre>\u003ccode>&lt;label for=&quot;code&quot;&gt;Verification code&lt;/label&gt;\n&lt;input id=&quot;code&quot; name=&quot;code&quot; type=&quot;text&quot; inputmode=&quot;numeric&quot;\n       autocomplete=&quot;one-time-code&quot; maxlength=&quot;6&quot; /&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Attribute\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>autocomplete=&quot;one-time-code&quot;\u003c/code>\u003c/td>\u003ctd>Lets the browser or OS offer the code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>inputmode=&quot;numeric&quot;\u003c/code>\u003c/td>\u003ctd>Shows a digit keyboard without number rules\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>type=&quot;text&quot;\u003c/code>\u003c/td>\u003ctd>Keeps leading zeros\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>maxlength\u003c/code>\u003c/td>\u003ctd>Limits entry to the code length\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Do not use \u003ccode>type=&quot;number&quot;\u003c/code>. A \u003ca href=\"#Number%20input\" data-term=\"Number input\">number input\u003c/a> has no use for leading zeros, and its arrow keys can change the code. If a code may contain letters, drop \u003ccode>inputmode\u003c/code>.\u003c/p>\u003cp>Split boxes commonly break paste. The user copies 482913, pastes, and only the 4 appears, because the first box accepts a single character. The Understanding document for WCAG 3.3.8, Accessible Authentication (Minimum), says a code field must allow pasting or automatic filling, and calls out split fields that take only one digit on paste.\u003c/p>\u003cp>If the design requires separate boxes, each needs a label such as &quot;Digit 3 of 6&quot;, the group needs a name, paste must spread across all boxes, and Backspace in an empty box must move to the previous one. Screen reader users then hear six fields instead of one, which is the main reason to prefer the single input.\u003c/p>\u003cp>Submitting automatically on the last digit can fail WCAG 3.2.2 unless users are told in advance, and it gives no chance to correct a mistake. Keep a visible Verify \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>.\u003c/p>\u003cp>Codes expire, so state how long one lasts, offer a resend option, and report wrong or expired codes in text beside the field.\u003c/p>","avoid":"","usage":["Pasting the code from my password manager only fills the first box.","The OTP input is six separate fields. Switch to one field with \u003ccode>autocomplete=&quot;one-time-code&quot;\u003c/code>."],"out":[16,0]},{"name":"Search field","section":1,"description":"A text input for entering a query, usually inside a search landmark, that filters content or returns results.","body":"\u003cp>A search field is a text input for entering a query that filters the current page or returns results. Use \u003ccode>&lt;input type=&quot;search&quot;&gt;\u003c/code> inside the \u003ccode>&lt;search&gt;\u003c/code> element. The input is exposed to assistive technology with the \u003ccode>
