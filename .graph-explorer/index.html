searchbox\u003c/code> role, and the wrapper creates a landmark that screen reader users can jump to.\u003c/p>\u003cpre>\u003ccode>&lt;search&gt;\n  &lt;form action=&quot;/search&quot;&gt;\n    &lt;label for=&quot;q&quot;&gt;Search articles&lt;/label&gt;\n    &lt;input id=&quot;q&quot; name=&quot;q&quot; type=&quot;search&quot; /&gt;\n    &lt;button type=&quot;submit&quot;&gt;Search&lt;/button&gt;\n  &lt;/form&gt;\n&lt;/search&gt;\u003c/code>\u003c/pre>\u003cp>If \u003ccode>&lt;search&gt;\u003c/code> is not an option, \u003ccode>role=&quot;search&quot;\u003c/code> on the \u003ccode>&lt;form&gt;\u003c/code> gives the same landmark. A magnifying glass alone is not a label, so give the input a visible label or an \u003ccode>aria-label\u003c/code>, and name any icon-only \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>.\u003c/p>\u003cp>Some browsers show a clear icon, and Chrome also clears the field on Escape. Do not rely on either. If clearing matters, add your own labelled control and return focus to the input afterwards.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Query that returns a results page\u003c/td>\u003ctd>Search field\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Live filter of a visible list\u003c/td>\u003ctd>Search field with a status message\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Suggestions to choose from\u003c/td>\u003ctd>\u003ca href=\"#Combobox\" data-term=\"Combobox\">Combobox\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Jump to commands across the product\u003c/td>\u003ctd>\u003ca href=\"#Command%20palette\" data-term=\"Command palette\">Command palette\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Live results have two common failures. The first is silence: the list changes, but a screen reader user hears nothing. WCAG 4.1.3 treats text such as &quot;5 results returned&quot; as a status message, so put the count in a \u003ccode>role=&quot;status&quot;\u003c/code> element that exists before the update.\u003c/p>\u003cp>The second is a race. Requests sent on each keystroke can return out of order, so results for &quot;car&quot; can overwrite results for &quot;cart&quot; while the field still reads &quot;cart&quot;. Debounce input, which means waiting for a short pause in typing, and cancel or ignore stale requests with an \u003ccode>AbortController\u003c/code>.\u003c/p>\u003cp>Keep the query in the URL so results can be shared. When nothing matches, show an \u003ca href=\"#Empty%20state\" data-term=\"Empty state\">empty state\u003c/a> that repeats the query and suggests a next step.\u003c/p>","avoid":"","usage":["Search sometimes shows results for what I typed two letters ago.","The search field has a response race. Abort the previous request on each new query."],"out":[0,13,38,60]},{"name":"Rich text editor","section":1,"description":"An editing surface for formatted content such as headings, lists and links, usually built on contenteditable.","body":"\u003cp>A rich text editor is an editing surface for formatted content such as headings, lists and links. It is usually built on the \u003ccode>contenteditable\u003c/code> attribute, which makes an element editable in the browser. Choose it only when people need formatting. A \u003ca href=\"#Textarea\" data-term=\"Textarea\">textarea\u003c/a>, optionally with Markdown, is less work and has fewer failure modes.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Option\u003c/th>\u003cth>Fits\u003c/th>\u003cth>Cost\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Plain textarea\u003c/td>\u003ctd>Comments, notes\u003c/td>\u003ctd>No formatting\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Textarea with Markdown\u003c/td>\u003ctd>Technical audiences\u003c/td>\u003ctd>Users learn syntax\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Editor library\u003c/td>\u003ctd>Documents, CMS content\u003c/td>\u003ctd>Bundle size, integration\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Custom on \u003ccode>contenteditable\u003c/code>\u003c/td>\u003ctd>Rarely justified\u003c/td>\u003ctd>High maintenance\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Browsers produce inconsistent markup from the same keystrokes, so mature editors keep their own document model and treat the DOM as a rendering of it. The older \u003ccode>document.execCommand\u003c/code> API is deprecated and implemented inconsistently, so new work should not depend on it. The \u003ccode>beforeinput\u003c/code> event is the usual place to intercept edits, though autocorrect and input method editors (used to compose languages such as Japanese) may skip it.\u003c/p>\u003cp>Pasted content needs cleaning. Content copied from a word processor can bring in pages of inline styles, and pasted or stored HTML can carry scripts. Sanitise on paste, and again on the server before displaying saved content, because client checks can be bypassed.\u003c/p>\u003cp>For assistive technology, give the editable region \u003ccode>role=&quot;textbox&quot;\u003c/code>, \u003ccode>aria-multiline=&quot;true&quot;\u003c/code> and an accessible name. Formatting commands belong in a labelled \u003ca href=\"#Toolbar\" data-term=\"Toolbar\">toolbar\u003c/a> with a single Tab stop, and \u003ca href=\"#Button\" data-term=\"Button\">buttons\u003c/a> such as Bold should expose \u003ccode>aria-pressed\u003c/code>.\u003c/p>\u003cp>If Tab indents text, keyboard users can get stuck, which WCAG 2.1.2 prohibits unless they are told how to leave. Keep Tab for moving focus, or document a way out such as Escape then Tab. The Authoring Practices also recommend a documented shortcut from the text to the toolbar.\u003c/p>\u003cp>Pair the editor with \u003ca href=\"#Autosave\" data-term=\"Autosave\">autosave\u003c/a>.\u003c/p>","avoid":"","usage":["Pasting from Word turned the article into a wall of inline styles.","The rich text editor isn't sanitising paste. Strip it to our allowed elements."],"out":[8,6,0,29]},{"name":"Form field","section":2,"description":"The unit that groups a label, control, hint and error message so that they work together.","body":"\u003cp>A form field is the unit that groups a label, a control, optional hint text and an error message. Design systems usually provide it as a wrapper so every input gets the same layout. The parts must be connected in the markup as well as placed near each other.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Element\u003c/th>\u003cth>Connected with\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Label\u003c/td>\u003ctd>\u003ccode>&lt;label&gt;\u003c/code>\u003c/td>\u003ctd>\u003ccode>for\u003c/code> matching the control's \u003ccode>id\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Control\u003c/td>\u003ctd>\u003ccode>&lt;input&gt;\u003c/code>, \u003ccode>&lt;select&gt;\u003c/code>\u003c/td>\u003ctd>The \u003ccode>id\u003c/code> itself\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hint\u003c/td>\u003ctd>Text element\u003c/td>\u003ctd>\u003ccode>aria-describedby\u003c/code> on the control\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>Text element\u003c/td>\u003ctd>\u003ccode>aria-describedby\u003c/code>, \u003ccode>aria-invalid\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cpre>\u003ccode>&lt;div class=&quot;field&quot;&gt;\n  &lt;label for=&quot;vat&quot;&gt;VAT number&lt;/label&gt;\n  &lt;input id=&quot;vat&quot; name=&quot;vat&quot; aria-describedby=&quot;vat-hint vat-error&quot;\n         aria-invalid=&quot;true&quot; /&gt;\n  &lt;p id=&quot;vat-hint&quot;&gt;Starts with a two-letter country code.&lt;/p&gt;\n  &lt;p id=&quot;vat-error&quot;&gt;Enter a VAT number in the correct format.&lt;/p&gt;\n&lt;/div&gt;\u003c/code>\u003c/pre>\u003cp>A connected label is announced when the control receives focus, and clicking it moves focus to the control. When the connection is broken, clicking the label does nothing. A screen reader (software that reads the interface aloud) then announces only &quot;edit text, blank&quot;.\u003c/p>\u003cp>The usual cause is a duplicated or generated \u003ccode>id\u003c/code>. When a wrapper is rendered twice with the same hard-coded \u003ccode>id\u003c/code>, every label points to the first input on the page, so clicking the second label fills in the wrong field. Generate a unique \u003ccode>id\u003c/code> per instance.\u003c/p>\u003cp>\u003ca href=\"#Helper%20text\" data-term=\"Helper text\">Helper text\u003c/a> and errors are linked by \u003ccode>aria-describedby\u003c/code>, which accepts several ids and reads them in the order listed. Show the error in text, because colour alone fails WCAG 1.4.1, and set \u003ccode>aria-invalid=&quot;true&quot;\u003c/code> only once the value has actually failed. The timing belongs to \u003ca href=\"#Inline%20validation\" data-term=\"Inline validation\">inline validation\u003c/a>.\u003c/p>\u003cp>For a question answered by several controls, such as a \u003ca href=\"#Radio%20group\" data-term=\"Radio group\">radio group\u003c/a> or date of birth in three inputs, use \u003ccode>&lt;fieldset&gt;\u003c/code> with \u003ccode>&lt;legend&gt;\u003c/code> around them. The legend names the group and each control keeps its own label. Marking required fields with the \u003ccode>required\u003c/code> attribute conveys the state to assistive technology, and a visible marker or the word &quot;required&quot; conveys it to everyone else.\u003c/p>","avoid":"","usage":["Clicking the Billing email label focuses the Shipping email input.","Both form fields use the same hard-coded \u003ccode>id\u003c/code>. Generate one per instance."],"out":[24,25,10]},{"name":"Helper text","section":2,"description":"Short persistent guidance attached to a form control that explains what to enter or how the value will be used.","body":"\u003cp>Helper text is short, persistent guidance attached to a form control. It explains what to enter, the expected format, or how the value will be used, such as &quot;We only use this to send receipts&quot;. It sits beside the input in a \u003ca href=\"#Form%20field\" data-term=\"Form field\">form field\u003c/a>, and stays visible while the person types.\u003c/p>\u003cp>Each place for guidance has limits.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Where guidance goes\u003c/th>\u003cth>When it works\u003c/th>\u003cth>Why it can fail\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Label\u003c/td>\u003ctd>Naming the field\u003c/td>\u003ctd>Becomes long and slow to hear\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Helper text\u003c/td>\u003ctd>Format rules, consequences\u003c/td>\u003ctd>Ignored if it is too long\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Placeholder\u003c/td>\u003ctd>A short optional example\u003c/td>\u003ctd>Disappears on typing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Tooltip\" data-term=\"Tooltip\">Tooltip\u003c/a>\u003c/td>\u003ctd>Optional extra detail\u003c/td>\u003ctd>Hidden until requested, hard on touch\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Connect the text to the control with \u003ccode>aria-describedby\u003c/code>, so a screen reader (software that reads the interface aloud) announces it after the label and role when the field receives focus.\u003c/p>\u003cpre>\u003ccode>&lt;label for=&quot;password&quot;&gt;New password&lt;/label&gt;\n&lt;input id=&quot;password&quot; type=&quot;password&quot; aria-describedby=&quot;password-help&quot; /&gt;\n&lt;p id=&quot;password-help&quot;&gt;Use at least 12 characters.&lt;/p&gt;\u003c/code>\u003c/pre>\u003cp>A common failure is revealing a requirement only after the mistake. A password field gives no rules, the user submits, and only then learns the minimum length. State constraints before input. WCAG 3.3.2 requires labels or instructions where content requires user input.\u003c/p>\u003cp>A related bug is replacing helper text with the error message. Once the field is invalid, the rule that would help the person fix it disappears. Keep the helper text and add the error next to it, or write the error so that it restates the rule. If both are shown, list both ids in \u003ccode>aria-describedby\u003c/code>.\u003c/p>\u003cp>Text below a field can be covered by an on-screen keyboard or a popup, so format rules are often easier to see between the label and the input.\u003c/p>\u003cp>Keep it to one short sentence, and reserve it for fields where people might otherwise get it wrong.\u003c/p>","avoid":"","usage":["People only learn the password rules after the form rejects them.","Move the rules into helper text under the label, and keep them visible when the error appears."],"out":[23,47]},{"name":"Inline validation","section":2,"description":"Checking a form field and showing the result next to it before or at submission, rather than only after a full page reload.","body":"\u003cp>Inline validation is checking a field and showing the result next to it, instead of waiting until a submitted form comes back with errors. A common failure is an error that appears too soon: a person types the first letter of an email address and is immediately told it is invalid.\u003c/p>\u003cp>Timing decides whether it helps.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>When to check\u003c/th>\u003cth>Suits\u003c/th>\u003cth>Risk\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>On each input\u003c/td>\u003ctd>Password rules, character counts, fixing an existing error\u003c/td>\u003ctd>Errors while still typing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>When leaving the field\u003c/td>\u003ctd>Format checks such as email or date\u003c/td>\u003ctd>Focus moves before the user reads it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>On submit\u003c/td>\u003ctd>Every field, always\u003c/td>\u003ctd>Late feedback if used alone\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A common pattern waits until the user leaves a field before first showing an error, then re-checks on each input while they fix it. The CSS \u003ccode>:user-invalid\u003c/code> selector supports this, because it matches only after the user has interacted with the control, whereas \u003ccode>:invalid\u003c/code> matches an empty required field on page load.\u003c/p>\u003cpre>\u003ccode>input:user-invalid {\n  border-color: var(--danger);\n}\u003c/code>\u003c/pre>\u003cp>Also validate on submit and on the server.\u003c/p>\u003cp>WCAG 3.3.1 requires that errors are identified and described in text, so a red border is not enough. Put the message in the \u003ca href=\"#Form%20field\" data-term=\"Form field\">form field\u003c/a>, link it with \u003ccode>aria-describedby\u003c/code>, and set \u003ccode>aria-invalid=&quot;true&quot;\u003c/code> only after the value has failed. The W3C forms tutorial suggests \u003ccode>aria-live=&quot;polite&quot;\u003c/code> for feedback while typing, so that the message is read when the user pauses instead of on every keystroke.\u003c/p>\u003cp>Say what to do, such as &quot;Enter a date in the format DD/MM/YYYY&quot;, rather than &quot;Invalid input&quot;. Keep the submit \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> enabled so people can submit and see an \u003ca href=\"#Error%20summary\" data-term=\"Error summary\">error summary\u003c/a>.\u003c/p>\u003cp>Async checks, such as username availability, need a pending state and must ignore stale responses.\u003c/p>","avoid":"","usage":["The email field turns red as soon as I type one letter.","The inline validation runs on input. Wait for blur first, then re-check while they fix it."],"out":[23,0,26]},{"name":"Error summary","section":2,"description":"A list of form errors shown after submission, with each item linking to the field that needs fixing.","body":"\u003cp>An error summary is a list of everything wrong with a submitted form, shown at the top, where each item links to the field that needs fixing. On a long form, it addresses a specific problem: the user presses Submit, nothing appears to change, and the error is out of view further up the page.\u003c/p>\u003cp>It works alongside \u003ca href=\"#Inline%20validation\" data-term=\"Inline validation\">inline validation\u003c/a> rather than replacing it. The summary gives the overview and a route to each problem, and the message beside each \u003ca href=\"#Form%20field\" data-term=\"Form field\">form field\u003c/a> explains the fix in context.\u003c/p>\u003cpre>\u003ccode>&lt;div id=&quot;errors&quot; tabindex=&quot;-1&quot;&gt;\n  &lt;h2&gt;There are 2 problems with your application&lt;/h2&gt;\n  &lt;ul&gt;\n    &lt;li&gt;&lt;a href=&quot;#email&quot;&gt;Enter an email address&lt;/a&gt;&lt;/li&gt;\n    &lt;li&gt;&lt;a href=&quot;#dob&quot;&gt;Date of birth must be in the past&lt;/a&gt;&lt;/li&gt;\n  &lt;/ul&gt;\n&lt;/div&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>User submits. Validation finds errors\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Summary renders above the form, and entered values are preserved\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Focus moves to the summary, or to the first invalid field\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>User follows a link, and focus lands in that input\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>User fixes it, and the summary updates on the next submit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The W3C forms tutorial recommends a list before the form, under a distinctive heading, with each item naming the problem and linking to the control. It advises moving focus to the first invalid field, while WCAG technique G139 shows focus moving to the error list. Pick one approach and apply it across the product.\u003c/p>\u003cp>Several failures are common. Links that point to a wrapper rather than the input scroll the page but leave focus behind, so use the control's \u003ccode>id\u003c/code>. A \u003ca href=\"#Sticky%20header\" data-term=\"Sticky header\">sticky header\u003c/a> can cover the target after the jump, which \u003ccode>scroll-padding-block-start\u003c/code> prevents. Clearing the user's entries on error forces them to start again, and technique G139 explicitly says to keep them.\u003c/p>\u003cp>For server-rendered forms, also prefix the page \u003ccode>&lt;title&gt;\u003c/code> with &quot;Error:&quot; so that screen reader users hear the outcome as the page loads. If script inserts the summary without moving focus, \u003ccode>role=&quot;alert&quot;\u003c/code> announces it.\u003c/p>","avoid":"","usage":["Users hit Submit and think the form is broken.","The error is off-screen. Add an error summary at the top and move focus to it."],"out":[25,23,66]},{"name":"Input mask","section":2,"description":"Formatting applied to an input as the user types, such as adding spaces to a card number or brackets to a phone number.","body":"\u003cp>An input mask is formatting applied to a \u003ca href=\"#Text%20field\" data-term=\"Text field\">text field\u003c/a> as the user types, such as grouping a card number into fours or adding brackets to a phone number. It rewrites the field's value while someone is typing into it, which is where most of its bugs come from.\u003c/p>\u003cp>A common symptom is a caret that jumps. The user goes back to fix a digit in the middle, the script reformats the value, and the caret lands at the end, so the next keystroke goes in the wrong place. Other failures follow the same cause: pasted values are rejected or doubled, browser autofill is garbled, and deletion stops at a separator that the mask immediately puts back.\u003c/p>\u003cp>Choose the lightest option that solves the problem.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Risk\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Helper hint only\u003c/td>\u003ctd>Shows the format, accepts anything\u003c/td>\u003ctd>Lowest\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Normalise on the server\u003c/td>\u003ctd>Strips spaces and punctuation\u003c/td>\u003ctd>Low\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Format on blur\u003c/td>\u003ctd>Reformats when focus leaves\u003c/td>\u003ctd>Low\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Format while typing\u003c/td>\u003ctd>Rewrites on each input\u003c/td>\u003ctd>High\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fixed-slot mask\u003c/td>\u003ctd>Shows \u003ccode>__/__/____\u003c/code> and blocks other keys\u003c/td>\u003ctd>Highest\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Often it is enough to accept any reasonable format and clean it up afterwards.\u003c/p>\u003cp>If you format while typing, keep the raw value separate from the display value, restore the caret after each change, and handle paste. Do not depend on \u003ccode>beforeinput\u003c/code> alone, because autofill, spellcheck and input method editors (used to compose languages such as Japanese) may skip it. Use the \u003ccode>input\u003c/code> event as the final check.\u003c/p>\u003cp>A screen reader may read placeholder underscores aloud or announce each inserted character, so test with one. Keep \u003ccode>autocomplete\u003c/code> tokens such as \u003ccode>cc-number\u003c/code>, put the format in \u003ca href=\"#Helper%20text\" data-term=\"Helper text\">helper text\u003c/a>, and avoid fixed masks for international phone numbers and postcodes, which vary in length and grouping.\u003c/p>","avoid":"","usage":["When I fix a digit in the card number, the cursor jumps to the end.","The input mask rewrites the value on every keystroke. Format on blur instead."],"out":[7,24]},{"name":"Multi-step form","section":2,"description":"A long form split into a sequence of screens, with progress shown and answers kept between steps.","body":"\u003cp>A multi-step form is a long form split into a sequence of screens, such as Address, Delivery, Payment and Review. Use it when the questions fall into clear groups, or when later questions depend on earlier answers. A short form is easier on one page.\u003c/p>\u003cp>The main risk is lost work. Someone reaches step four, presses the browser's Back control to check an answer, and the form returns to an empty first step. Give each step its own URL, and save answers as the user leaves each one.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>What the interface does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Start\u003c/td>\u003ctd>States how many steps there are\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Each step\u003c/td>\u003ctd>Shows position in the title and heading, for example &quot;Step 2 of 4&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Next\u003c/td>\u003ctd>Validates this step and saves its answers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Back\u003c/td>\u003ctd>Returns with answers intact, and does not validate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Review\u003c/td>\u003ctd>Shows all answers, with a link to change each\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Submit\u003c/td>\u003ctd>Sends the data and confirms the result\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Show progress with a \u003ca href=\"#Stepper\" data-term=\"Stepper\">stepper\u003c/a> for a fixed sequence. If the number of steps depends on answers, the W3C forms tutorial suggests the \u003ccode>&lt;progress&gt;\u003c/code> element instead. Mark the current item with \u003ccode>aria-current=&quot;step&quot;\u003c/code>.\u003c/p>\u003cp>When a step changes without a page load, move focus to the new step's heading (with \u003ccode>tabindex=&quot;-1&quot;\u003c/code>) and update the document title, or screen reader users get no sign that anything changed.\u003c/p>\u003cp>Two WCAG criteria apply. Redundant Entry (3.3.7) says information already provided in the same process must be filled in or offered for selection, with narrow exceptions, so offer &quot;same as delivery address&quot; for billing. Error Prevention (3.3.4) requires legal, financial and data-changing submissions to be reversible, checked or confirmed, and a review step provides confirmation.\u003c/p>\u003cp>Validate each step on Next using \u003ca href=\"#Inline%20validation\" data-term=\"Inline validation\">inline validation\u003c/a> and an \u003ca href=\"#Error%20summary\" data-term=\"Error summary\">error summary\u003c/a>.\u003c/p>","avoid":"","usage":["People press back on the payment step and lose their whole address.","The multi-step form keeps answers in component state. Put each step in the URL and persist the draft."],"out":[35,25,26]},{"name":"Autosave","section":2,"description":"Saving a user's work automatically as they edit, so that it survives a closed tab or failed connection.","body":"\u003cp>Autosave is saving a user's work automatically as they edit, without a Save \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>. It protects against losing a draft when a tab closes, a laptop dies or a connection drops. It suits documents, notes and settings. It does not suit actions with consequences, such as publishing or paying, where a change should stay a draft until the person commits to it.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Edit\u003c/td>\u003ctd>User\u003c/td>\u003ctd>Changes content. Status becomes &quot;Unsaved&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wait\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Debounce, which waits for a pause in typing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Send\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Sends changes with a version number. &quot;Saving&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Confirm\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Stores them. Status becomes &quot;Saved&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fail\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Keeps changes locally, retries and tells the user\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A false &quot;Saved&quot; label causes data loss. If the status updates before the server responds, or a failed request goes unnoticed, the person closes the tab believing their work is safe. Show the status from the actual result, and make failure visible.\u003c/p>\u003cp>Requests can also finish out of order, so an older save can overwrite a newer one. Send one save at a time per document, or attach a version so the server rejects stale writes. The same check detects edits from a second tab or device, so decide how to resolve that conflict.\u003c/p>\u003cp>For leaving the page, MDN recommends saving on \u003ccode>visibilitychange\u003c/code>, since \u003ccode>beforeunload\u003c/code> and \u003ccode>unload\u003c/code> often do not fire on mobile. Use \u003ccode>fetch\u003c/code> with \u003ccode>keepalive\u003c/code> or \u003ccode>navigator.sendBeacon\u003c/code> for the final small payload. A \u003ccode>beforeunload\u003c/code> handler, added only while work is unsaved, can show the browser's generic warning.\u003c/p>\u003cp>Expose the status with \u003ccode>role=&quot;status&quot;\u003c/code> (WCAG 4.1.3), but announce failures and recovery rather than every save, or a screen reader user hears &quot;Saved&quot; throughout their writing. Provide version history or an \u003ca href=\"#Undo%20pattern\" data-term=\"Undo pattern\">undo pattern\u003c/a> for changes people regret.\u003c/p>","avoid":"","usage":["It said Saved, but my last paragraph is gone after the refresh.","Autosave sets the label before the request finishes. Update it only when the server confirms."],"out":[0,62]},{"name":"Navbar","section":3,"description":"A horizontal bar of primary site links, usually at the top of every page, often collapsing into a menu on small screens.","body":"\u003cp>A navbar is a horizontal bar of primary links, usually at the top of every page, holding the logo, main sections and account controls. It suits products with a small number of top-level destinations. When there are many sections or deep hierarchy, a \u003ca href=\"#Sidebar\" data-term=\"Sidebar\">sidebar\u003c/a> has more room. On phones, \u003ca href=\"#Bottom%20navigation\" data-term=\"Bottom navigation\">bottom navigation\u003c/a> puts the same destinations within reach of the thumb.\u003c/p>\u003cp>Build it from a \u003ccode>&lt;nav&gt;\u003c/code> containing a list of links, and mark the current page.\u003c/p>\u003cpre>\u003ccode>&lt;header&gt;\n  &lt;nav aria-label=&quot;Main&quot;&gt;\n    &lt;ul&gt;\n      &lt;li&gt;&lt;a href=&quot;/&quot; aria-current=&quot;page&quot;&gt;Home&lt;/a&gt;&lt;/li&gt;\n      &lt;li&gt;&lt;a href=&quot;/pricing&quot;&gt;Pricing&lt;/a&gt;&lt;/li&gt;\n    &lt;/ul&gt;\n  &lt;/nav&gt;\n&lt;/header&gt;\u003c/code>\u003c/pre>\u003cp>If a page has several \u003ccode>&lt;nav&gt;\u003c/code> elements, give each a unique label. Leave out the word &quot;navigation&quot;, because the role is announced as well, and &quot;Main navigation navigation&quot; is what the user would hear. Keep links in the same relative order across pages, which WCAG 3.2.3 requires.\u003c/p>\u003cp>A common accessibility mistake is applying ARIA menu roles to site links. \u003ccode>role=&quot;menu&quot;\u003c/code> promises desktop-application behaviour, including arrow-key movement, and removes the list semantics people expect. The WAI-ARIA Authoring Practices say the disclosure pattern is better suited to most websites.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Build it as\u003c/th>\u003cth>Keyboard\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Link\u003c/td>\u003ctd>\u003ccode>&lt;a href&gt;\u003c/code>\u003c/td>\u003ctd>Tab, Enter\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Section dropdown\u003c/td>\u003ctd>\u003ca href=\"#Button\" data-term=\"Button\">\u003ccode>&lt;button aria-expanded&gt;\u003c/code>\u003c/a> that reveals links\u003c/td>\u003ctd>Enter or Space, Escape\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mobile menu\u003c/td>\u003ctd>The same button at a narrow \u003ca href=\"#Breakpoint\" data-term=\"Breakpoint\">breakpoint\u003c/a>\u003c/td>\u003ctd>Enter or Space, Escape\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Sticky navbars cause a separate bug. When someone tabs backwards or follows an in-page link, the target can land behind the bar. WCAG 2.4.11 requires that a focused element is not entirely hidden by author content. Setting \u003ccode>scroll-padding-block-start\u003c/code> to the bar's height on the scroll container fixes both cases.\u003c/p>\u003cp>Navbars also overflow when text is zoomed, because links cannot wrap in a fixed-height row. WCAG 1.4.10 expects reflow at a width of 320 CSS pixels, so collapse the links before they are clipped.\u003c/p>","avoid":"","usage":["When I tab back up the page, focused links disappear under the header.","The navbar is sticky. Add \u003ccode>scroll-padding-block-start\u003c/code> matching its height."],"out":[31,39,0,84]},{"name":"Sidebar","section":3,"description":"A vertical panel beside the main content, usually holding navigation or filters, that can often collapse.","body":"\u003cp>A sidebar is a vertical panel beside the main content, usually holding navigation, filters or supporting information. It suits applications with many sections, because a vertical list has room to grow and can show nested groups. For a handful of destinations, a \u003ca href=\"#Navbar\" data-term=\"Navbar\">navbar\u003c/a> uses less space. A sidebar stays on screen alongside the content, whereas a \u003ca href=\"#Drawer\" data-term=\"Drawer\">drawer\u003c/a> opens over it on demand.\u003c/p>\u003cp>The right element depends on what it contains.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Content\u003c/th>\u003cth>Element\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Links to other pages\u003c/td>\u003ctd>\u003ccode>&lt;nav aria-label=&quot;Project&quot;&gt;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Related supporting content\u003c/td>\u003ctd>\u003ccode>&lt;aside&gt;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Filters for the current list\u003c/td>\u003ctd>A labelled form or group within the page\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Sidebars often have three display states.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>State\u003c/th>\u003cth>Display\u003c/th>\u003cth>Requirement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Expanded\u003c/td>\u003ctd>Icons and labels\u003c/td>\u003ctd>Mark the current link with \u003ccode>aria-current=&quot;page&quot;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rail\u003c/td>\u003ctd>Icons only\u003c/td>\u003ctd>Every link keeps an accessible name\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hidden\u003c/td>\u003ctd>Nothing\u003c/td>\u003ctd>Contents leave the Tab order\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A common bug affects the hidden state. A sidebar moved off-screen with \u003ccode>transform\u003c/code> is invisible, but its links remain focusable, so a keyboard user tabs through a dozen stops with no visible \u003ca href=\"#Focus%20ring\" data-term=\"Focus ring\">focus ring\u003c/a>. Set \u003ccode>hidden\u003c/code> or \u003ccode>inert\u003c/code> on it when closed. If you animate the exit, apply it once the transition ends.\u003c/p>\u003cp>The collapse control should be a real \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> with \u003ccode>aria-expanded\u003c/code> and \u003ccode>aria-controls\u003c/code>, with a name that matches its purpose, such as &quot;Project navigation&quot;. In a collapsed rail, add a \u003ca href=\"#Tooltip\" data-term=\"Tooltip\">tooltip\u003c/a> so sighted users can learn each icon, and show it on focus as well as hover.\u003c/p>\u003cp>On small screens a fixed sidebar takes most of the viewport, and WCAG 1.4.10 expects content to reflow at a width of 320 CSS pixels. Below a set \u003ca href=\"#Breakpoint\" data-term=\"Breakpoint\">breakpoint\u003c/a>, turn it into a drawer. If the hierarchy runs several levels deep, nested disclosure lists or a \u003ca href=\"#Tree%20view\" data-term=\"Tree view\">tree view\u003c/a> can structure it.\u003c/p>","avoid":"","usage":["Tab seems to vanish for about ten presses after the header.","It's going through the collapsed sidebar off-screen. Set \u003ccode>inert\u003c/code> on it when it's closed."],"out":[30,44,103,0,47,84,40]},{"name":"Breadcrumb","section":3,"description":"A trail of links showing the current page's parent pages in the site hierarchy.","body":"\u003cp>A breadcrumb is a trail of links showing where the current page sits in a site's hierarchy, such as Home, Shoes, Running, Trail Pro. It lets people move up a level without using search or the main menu. It suits sites with deep structures, such as stores and documentation. On a flat site with two levels it adds clutter.\u003c/p>\u003cp>A breadcrumb shows hierarchy, while browser history records visits. The common design mistake is mixing them by building the trail from the pages a person happened to visit. The trail then differs for each visitor and stops telling them where the page belongs.\u003c/p>\u003cp>The WAI-ARIA Authoring Practices define a simple structure: a labelled navigation landmark containing an ordered list of links.\u003c/p>\u003cpre>\u003ccode>&lt;nav aria-label=&quot;Breadcrumb&quot;&gt;\n  &lt;ol&gt;\n    &lt;li&gt;&lt;a href=&quot;/&quot;&gt;Home&lt;/a&gt;&lt;/li&gt;\n    &lt;li&gt;&lt;a href=&quot;/shoes&quot;&gt;Shoes&lt;/a&gt;&lt;/li&gt;\n    &lt;li&gt;&lt;a href=&quot;/shoes/trail-pro&quot; aria-current=&quot;page&quot;&gt;Trail Pro&lt;/a&gt;&lt;/li&gt;\n  &lt;/ol&gt;\n&lt;/nav&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Requirement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Container\u003c/td>\u003ctd>\u003ccode>&lt;nav&gt;\u003c/code> with \u003ccode>aria-label\u003c/code> or \u003ccode>aria-labelledby\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>List\u003c/td>\u003ctd>\u003ccode>&lt;ol&gt;\u003c/code>, because order carries meaning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Current item\u003c/td>\u003ctd>\u003ccode>aria-current=&quot;page&quot;\u003c/code> if it is a link, optional if plain text\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Separators\u003c/td>\u003ctd>Added in CSS so they are not read aloud\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>No special keyboard behaviour is required. The links are ordinary Tab stops, and the pattern lists keyboard interaction as not applicable. Do not add arrow-key handling or menu roles.\u003c/p>\u003cp>Separators typed into the markup may be read aloud by a screen reader (software that reads the interface aloud). Draw them with a \u003ccode>::before\u003c/code> pseudo-element instead.\u003c/p>\u003cp>Long trails can overflow on small screens. Common fixes are letting the list wrap, showing only the parent as a &quot;Back to Shoes&quot; link, or collapsing the middle levels behind a \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> with an ellipsis. That button needs a name such as &quot;Show full path&quot;, and hidden levels must remain reachable. Truncating with CSS alone cuts off the page names people use to orient themselves.\u003c/p>","avoid":"","usage":["Why does the breadcrumb change depending on how I got to this product?","It's built from browsing history. It should come from the category tree."],"out":[0]},{"name":"Tabs","section":3,"description":"A row of labels that switches between panels of related content in the same place, showing one panel at a time.","body":"\u003cp>Tabs are a row of labels that switch between panels of related content in the same place, showing one panel at a time. A settings screen with Profile, Billing and Team sections is a typical use. Choose them when people work with one section at a time and do not need to compare them. If they might need several sections open together, use an \u003ca href=\"#Accordion\" data-term=\"Accordion\">accordion\u003c/a>. If each label goes to a separate page, use links in a \u003ca href=\"#Navbar\" data-term=\"Navbar\">navbar\u003c/a> with \u003ccode>aria-current=&quot;page&quot;\u003c/code>, because tab roles there misdescribe what happens.\u003c/p>\u003cpre>\u003ccode>&lt;div role=&quot;tablist&quot; aria-label=&quot;Account settings&quot;&gt;\n  &lt;button role=&quot;tab&quot; id=&quot;t1&quot; aria-selected=&quot;true&quot; aria-controls=&quot;p1&quot;&gt;Profile&lt;/button&gt;\n  &lt;button role=&quot;tab&quot; id=&quot;t2&quot; aria-selected=&quot;false&quot; aria-controls=&quot;p2&quot;\n          tabindex=&quot;-1&quot;&gt;Billing&lt;/button&gt;\n&lt;/div&gt;\n&lt;div role=&quot;tabpanel&quot; id=&quot;p1&quot; aria-labelledby=&quot;t1&quot; tabindex=&quot;0&quot;&gt;...&lt;/div&gt;\n&lt;div role=&quot;tabpanel&quot; id=&quot;p2&quot; aria-labelledby=&quot;t2&quot; tabindex=&quot;0&quot; hidden&gt;...&lt;/div&gt;\u003c/code>\u003c/pre>\u003cp>The tab list is one Tab stop, and arrow keys move within it.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tab\u003c/td>\u003ctd>Enters at the active tab, then moves on to the panel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Left, Right Arrow\u003c/td>\u003ctd>Previous or next tab, wrapping at the ends\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Home, End\u003c/td>\u003ctd>Optionally first or last tab\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter, Space\u003c/td>\u003ctd>Activates the tab, if it does not activate on focus\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>In a vertical tab list, set \u003ccode>aria-orientation=&quot;vertical&quot;\u003c/code> and use Up and Down Arrow instead.\u003c/p>\u003cp>Activation can be automatic, where arrowing to a tab shows its panel, or manual, where the user presses Enter or Space. The Authoring Practices recommend automatic activation only when panels appear without noticeable delay. If each panel fetches data, automatic activation fires a request for every tab the user passes through, so use manual.\u003c/p>\u003cp>A panel with no focusable content, or whose first element is not focusable, should have \u003ccode>tabindex=&quot;0&quot;\u003c/code> so that keyboard users can reach it.\u003c/p>\u003cp>Two state bugs are common. Unmounting a hidden panel discards anything typed in it, so a half-completed form is empty when the user comes back. Keep panels mounted and use \u003ccode>hidden\u003c/code>. And if the active tab lives only in memory, refreshing or sharing the link resets it, so reflect it in the URL.\u003c/p>","avoid":"","usage":["I filled in Billing, checked Profile, and my Billing draft is gone.","The tabs unmount inactive panels. Keep them mounted and toggle \u003ccode>hidden\u003c/code>."],"out":[70,30]},{"name":"Pagination control","section":3,"description":"A set of links for moving through a long result set one page at a time, with previous, next and numbered pages.","body":"\u003cp>A pagination control is a set of links for moving through a long result set one page at a time, usually with Previous, Next and numbered pages. It gives people a stable position they can return to, share and reason about, such as &quot;page 4&quot;. That suits search results, admin lists and a \u003ca href=\"#Data%20table\" data-term=\"Data table\">data table\u003c/a>. \u003ca href=\"#Infinite%20scroll\" data-term=\"Infinite scroll\">Infinite scroll\u003c/a> suits casual browsing feeds, but it makes the footer hard to reach and a position hard to keep. A &quot;Load more&quot; \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> sits between the two.\u003c/p>\u003cp>Build it as a labelled \u003ccode>&lt;nav&gt;\u003c/code> containing real links, so that each page has a URL.\u003c/p>\u003cpre>\u003ccode>&lt;nav aria-label=&quot;Pagination&quot;&gt;\n  &lt;ul&gt;\n    &lt;li&gt;&lt;a href=&quot;?page=2&quot; rel=&quot;prev&quot;&gt;Previous&lt;/a&gt;&lt;/li&gt;\n    &lt;li&gt;&lt;a href=&quot;?page=2&quot; aria-label=&quot;Page 2&quot;&gt;2&lt;/a&gt;&lt;/li&gt;\n    &lt;li&gt;&lt;a href=&quot;?page=3&quot; aria-label=&quot;Page 3&quot; aria-current=&quot;page&quot;&gt;3&lt;/a&gt;&lt;/li&gt;\n    &lt;li&gt;&lt;a href=&quot;?page=4&quot; aria-label=&quot;Page 4&quot;&gt;4&lt;/a&gt;&lt;/li&gt;\n    &lt;li&gt;&lt;a href=&quot;?page=4&quot; rel=&quot;next&quot;&gt;Next&lt;/a&gt;&lt;/li&gt;\n  &lt;/ul&gt;\n&lt;/nav&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Detail\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Current\u003c/td>\u003ctd>\u003ccode>aria-current=&quot;page&quot;\u003c/code> plus a non-colour visual cue\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Numbers\u003c/td>\u003ctd>Named &quot;Page 3&quot;, since a bare &quot;3&quot; is unclear out of context\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Previous\u003c/td>\u003ctd>On page 1, remove it or disable it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ellipsis\u003c/td>\u003ctd>Plain text, hidden from assistive technology\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Keep the visible number inside any accessible name, as WCAG 2.5.3 (Label in Name) requires, so that voice-control users can say what they see. No custom keyboard handling is needed. Links are ordinary Tab stops.\u003c/p>\u003cp>When results load without a full page navigation, two problems appear. Focus stays on a link that may have been re-rendered or removed, and nothing tells a screen reader user that the list changed. Move focus to the results heading, or announce &quot;Page 3 of 12&quot; in a \u003ccode>role=&quot;status&quot;\u003c/code> region, and scroll to the top of the list.\u003c/p>\u003cp>Numbered pages built on a database offset can drift. If rows are inserted while someone is reading, items shift across the page boundary, so one record appears twice or another is skipped. For fast-changing data, cursor pagination, which asks for rows after the last one seen, keeps the sequence stable, at the cost of jumping directly to page 37.\u003c/p>","avoid":"","usage":["The same order shows up on page 2 and page 3.","New rows are shifting the offset. Switch that pagination control to a cursor."],"out":[65,69,0]},{"name":"Stepper","section":3,"description":"A progress indicator showing the steps of a process, which are complete and which one the user is on.","body":"\u003cp>A stepper is a progress indicator showing the stages of a process, which ones are complete and which one the user is on. It usually sits at the top of a \u003ca href=\"#Multi-step%20form\" data-term=\"Multi-step form\">multi-step form\u003c/a>, such as Address, Delivery, Payment, Review. The word is also used for the plus and minus \u003ca href=\"#Button\" data-term=\"Button\">buttons\u003c/a> on a \u003ca href=\"#Number%20input\" data-term=\"Number input\">number input\u003c/a>, which is a different control.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Shows\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Stepper\u003c/td>\u003ctd>Named stages and the current one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Progress%20bar\" data-term=\"Progress bar\">Progress bar\u003c/a>\u003c/td>\u003ctd>How much is done, with no stage names\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Tabs\" data-term=\"Tabs\">Tabs\u003c/a>\u003c/td>\u003ctd>Sections in any order\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Breadcrumb\" data-term=\"Breadcrumb\">Breadcrumb\u003c/a>\u003c/td>\u003ctd>Position in a site hierarchy\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Use a stepper when the sequence is known and short enough to show. If the number of steps depends on earlier answers, a fixed list will mislead people, so a progress bar or &quot;Step 2&quot; without a total is more honest.\u003c/p>\u003cp>Build it as an ordered list, and mark the current step.\u003c/p>\u003cpre>\u003ccode>&lt;ol aria-label=&quot;Checkout progress&quot;&gt;\n  &lt;li&gt;&lt;a href=&quot;/checkout/address&quot;&gt;\n    &lt;span class=&quot;visually-hidden&quot;&gt;Completed: &lt;/span&gt;Address&lt;/a&gt;&lt;/li&gt;\n  &lt;li aria-current=&quot;step&quot;&gt;Delivery&lt;/li&gt;\n  &lt;li&gt;Payment&lt;/li&gt;\n&lt;/ol&gt;\u003c/code>\u003c/pre>\u003cp>\u003ccode>aria-current=&quot;step&quot;\u003c/code> marks the active item. For finished steps, the W3C forms tutorial uses visually hidden text such as &quot;Completed:&quot;. Colour alone fails WCAG 1.4.1, so change the shape too.\u003c/p>\u003cp>Completed steps should be links, so people can go back and review their answers. Future steps should normally be plain text. A common failure is drawing every step as clickable: someone jumps to Payment before entering an address, and the form breaks or submits incomplete data. If the steps can be done in any order, a checklist or tabs describes that better.\u003c/p>\u003cp>The stepper is not itself a keyboard widget. Links take normal Tab stops, and plain text items take none. When the step changes, move focus to the new heading, because updating the indicator alone is easy to miss.\u003c/p>\u003cp>Horizontal steppers overflow on narrow screens. Stack them vertically, or show &quot;Step 2 of 4: Delivery&quot; as text.\u003c/p>","avoid":"","usage":["Someone got to Payment without an address and the order failed.","Future steps in the stepper are clickable. Only link the steps they've completed."],"out":[28,0,16,57,33,32]},{"name":"Dropdown menu","section":3,"description":"A list of actions that opens from a button and closes after one is chosen.","body":"\u003cp>A dropdown menu is a list of actions that opens from a \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> and usually closes after one is chosen, such as Rename, Duplicate and Delete under a &quot;More&quot; control. It holds actions. If the control sets a value in a form, use a \u003ca href=\"#Select\" data-term=\"Select\">select\u003c/a>. If it holds links to site sections, use a disclosure: a button with \u003ccode>aria-expanded\u003c/code> that reveals an ordinary list of links.\u003c/p>\u003cp>Mixing these up causes bugs. Adding \u003ccode>role=&quot;menu&quot;\u003c/code> to site navigation tells screen readers to expect application-style keys, so people press arrows and nothing happens, or Tab closes the list before they reach the links. The WAI-ARIA Authoring Practices say a disclosure is better suited to most site navigation.\u003c/p>\u003cpre>\u003ccode>&lt;button type=&quot;button&quot; aria-haspopup=&quot;menu&quot; aria-expanded=&quot;true&quot;\n        aria-controls=&quot;actions&quot;&gt;More&lt;/button&gt;\n&lt;ul id=&quot;actions&quot; role=&quot;menu&quot; aria-label=&quot;More&quot;&gt;\n  &lt;li role=&quot;menuitem&quot; tabindex=&quot;-1&quot;&gt;Rename&lt;/li&gt;\n  &lt;li role=&quot;menuitem&quot; tabindex=&quot;-1&quot;&gt;Delete&lt;/li&gt;\n&lt;/ul&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Enter, Space\u003c/td>\u003ctd>On the button, opens and focuses the first item\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Down Arrow\u003c/td>\u003ctd>On the button, optionally opens. In the menu, next item\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Up Arrow\u003c/td>\u003ctd>In the menu, previous item\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Home, End\u003c/td>\u003ctd>First or last item, if arrows do not wrap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A letter\u003c/td>\u003ctd>Optionally jumps to the next matching item\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter\u003c/td>\u003ctd>Activates the item and closes the menu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Escape\u003c/td>\u003ctd>Closes and returns focus to the button\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tab\u003c/td>\u003ctd>Leaves the menu and closes it\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Items can be \u003ccode>menuitem\u003c/code>, \u003ccode>menuitemcheckbox\u003c/code> or \u003ccode>menuitemradio\u003c/code>. Disabled items stay focusable so that people can discover them.\u003c/p>\u003cp>Menus inside a scrolling container or table are often clipped by \u003ccode>overflow: hidden\u003c/code>. Rendering through a \u003ca href=\"#Portal\" data-term=\"Portal\">portal\u003c/a>, or using the \u003ca href=\"#Popover\" data-term=\"Popover\">popover\u003c/a> attribute with \u003ca href=\"#Anchor%20positioning\" data-term=\"Anchor positioning\">anchor positioning\u003c/a>, lifts the menu above the page.\u003c/p>\u003cp>After an item runs, focus needs a destination. If &quot;Delete&quot; removes the row containing the button, focus falls to the page body and the user loses their place. Send it to the next row or a nearby heading.\u003c/p>","avoid":"","usage":["The row actions menu gets cut off by the table.","The table has \u003ccode>overflow: auto\u003c/code>. Render the dropdown menu in the top layer with the Popover API."],"out":[0,12,49,46,52]},{"name":"Context menu","section":3,"description":"A menu of actions for the item under the pointer, opened by right-click, long press or a keyboard command.","body":"\u003cp>A context menu is a menu of actions for a specific item, opened by right-click, long press or a keyboard command. File managers and design tools use one to offer Rename, Copy and Delete on the thing under the pointer. It differs from a \u003ca href=\"#Dropdown%20menu\" data-term=\"Dropdown menu\">dropdown menu\u003c/a> because no visible \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> announces it, so it should only ever be a shortcut. Anything available in a context menu must also be reachable some other way, such as a &quot;More&quot; button on the row.\u003c/p>\u003cp>The browser fires a \u003ccode>contextmenu\u003c/code> event when the user tries to open a menu. Calling \u003ccode>preventDefault()\u003c/code> suppresses the native one so your own can appear.\u003c/p>\u003cpre>\u003ccode>item.addEventListener(&quot;contextmenu&quot;, (event) =&gt; {\n  event.preventDefault();\n  openMenu(event.clientX, event.clientY);\n});\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Input\u003c/th>\u003cth>How it opens\u003c/th>\u003cth>Where to place it\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Mouse\u003c/td>\u003ctd>Right-click\u003c/td>\u003ctd>At the pointer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Keyboard\u003c/td>\u003ctd>Shift+F10 or the Menu key\u003c/td>\u003ctd>At the focused element\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Touch\u003c/td>\u003ctd>Long press, where supported\u003c/td>\u003ctd>Near the finger\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Keyboard opening is the commonly missed case. An event triggered from the keyboard may report coordinates that have nothing to do with the focused element, so a menu positioned from them can appear in a corner. Position it from the focused element in that case. Touch behaviour also differs between browsers, so test long press on real devices rather than assuming the event fires.\u003c/p>\u003cp>Once open, it follows the ARIA menu pattern: \u003ccode>role=&quot;menu&quot;\u003c/code>, arrow keys to move, Enter to activate, Escape to close. Focus moves into the menu on opening. On closing, it returns to the element the menu acted on, and the Authoring Practices note this for menus opened from a context such as an editor.\u003c/p>\u003cp>Replacing the native menu removes Copy, Paste, spelling suggestions and &quot;Open link in new tab&quot;. Attach the handler only to elements with useful custom actions, and leave text inputs and links alone.\u003c/p>","avoid":"","usage":["I can't right-click a link to open it in a new tab anymore.","Our context menu handler is on \u003ccode>document\u003c/code>. Scope it to the file rows."],"out":[36,0]},{"name":"Command palette","section":3,"description":"A keyboard-opened search box that finds and runs commands or jumps to pages from anywhere in an application.","body":"\u003cp>A command palette is a search box, opened with a keyboard shortcut, that finds and runs commands or jumps to pages from anywhere in an application. The person presses a shortcut, types a few letters of &quot;invite user&quot;, and presses Enter. It suits large products used often by experienced people, and every command must also exist somewhere visible.\u003c/p>\u003cp>Compared with a \u003ca href=\"#Search%20field\" data-term=\"Search field\">search field\u003c/a>, which returns content, a palette mainly returns actions. Compared with a \u003ca href=\"#Dropdown%20menu\" data-term=\"Dropdown menu\">dropdown menu\u003c/a>, it scales to hundreds of items because people filter them by typing.\u003c/p>\u003cp>It is usually composed from existing patterns: a \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a> containing a \u003ca href=\"#Combobox\" data-term=\"Combobox\">combobox\u003c/a> with a listbox of results.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ctrl or Cmd + K\u003c/td>\u003ctd>Opens the palette (a common convention)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Typing\u003c/td>\u003ctd>Filters results\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Up, Down Arrow\u003c/td>\u003ctd>Moves the highlighted result\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter\u003c/td>\u003ctd>Runs the highlighted command\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Escape\u003c/td>\u003ctd>Closes and returns focus to where it was\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>DOM focus stays in the input while \u003ccode>aria-activedescendant\u003c/code> identifies the highlighted option, so typing keeps working. Announce the count with a \u003ccode>role=&quot;status&quot;\u003c/code> message such as &quot;6 results&quot;, because WCAG 4.1.3 covers this kind of update.\u003c/p>\u003cp>Keyboard shortcuts can conflict with browsers and with typing. Some browsers use Ctrl+K for their own search or address bar. A single-character shortcut such as \u003ccode>/\u003c/code> fires while someone types in a field unless you check the event target, and WCAG 2.1.4 requires that such shortcuts can be turned off or remapped, or work only while the relevant component has focus. Provide a visible \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> that opens the palette.\u003c/p>\u003cp>After a command runs, send focus to its result, such as the page it opened. If the command acts on the current view, return focus to the element that had it before.\u003c/p>","avoid":"","usage":["Typing a slash in the comment box keeps opening the command palette.","The shortcut listener doesn't check for inputs. Ignore it when focus is in an editable field."],"out":[21,36,42,13,0]},{"name":"Bottom navigation","section":3,"description":"A fixed bar along the bottom of a mobile screen with links to a small number of top-level destinations.","body":"\u003cp>Bottom navigation is a fixed bar along the bottom of a mobile screen, with links to a small number of top-level destinations, commonly three to five. Each item pairs an icon with a short label. It keeps the main sections within reach of the thumb and visible at all times. With more destinations than fit, use a \u003ca href=\"#Drawer\" data-term=\"Drawer\">drawer\u003c/a> or a &quot;More&quot; item. On wide screens, a \u003ca href=\"#Sidebar\" data-term=\"Sidebar\">sidebar\u003c/a> or \u003ca href=\"#Navbar\" data-term=\"Navbar\">navbar\u003c/a> usually replaces it.\u003c/p>\u003cp>Although it can look like a row of \u003ca href=\"#Tabs\" data-term=\"Tabs\">tabs\u003c/a>, it navigates between destinations, so it should be a \u003ccode>&lt;nav&gt;\u003c/code> containing links rather than an ARIA tab list.\u003c/p>\u003cpre>\u003ccode>&lt;nav aria-label=&quot;Primary&quot; class=&quot;bottom-nav&quot;&gt;\n  &lt;a href=&quot;/&quot; aria-current=&quot;page&quot;&gt;\n    &lt;svg aria-hidden=&quot;true&quot;&gt;...&lt;/svg&gt; Home\n  &lt;/a&gt;\n  &lt;a href=&quot;/orders&quot;&gt;\n    &lt;svg aria-hidden=&quot;true&quot;&gt;...&lt;/svg&gt; Orders\n  &lt;/a&gt;\n&lt;/nav&gt;\u003c/code>\u003c/pre>\u003cpre>\u003ccode>.bottom-nav {\n  position: fixed;\n  inset-inline: 0;\n  bottom: 0;\n  padding-block-end: env(safe-area-inset-bottom);\n}\u003c/code>\u003c/pre>\u003cp>Each link is a normal Tab stop, activated with Enter. Screen readers announce the visible text and \u003ccode>aria-current=&quot;page&quot;\u003c/code> for the current destination. Keep the labels visible, because icons alone are ambiguous.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Symptom\u003c/th>\u003cth>Cause\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Last list item hidden behind the bar\u003c/td>\u003ctd>Fixed bar overlaps content\u003c/td>\u003ctd>Add bottom padding to the main region\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bar sits under the home indicator\u003c/td>\u003ctd>Ignores the \u003ca href=\"#Safe%20area\" data-term=\"Safe area\">safe area\u003c/a>\u003c/td>\u003ctd>Pad with the \u003ccode>env()\u003c/code> inset\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focused link hidden while tabbing\u003c/td>\u003ctd>Bar covers it (WCAG 2.4.11)\u003c/td>\u003ctd>Set \u003ccode>scroll-padding-block-end\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bar floats above the on-screen keyboard\u003c/td>\u003ctd>Viewport resizes on input\u003c/td>\u003ctd>Hide it while a \u003ca href=\"#Text%20field\" data-term=\"Text field\">text field\u003c/a> has focus\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mis-taps on neighbouring items\u003c/td>\u003ctd>Small targets\u003c/td>\u003ctd>Size each item as a generous \u003ca href=\"#Touch%20target\" data-term=\"Touch target\">touch target\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>State preservation is the less visible problem. If tapping a section resets its scroll position and filters, people lose their place every time they compare two sections. Keep each section's state when moving away. Tapping the current item again conventionally scrolls that section to the top.\u003c/p>\u003cp>Mark the current item with more than colour, as WCAG 1.4.1 requires. A filled icon, an indicator or a bolder label works.\u003c/p>","avoid":"","usage":["Checkout is stuck behind the tab bar on iPhones.","The bottom navigation overlaps the page. Pad the content by its height plus the safe-area inset."],"out":[44,31,30,33,83,7,106]},{"name":"Tree view","section":3,"description":"A hierarchical list whose parent items expand and collapse, navigated with arrow keys, such as a file explorer.","body":"\u003cp>A tree view is a hierarchical list whose parent items expand and collapse, such as the file explorer in a code editor. It suits deep, browsable structures where people move around and act on items. Do not use it for ordinary site navigation. A nested list of links with disclosure \u003ca href=\"#Button\" data-term=\"Button\">buttons\u003c/a> is simpler and is what most sites need, because ARIA tree roles replace normal link and Tab behaviour with application-style keys.\u003c/p>\u003cp>The whole tree takes one Tab stop, usually managed with a \u003ca href=\"#Roving%20tabindex\" data-term=\"Roving tabindex\">roving tabindex\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Up, Down Arrow\u003c/td>\u003ctd>Previous or next visible node\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Right Arrow\u003c/td>\u003ctd>Opens a closed node, or moves to the first child of an open one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Left Arrow\u003c/td>\u003ctd>Closes an open node, or moves to the parent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Home, End\u003c/td>\u003ctd>First or last visible node\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter\u003c/td>\u003ctd>Performs the node's default action\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Letter keys\u003c/td>\u003ctd>Type-ahead to a matching node\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>*\u003c/code>\u003c/td>\u003ctd>Optionally expands all siblings at that level\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cpre>\u003ccode>&lt;ul role=&quot;tree&quot; aria-label=&quot;Project files&quot;&gt;\n  &lt;li role=&quot;treeitem&quot; aria-expanded=&quot;true&quot; aria-selected=&quot;false&quot; tabindex=&quot;0&quot;&gt;\n    &lt;span&gt;src&lt;/span&gt;\n    &lt;ul role=&quot;group&quot;&gt;\n      &lt;li role=&quot;treeitem&quot; aria-selected=&quot;true&quot; tabindex=&quot;-1&quot;&gt;index.ts&lt;/li&gt;\n    &lt;/ul&gt;\n  &lt;/li&gt;\n&lt;/ul&gt;\u003c/code>\u003c/pre>\u003cp>Only parent nodes get \u003ccode>aria-expanded\u003c/code>. Putting \u003ccode>aria-expanded=&quot;false&quot;\u003c/code> on a leaf is a common bug, because a screen reader then announces a file as collapsed, and the user tries to open something that has no children.\u003c/p>\u003cp>Moving focus and selecting are separate. In a \u003ca href=\"#Multi-select\" data-term=\"Multi-select\">multi-select\u003c/a> tree, the recommended model uses Space to toggle the focused node, so arrow keys can move without clearing the existing selection.\u003c/p>\u003cp>Large trees are often loaded on demand or rendered as a \u003ca href=\"#Virtualized%20list\" data-term=\"Virtualized list\">virtualized list\u003c/a>. When not all nodes are in the DOM, \u003ccode>aria-level\u003c/code>, \u003ccode>aria-setsize\u003c/code> and \u003ccode>aria-posinset\u003c/code> are required, or screen readers report wrong positions.\u003c/p>\u003cp>Make the arrow a distinct target for expanding and the label a target for activating. When a parent collapses around the focused child, move focus to the parent.\u003c/p>","avoid":"","usage":["VoiceOver says every file in the project is collapsed.","The tree view sets \u003ccode>aria-expanded\u003c/code> on leaf nodes too. Only parents should have it."],"out":[0,107,14,68]},{"name":"Skip link","section":3,"description":"A link at the start of a page that lets keyboard users jump past repeated navigation to the main content.","body":"\u003cp>A skip link is a link at the start of a page that lets keyboard users jump past repeated navigation to the main content. Without one, someone using only the keyboard must Tab through every item in the \u003ca href=\"#Navbar\" data-term=\"Navbar\">navbar\u003c/a> and \u003ca href=\"#Sidebar\" data-term=\"Sidebar\">sidebar\u003c/a> on each page before reaching what they came for. It is usually hidden until it receives focus, so most mouse users never see it.\u003c/p>\u003cpre>\u003ccode>&lt;body&gt;\n  &lt;a class=&quot;skip-link&quot; href=&quot;#main&quot;&gt;Skip to main content&lt;/a&gt;\n  &lt;header&gt;...&lt;/header&gt;\n  &lt;main id=&quot;main&quot; tabindex=&quot;-1&quot;&gt;...&lt;/main&gt;\n&lt;/body&gt;\u003c/code>\u003c/pre>\u003cpre>\u003ccode>.skip-link {\n  position: absolute;\n  transform: translateY(-200%);\n}\n.skip-link:focus {\n  transform: none;\n}\u003c/code>\u003c/pre>\u003cp>It should be the first focusable element. Pressing Tab on page load reveals it, Enter activates it, and the next Tab continues from inside \u003ccode>&lt;main&gt;\u003c/code>. \u003ccode>tabindex=&quot;-1&quot;\u003c/code> on the target lets it take focus programmatically without adding a Tab stop.\u003c/p>\u003cp>WCAG 2.4.1, Bypass Blocks (Level A), requires a way to skip content repeated across pages. Skip links are one sufficient technique. Headings and landmarks, such as \u003ccode>&lt;main&gt;\u003c/code> and \u003ccode>&lt;nav&gt;\u003c/code>, are also listed, and screen reader users often navigate by them. Those shortcuts are not available to sighted keyboard users without extra tools, so a skip link remains useful alongside them.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Failure\u003c/th>\u003cth>Cause\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Link never appears\u003c/td>\u003ctd>Hidden with \u003ccode>display: none\u003c/code>\u003c/td>\u003ctd>Move it off-screen or clip it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Visible but under the header\u003c/td>\u003ctd>Lower stacking than a sticky bar\u003c/td>\u003ctd>Raise its \u003ccode>z-index\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Nothing happens on Enter\u003c/td>\u003ctd>Target \u003ccode>id\u003c/code> is missing\u003c/td>\u003ctd>Add the \u003ccode>id\u003c/code> to \u003ccode>&lt;main&gt;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Router intercepts the link\u003c/td>\u003ctd>\u003ccode>#main\u003c/code> treated as a route change\u003c/td>\u003ctd>Handle it and focus the target\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Target hidden after the jump\u003c/td>\u003ctd>\u003ca href=\"#Sticky%20header\" data-term=\"Sticky header\">Sticky header\u003c/a> covers it\u003c/td>\u003ctd>Set \u003ccode>scroll-padding-block-start\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>In single-page applications, the route changes without a page load and focus may stay in the previous view. After navigation, move focus to the new page's heading or the top of the document.\u003c/p>\u003cp>When revealed, the link needs a clear \u003ca href=\"#Focus%20ring\" data-term=\"Focus ring\">focus ring\u003c/a>.\u003c/p>","avoid":"","usage":["I have to tab through forty nav links on every page.","We need a skip link as the first focusable element, pointing at \u003ccode>main\u003c/code>."],"out":[30,31,66,103]},{"name":"Modal dialog","section":4,"description":"A window over the page that blocks everything behind it until the user completes or dismisses it.","body":"\u003cp>A modal dialog is a window over the page that blocks everything behind it until the user completes or dismisses it. Use it for a short, focused task that must be finished or abandoned before continuing, such as editing a record. If people need to refer to the page while working, use a non-modal \u003ca href=\"#Drawer\" data-term=\"Drawer\">drawer\u003c/a> or a \u003ca href=\"#Popover\" data-term=\"Popover\">popover\u003c/a>. For a confirmation that demands a decision, use an \u003ca href=\"#Alert%20dialog\" data-term=\"Alert dialog\">alert dialog\u003c/a>.\u003c/p>\u003cp>Use the native \u003ccode>&lt;dialog&gt;\u003c/code> element and open it with \u003ccode>showModal()\u003c/code>.\u003c/p>\u003cpre>\u003ccode>&lt;dialog id=&quot;edit&quot; aria-labelledby=&quot;edit-title&quot;&gt;\n  &lt;h2 id=&quot;edit-title&quot;&gt;Edit address&lt;/h2&gt;\n  &lt;form method=&quot;dialog&quot;&gt;\n    &lt;button value=&quot;cancel&quot;&gt;Cancel&lt;/button&gt;\n    &lt;button value=&quot;save&quot;&gt;Save&lt;/button&gt;\n  &lt;/form&gt;\n&lt;/dialog&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Behaviour\u003c/th>\u003cth>\u003ccode>showModal()\u003c/code> provides\u003c/th>\u003cth>You still do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Renders above all content\u003c/td>\u003ctd>Yes, in the top layer\u003c/td>\u003ctd>Style the \u003ccode>::backdrop\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Makes the page inert\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Nothing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Moves focus inside\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Use \u003ccode>autofocus\u003c/code> where it helps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Closes on Escape\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Handle \u003ccode>cancel\u003c/code> to guard drafts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Returns focus on close\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Handle a removed trigger\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Names the dialog\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Add \u003ccode>aria-labelledby\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stops the page scrolling\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Add a \u003ca href=\"#Scroll%20lock\" data-term=\"Scroll lock\">scroll lock\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Content behind the dialog cannot receive focus. A custom build has to reproduce this with a \u003ca href=\"#Focus%20trap\" data-term=\"Focus trap\">focus trap\u003c/a>. Do not put \u003ccode>tabindex\u003c/code> on the \u003ccode>&lt;dialog&gt;\u003c/code> element, which the HTML specification forbids.\u003c/p>\u003cp>Initial focus depends on the content. The first control is the default. For long content, focus a heading with \u003ccode>tabindex=&quot;-1&quot;\u003c/code> so the top is not scrolled out of view. Always include a visible close control, because not everyone has an Escape key.\u003c/p>\u003cp>Closing on an outside click is risky for forms because a stray click discards work. The \u003ccode>closedby\u003c/code> attribute controls this, but MDN lists it as limited availability.\u003c/p>\u003cp>If the trigger is gone when the dialog closes, such as after deleting its row, move focus to a logical nearby element yourself. Otherwise focus falls to the page body and keyboard users lose their place.\u003c/p>","avoid":"","usage":["Keyboard users can tab to the page behind our edit popup.","It's a styled \u003ccode>div\u003c/code>. Make it a real modal dialog with \u003ccode>showModal()\u003c/code>."],"out":[44,46,43,51,50]},{"name":"Alert dialog","section":4,"description":"A modal dialog that interrupts the user with an important message and requires a response, such as confirming a deletion.","body":"\u003cp>An alert dialog is a \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a> that interrupts the user with an important message and requires a response, such as &quot;Delete this project?&quot;. The \u003ccode>alertdialog\u003c/code> role tells assistive technology that this is an urgent interruption, and some platforms treat it specially, for example by playing a system sound. Use it only when the person must decide before continuing.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Situation\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Irreversible, serious action\u003c/td>\u003ctd>Alert dialog\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reversible action\u003c/td>\u003ctd>Do it, then offer an \u003ca href=\"#Undo%20pattern\" data-term=\"Undo pattern\">undo pattern\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Result of a completed action\u003c/td>\u003ctd>\u003ca href=\"#Toast\" data-term=\"Toast\">Toast\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Problem tied to part of the page\u003c/td>\u003ctd>\u003ca href=\"#Inline%20alert\" data-term=\"Inline alert\">Inline alert\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Overuse is the common failure. When every action asks &quot;Are you sure?&quot;, people learn to press the confirm \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> without reading, so the one that matters gets the same reflex. Reserve the pattern for actions that cannot be undone, and offer undo for the rest.\u003c/p>\u003cpre>\u003ccode>&lt;dialog role=&quot;alertdialog&quot; aria-labelledby=&quot;t&quot; aria-describedby=&quot;d&quot;&gt;\n  &lt;h2 id=&quot;t&quot;&gt;Delete project?&lt;/h2&gt;\n  &lt;p id=&quot;d&quot;&gt;This removes 12 environments and cannot be undone.&lt;/p&gt;\n  &lt;button autofocus&gt;Cancel&lt;/button&gt;\n  &lt;button&gt;Delete project&lt;/button&gt;\n&lt;/dialog&gt;\u003c/code>\u003c/pre>\u003cp>Open it with \u003ccode>showModal()\u003c/code> to get the same inert background, focus handling and Escape behaviour as any modal. The title is linked with \u003ccode>aria-labelledby\u003c/code>, and the message with \u003ccode>aria-describedby\u003c/code>, so that a screen reader announces both as the dialog opens.\u003c/p>\u003cp>For destructive actions, the WAI-ARIA Authoring Practices advise that initial focus may go to the least destructive control. If the focus lands on Delete, an accidental Enter or Space, perhaps from a key held down from the previous step, causes the loss the dialog was meant to prevent. Escape should act as Cancel, and clicking the backdrop should not count as confirmation.\u003c/p>\u003cp>Button labels should state the outcome. &quot;Delete project&quot; and &quot;Keep project&quot; can be understood without reading the message, while &quot;OK&quot; and &quot;Cancel&quot; are ambiguous for a question such as &quot;Cancel this subscription?&quot;. When the dialog closes, focus returns to the trigger, or moves to a sensible neighbour if the trigger was deleted.\u003c/p>","avoid":"","usage":["Someone double-pressed Enter and wiped their workspace.","The alert dialog focuses Delete on open. Autofocus Cancel instead."],"out":[42,62,53,55,0]},{"name":"Drawer","section":4,"description":"A panel that slides in from a screen edge to show navigation, details or a form, either modally or beside the page.","body":"\u003cp>A drawer is a panel that slides in from a screen edge to show navigation, details or a form. It keeps people on the current page and gives more room than a small dialog, which suits viewing a record from a list or holding filters. A \u003ca href=\"#Sidebar\" data-term=\"Sidebar\">sidebar\u003c/a> is part of the page layout and stays open. A \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a> is centred and suits a short task. On phones, a \u003ca href=\"#Bottom%20sheet\" data-term=\"Bottom sheet\">bottom sheet\u003c/a> is often the better form.\u003c/p>\u003cp>The first decision is whether it blocks the page.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Page behind\u003c/th>\u003cth>Focus\u003c/th>\u003cth>Build with\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Modal\u003c/td>\u003ctd>Inert, dimmed\u003c/td>\u003ctd>Moves in and stays in\u003c/td>\u003ctd>\u003ccode>&lt;dialog&gt;\u003c/code> with \u003ccode>showModal()\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Non-modal\u003c/td>\u003ctd>Still usable\u003c/td>\u003ctd>Follows the trigger in the Tab order\u003c/td>\u003ctd>\u003ccode>&lt;aside&gt;\u003c/code> or \u003ccode>show()\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A modal drawer is a dialog with different CSS. Using \u003ccode>&lt;dialog&gt;\u003c/code> provides the inert background, Escape handling and focus return.\u003c/p>\u003cpre>\u003ccode>dialog.drawer {\n  margin: 0 0 0 auto;\n  height: 100dvh;\n  max-height: none;\n}\u003c/code>\u003c/pre>\u003cp>A non-modal drawer must sit next to its trigger in the DOM, or use an equivalent focus order. WCAG 2.4.3 requires a focus order that preserves meaning, and a panel at the end of the document forces keyboard users to Tab through the entire page to reach what they just opened. Keep a labelled close \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>, and let Escape close it while focus is inside.\u003c/p>\u003cp>A closed drawer can remain in the Tab order. Moved off-screen with \u003ccode>transform\u003c/code>, it stays focusable, so Tab disappears into invisible links and screen readers read content nobody can see. A closed \u003ccode>&lt;dialog&gt;\u003c/code> avoids this. For a custom panel, apply \u003ccode>inert\u003c/code> or \u003ccode>hidden\u003c/code> when closed, after any exit animation ends.\u003c/p>\u003cp>Slide animations should respect \u003ca href=\"#Reduced%20motion\" data-term=\"Reduced motion\">reduced motion\u003c/a>. A modal drawer also needs a \u003ca href=\"#Scroll%20lock\" data-term=\"Scroll lock\">scroll lock\u003c/a> so the page behind does not move.\u003c/p>","avoid":"","usage":["With the filter panel closed, Tab still lands on invisible controls.","The drawer is only translated off-screen. Set \u003ccode>inert\u003c/code> when it's closed."],"out":[31,42,45,0,111,51]},{"name":"Bottom sheet","section":4,"description":"A panel that rises from the bottom of a mobile screen, often draggable between heights, for options or supporting content.","body":"\u003cp>A bottom sheet is a panel that rises from the bottom of a mobile screen to show options or supporting content, such as share targets or a place's details over a map. Many sheets can be dragged between set heights, often called detents. On wide screens, the same content usually moves to a \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a>, \u003ca href=\"#Popover\" data-term=\"Popover\">popover\u003c/a> or \u003ca href=\"#Drawer\" data-term=\"Drawer\">drawer\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Page behind\u003c/th>\u003cth>Suits\u003c/th>\u003cth>Semantics\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Modal\u003c/td>\u003ctd>Inert\u003c/td>\u003ctd>A choice that must be made or dismissed\u003c/td>\u003ctd>\u003ccode>&lt;dialog&g
