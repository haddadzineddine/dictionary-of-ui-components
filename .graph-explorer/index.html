t;button&quot; } : {};\n  return &lt;Tag className=&quot;btn&quot; {...typeProp} {...props} /&gt;;\n}\n\n&lt;Button onClick={save}&gt;Save&lt;/Button&gt;\n&lt;Button as=&quot;a&quot; href=&quot;/pricing&quot;&gt;See pricing&lt;/Button&gt;\u003c/code>\u003c/pre>\u003cp>Pick the element that matches the behaviour. A link navigates to a URL, and a button performs an action. Changing the tag changes what the browser provides, and the component does not get that behaviour back for free.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Rendered as\u003c/th>\u003cth>What changes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>&lt;button&gt;\u003c/code>\u003c/td>\u003ctd>Focusable, activates on Enter and Space, supports \u003ccode>disabled\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;a href&gt;\u003c/code>\u003c/td>\u003ctd>Focusable, activates on Enter only, can open in a new tab\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;a&gt;\u003c/code> no \u003ccode>href\u003c/code>\u003c/td>\u003ctd>Not a link and not focusable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;div&gt;\u003c/code>\u003c/td>\u003ctd>No role, no focus, no keyboard activation\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Using \u003ccode>as=&quot;div&quot;\u003c/code> on an interactive component removes its keyboard behaviour. It still looks and clicks like a button, but keyboard users cannot reach it and screen readers, which read the UI aloud, do not announce it as a control. Restrict the allowed values, or add the role, \u003ccode>tabindex\u003c/code> and key handling when a non-interactive element is truly required.\u003c/p>\u003cp>Attributes do not all carry over either. \u003ccode>disabled\u003c/code> has no effect on an \u003ccode>&lt;a&gt;\u003c/code>, so a &quot;disabled&quot; link stays clickable. If a link must appear unavailable, remove the \u003ccode>href\u003c/code> and communicate the \u003ca href=\"#Disabled%20state\" data-term=\"Disabled state\">disabled state\u003c/a> another way.\u003c/p>\u003cp>TypeScript adds cost. Correctly typing props that change with \u003ccode>as\u003c/code> requires complex generics, which can slow the type checker and produce hard-to-read errors. An alternative is the \u003ccode>asChild\u003c/code> pattern, where the component merges its props onto a single child element supplied by the caller, as described in \u003ca href=\"#Slot\" data-term=\"Slot\">Slot\u003c/a>. This leaves the choice of element visible in the calling code and avoids the generic types.\u003c/p>","avoid":"","usage":["The nav item looks like a button but Tab skips it.","Someone passed \u003ccode>as=&quot;div&quot;\u003c/code> to our polymorphic component. It should be an anchor with an \u003ccode>href\u003c/code>."],"out":[105,96]},{"name":"Slot","section":8,"description":"A named placeholder inside a component where the caller supplies their own content.","body":"\u003cp>A slot is a named placeholder inside a component where the caller supplies their own content. The component controls the structure and position, and the caller controls what goes there. A \u003ccode>Card\u003c/code> might expose \u003ccode>header\u003c/code>, \u003ccode>media\u003c/code> and \u003ccode>footer\u003c/code> slots. Slots usually replace a growing list of props such as \u003ccode>title\u003c/code>, \u003ccode>titleIcon\u003c/code>, \u003ccode>titleColor\u003c/code> and \u003ccode>subtitle\u003c/code>, each added for one screen.\u003c/p>\u003cpre>\u003ccode>function Card({ header, footer, children }) {\n  return (\n    &lt;article className=&quot;card&quot;&gt;\n      &lt;header&gt;{header}&lt;/header&gt;\n      &lt;div className=&quot;card-body&quot;&gt;{children}&lt;/div&gt;\n      {footer &amp;&amp; &lt;footer&gt;{footer}&lt;/footer&gt;}\n    &lt;/article&gt;\n  );\n}\n\n&lt;Card header={&lt;h2&gt;Invoice 1042&lt;/h2&gt;} footer={&lt;PayButton /&gt;}&gt;\n  Due on 14 March\n&lt;/Card&gt;\u003c/code>\u003c/pre>\u003cp>The mechanism differs by technology.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technology\u003c/th>\u003cth>How a slot is expressed\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Web Components\u003c/td>\u003ctd>\u003ccode>&lt;slot name=&quot;footer&quot;&gt;\u003c/code> in the shadow tree\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vue\u003c/td>\u003ctd>\u003ccode>&lt;slot name=&quot;footer&quot;&gt;\u003c/code> in the template\u003c/td>\u003c/tr>\u003ctr>\u003ctd>React\u003c/td>\u003ctd>\u003ccode>children\u003c/code> and props that accept elements\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>In Web Components, a \u003ccode>&lt;slot&gt;\u003c/code> can contain fallback content, shown when nothing is assigned to it. Slotted nodes remain in the light DOM, the host's regular children, and are only displayed at the slot's position. Page styles therefore still apply to them, and \u003ccode>::slotted()\u003c/code> from inside the component reaches only the top-level assigned elements.\u003c/p>\u003cp>Some libraries use the word for a different technique. An \u003ccode>asChild\u003c/code> prop, or a \u003ccode>Slot\u003c/code> utility, merges a component's props onto the single element the caller passes, so a menu trigger can be a custom link without an extra wrapper. This fails when the child does not pass received props and refs to its DOM node, leaving the trigger inert.\u003c/p>\u003cp>Slots hand structure to callers, which brings accessibility risk. A caller can put a link inside a slot that is already wrapped in a \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>, producing invalid nested interactive content. Document what each slot accepts, and wire names from the component, for example by connecting a dialog's title slot through \u003ccode>aria-labelledby\u003c/code>.\u003c/p>\u003cp>Prefer a slot when content varies. Use a plain prop for simple data like a label string, and a \u003ca href=\"#Render%20prop\" data-term=\"Render prop\">render prop\u003c/a> when the content depends on the component's internal state.\u003c/p>","avoid":"","usage":["Design wants an icon and a link in the card title now.","Stop adding title props. Give the card a header slot."],"out":[0,97]},{"name":"Render prop","section":8,"description":"A prop whose value is a function that the component calls with internal state to produce UI.","body":"\u003cp>A render prop is a prop whose value is a function that the component calls with its internal state to produce UI. The component owns the logic, and the caller decides what the output looks like. It is useful when the content of a region depends on data only the component knows, such as which row is being rendered in a list.\u003c/p>\u003cpre>\u003ccode>&lt;VirtualList\n  items={contacts}\n  renderItem={(contact, { index, isFocused }) =&gt; (\n    &lt;ContactRow contact={contact} index={index} highlighted={isFocused} /&gt;\n  )}\n/&gt;\u003c/code>\u003c/pre>\u003cp>The nearest alternatives solve slightly different problems.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Pattern\u003c/th>\u003cth>Content depends on internal state\u003c/th>\u003cth>Typical use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Slot\" data-term=\"Slot\">Slot\u003c/a>\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Fixed regions of a layout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Render prop\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>List items, custom cells\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hook\u003c/td>\u003ctd>Yes, caller owns all markup\u003c/td>\u003ctd>Sharing logic only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Compound%20component\" data-term=\"Compound component\">Compound component\u003c/a>\u003c/td>\u003ctd>Via context\u003c/td>\u003ctd>Multi-part widgets\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>In React, hooks replaced many earlier uses of render props for sharing logic, because several render props combined produced deeply nested callbacks. The pattern remains a good fit when a parent must render per item, as a \u003ca href=\"#Virtualized%20list\" data-term=\"Virtualized list\">virtualized list\u003c/a> or \u003ca href=\"#Data%20table\" data-term=\"Data table\">data table\u003c/a> does when it asks the caller how to draw each row.\u003c/p>\u003cp>Performance is the first thing that goes wrong. An inline function has a new identity on every render, so a memoized child that receives it re-renders each time. Memoize the row component itself, and keep the function stable if measurements show a problem.\u003c/p>\u003cp>Remounting is a less obvious failure. Defining a component inside the render function creates a new component type on each render, so the framework discards the previous subtree. Inputs lose their text and focus disappears. Return elements of a stable component type instead.\u003c/p>\u003cp>Render props can also drop accessibility wiring, because the caller writes the markup. If the component needs \u003ccode>role\u003c/code>, \u003ccode>id\u003c/code> or \u003ccode>aria-selected\u003c/code> on each option, pass them as a props object, and require the caller to spread it, as in \u003ccode>renderOption={(option, props) =&gt; &lt;li {...props}&gt;{option.label}&lt;/li&gt;}\u003c/code>.\u003c/p>","avoid":"","usage":["Every keystroke in the row's input loses focus.","The render prop defines a new component inline, so it remounts. Move it out."],"out":[96,94,68,65]},{"name":"Variant","section":8,"description":"A named, predefined visual version of a component, selected through a prop such as primary or danger.","body":"\u003cp>A variant is a named, predefined visual version of a component, selected through a prop such as \u003ccode>variant=&quot;danger&quot;\u003c/code>. Variants give a \u003ca href=\"#Component%20library\" data-term=\"Component library\">component library\u003c/a> a limited set of approved appearances, so teams do not restyle a \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> with one-off classes on each screen.\u003c/p>\u003cpre>\u003ccode>&lt;Button variant=&quot;primary&quot; size=&quot;md&quot;&gt;Save&lt;/Button&gt;\n&lt;Button variant=&quot;danger&quot; size=&quot;sm&quot;&gt;Delete&lt;/Button&gt;\u003c/code>\u003c/pre>\u003cp>A component's styling usually has separate axes, and each should be its own prop.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Axis\u003c/th>\u003cth>Example values\u003c/th>\u003cth>Describes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Variant\u003c/td>\u003ctd>\u003ccode>primary\u003c/code>, \u003ccode>secondary\u003c/code>, \u003ccode>ghost\u003c/code>\u003c/td>\u003ctd>Visual emphasis\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tone\u003c/td>\u003ctd>\u003ccode>neutral\u003c/code>, \u003ccode>danger\u003c/code>, \u003ccode>success\u003c/code>\u003c/td>\u003ctd>Meaning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Size\u003c/td>\u003ctd>\u003ccode>sm\u003c/code>, \u003ccode>md\u003c/code>, \u003ccode>lg\u003c/code>\u003c/td>\u003ctd>Physical scale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>State\u003c/td>\u003ctd>hover, focus, disabled\u003c/td>\u003ctd>Current interaction, not a prop choice\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Interaction states are not variants. A \u003ca href=\"#Hover%20state\" data-term=\"Hover state\">hover state\u003c/a> or \u003ca href=\"#Disabled%20state\" data-term=\"Disabled state\">disabled state\u003c/a> applies on top of every variant, so each one has to be designed and tested for all of them.\u003c/p>\u003cp>Use a union value instead of boolean props. With \u003ccode>&lt;Button primary danger ghost&gt;\u003c/code>, the API allows contradictory combinations and nothing says which wins. A single \u003ccode>variant\u003c/code> prop with a closed set of values makes invalid combinations impossible, and a type checker can enforce it.\u003c/p>\u003cp>Combinations are the main cost. Three variants, three tones, three sizes and five states already produce 135 possible appearances. Some will be unintended or untested, and a danger ghost button may fail contrast even though the other pairings pass. Define only the combinations you support, and list them in a \u003ca href=\"#Component%20explorer\" data-term=\"Component explorer\">component explorer\u003c/a> so that gaps are visible. Each one must meet the 4.5:1 text contrast of WCAG 1.4.3, and its \u003ca href=\"#Focus%20ring\" data-term=\"Focus ring\">focus ring\u003c/a> must remain visible.\u003c/p>\u003cp>A \u003ccode>danger\u003c/code> button also needs a label that states the action, because color alone does not convey meaning.\u003c/p>\u003cp>If a new option changes behaviour, structure or required props, it is probably a separate component.\u003c/p>","avoid":"","usage":["Can I just add a red class to this button?","Use the danger variant so it gets the tested hover, focus and contrast styles."],"out":[91,0,102,105,100,103]},{"name":"Uncontrolled component","section":8,"description":"A component that keeps its own state internally, taking only an initial value from its parent.","body":"\u003cp>An uncontrolled component keeps its own state internally and takes only an initial value from its parent. A plain HTML \u003ccode>&lt;input&gt;\u003c/code> works this way: the browser stores what the user types, and your code reads it when needed. The opposite is a controlled component, where the parent owns the value and passes it down on every change.\u003c/p>\u003cpre>\u003ccode>// Uncontrolled: the DOM holds the value\n&lt;input name=&quot;email&quot; defaultValue={user.email} /&gt;\n\n// Controlled: the parent holds the value\n&lt;input value={email} onChange={(e) =&gt; setEmail(e.target.value)} /&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Uncontrolled\u003c/th>\u003cth>Controlled\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Where is the value stored?\u003c/td>\u003ctd>DOM or component\u003c/td>\u003ctd>Parent state\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read the value only on submit?\u003c/td>\u003ctd>A good fit\u003c/td>\u003ctd>Extra code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Validate or format on each keystroke?\u003c/td>\u003ctd>Awkward\u003c/td>\u003ctd>A good fit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Keep two views in sync?\u003c/td>\u003ctd>Difficult\u003c/td>\u003ctd>A good fit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Re-render on each keystroke?\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Usually\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Uncontrolled \u003ca href=\"#Text%20field\" data-term=\"Text field\">text fields\u003c/a> suit simple forms, because \u003ccode>FormData\u003c/code> can collect every named field at submit time and the parent does not re-render while the user types.\u003c/p>\u003cp>A common bug comes from expecting the initial value to update. \u003ccode>defaultValue\u003c/code> is read only when the component first mounts. If a user switches from customer A to customer B and the same form stays mounted, the fields still show customer A's data. Giving the form a key tied to the record forces a fresh mount:\u003c/p>\u003cpre>\u003ccode>&lt;CustomerForm key={customer.id} customer={customer} /&gt;\u003c/code>\u003c/pre>\u003cp>Another common failure is switching modes. In React, a \u003ccode>value\u003c/code> that starts as \u003ccode>undefined\u003c/code> and later becomes a string turns an uncontrolled input into a controlled one and logs a warning. Initialise the state to an empty string, or use \u003ccode>value ?? &quot;&quot;\u003c/code>. A \u003ccode>value\u003c/code> with no \u003ccode>onChange\u003c/code> handler produces a field that cannot be edited.\u003c/p>\u003cp>Library components often support both modes, accepting \u003ccode>value\u003c/code> with \u003ccode>onChange\u003c/code>, or \u003ccode>defaultValue\u003c/code> alone. A \u003ca href=\"#Dropdown%20menu\" data-term=\"Dropdown menu\">dropdown menu\u003c/a> may have \u003ccode>open\u003c/code> and \u003ccode>defaultOpen\u003c/code>, for example. Follow this naming so callers can start uncontrolled and take over the state only when they need it.\u003c/p>","avoid":"","usage":["The edit form still shows the last customer after I pick a new one.","It's an uncontrolled component using \u003ccode>defaultValue\u003c/code>. Add a \u003ccode>key\u003c/code> so it remounts."],"out":[7,36]},{"name":"Component explorer","section":8,"description":"A development tool that renders components in isolation so each state can be built, reviewed and tested.","body":"\u003cp>A component explorer is a development tool that renders components in isolation, so each state can be built, reviewed and tested without running the full application. Storybook is a widely used example. Reaching a payment form's declined message in the real app might take a login, a seeded account and a failed card, whereas an explorer shows that state directly.\u003c/p>\u003cp>Each entry, often called a story, renders a component with fixed inputs.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>State to capture\u003c/th>\u003cth>Why it is worth having\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Default\u003c/td>\u003ctd>Baseline for review\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>Shows the \u003ca href=\"#Skeleton%20screen\" data-term=\"Skeleton screen\">skeleton screen\u003c/a> or \u003ca href=\"#Spinner\" data-term=\"Spinner\">spinner\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Empty%20state\" data-term=\"Empty state\">Empty state\u003c/a>\u003c/td>\u003ctd>Rarely seen during normal development\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Error%20state\" data-term=\"Error state\">Error state\u003c/a>\u003c/td>\u003ctd>Hard to trigger in the real app\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Long content\u003c/td>\u003ctd>Exposes overflow and truncation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dark theme\u003c/td>\u003ctd>Exposes hard-coded colors\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Designers can review real components in a browser, and generated prop tables turn the explorer into documentation for a \u003ca href=\"#Component%20library\" data-term=\"Component library\">component library\u003c/a>.\u003c/p>\u003cp>It also provides a base for automated tests. Visual regression tools compare screenshots of each story to catch unintended changes, and automated accessibility checkers can run against each state. These checkers find only some issues, so manual testing with a keyboard and a screen reader (software that reads the UI aloud) is still needed.\u003c/p>\u003cp>Stories go out of date when they are written once and abandoned. Run them as tests in continuous integration so that a broken story fails the build.\u003c/p>\u003cp>Isolation also hides integration problems. A component can look correct in an explorer and break in the app, because the app adds global CSS, providers, real data lengths or a parent that creates a stacking context, which traps \u003ccode>z-index\u003c/code> values. Load the application's global styles and providers in the explorer and use realistic data.\u003c/p>","avoid":"","usage":["How do I see the payment form's declined state without a test card?","Open it in the component explorer. There's a story for each error."],"out":[59,58,60,61,91]},{"name":"Atomic design","section":8,"description":"A methodology by Brad Frost that describes interfaces in five levels, from atoms up to complete pages.","body":"\u003cp>Atomic design is a methodology created by Brad Frost that describes interfaces in five levels, from small parts up to complete pages. It borrows its names from chemistry. Its purpose is to help a team think about an interface as a whole and as a collection of parts at the same time.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Definition\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Atoms\u003c/td>\u003ctd>Basic elements that cannot be reduced further and still function\u003c/td>\u003ctd>Label, input, \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Molecules\u003c/td>\u003ctd>Simple groups of atoms working as one unit\u003c/td>\u003ctd>\u003ca href=\"#Search%20field\" data-term=\"Search field\">Search field\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Organisms\u003c/td>\u003ctd>Distinct sections built from smaller parts\u003c/td>\u003ctd>Site header\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Templates\u003c/td>\u003ctd>Page layouts showing content structure\u003c/td>\u003ctd>Article layout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pages\u003c/td>\u003ctd>Templates filled with representative content\u003c/td>\u003ctd>The real pricing page\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The page level is useful because a headline that fits a template with placeholder text may wrap to four lines with a real title. In code, atoms roughly correspond to a \u003ca href=\"#Primitive%20component\" data-term=\"Primitive component\">primitive component\u003c/a>.\u003c/p>\u003cp>Frost describes atomic design as a mental model and states that it is not a linear process.\u003c/p>\u003cp>The common failure comes from applying the levels as a strict folder structure. A team creates \u003ccode>atoms/\u003c/code>, \u003ccode>molecules/\u003c/code> and \u003ccode>organisms/\u003c/code>, then spends review time arguing about whether a \u003ca href=\"#Card\" data-term=\"Card\">card\u003c/a> is a molecule or an organism. The answer rarely affects how the code works. Many teams organise files by feature or component name and keep the vocabulary for discussion only.\u003c/p>\u003cp>The hierarchy says nothing about accessibility on its own. A set of accessible atoms can still form an inaccessible organism, for example if a label is separated from its input or the heading levels are wrong when the parts combine. Test at the level where users actually meet the interface.\u003c/p>","avoid":"","usage":["Is this filter bar a molecule or an organism?","It doesn't matter. Atomic design is there to help us talk about it, so put it with the search feature."],"out":[0,21,92,64]},{"name":"Hover state","section":9,"description":"The visual change on an element while a pointer rests over it, signalling that it can be interacted with.","body":"\u003cp>A hover state is the visual change on an element while a pointer rests over it, signalling that the element can be interacted with. A darker \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> background or an underlined link are typical examples. In CSS it is written with the \u003ccode>:hover\u003c/code> pseudo-class. It is an extra hint for mouse and trackpad users, because touch and keyboard users may never trigger it.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>State\u003c/th>\u003cth>Trigger\u003c/th>\u003cth>CSS\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>Pointer over the element\u003c/td>\u003ctd>\u003ccode>:hover\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Focus%20ring\" data-term=\"Focus ring\">Focus\u003c/a>\u003c/td>\u003ctd>Keyboard or script focus\u003c/td>\u003ctd>\u003ccode>:focus-visible\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Active%20state\" data-term=\"Active state\">Active\u003c/a>\u003c/td>\u003ctd>Being pressed\u003c/td>\u003ctd>\u003ccode>:active\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Disabled%20state\" data-term=\"Disabled state\">Disabled\u003c/a>\u003c/td>\u003ctd>Unavailable\u003c/td>\u003ctd>\u003ccode>:disabled\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Do not hide essential controls behind hover. A table row whose Edit and Delete buttons appear only on hover gives touch users no way to reach them, and keyboard users may tab onto invisible controls. Keep the controls visible on devices that cannot hover, and reveal them on keyboard focus as well.\u003c/p>\u003cpre>\u003ccode>.row-actions { opacity: 1; }\n\n@media (hover: hover) {\n  .row-actions { opacity: 0; }\n  .row:hover .row-actions,\n  .row:focus-within .row-actions { opacity: 1; }\n}\u003c/code>\u003c/pre>\u003cp>The \u003ccode>hover\u003c/code> media feature describes only the primary input, so a laptop with a touchscreen may report either value.\u003c/p>\u003cp>Touchscreens cause a second bug. Depending on the browser, \u003ccode>:hover\u003c/code> may never match, may match briefly, or may stay applied after a tap until the user touches something else. A button then looks stuck in its highlighted state. Wrapping hover styles in \u003ccode>@media (hover: hover)\u003c/code> prevents this on most phones.\u003c/p>\u003cp>Content that appears on hover, such as a \u003ca href=\"#Tooltip\" data-term=\"Tooltip\">tooltip\u003c/a>, has specific requirements under WCAG 1.4.13 Content on Hover or Focus. The user must be able to dismiss it without moving the pointer, move the pointer onto it without it vanishing, and it must stay until they leave.\u003c/p>\u003cp>Avoid hover changes that alter layout, such as a bolder font or a thicker border, which shift neighbouring elements. Use color, shadow or an outline.\u003c/p>","avoid":"","usage":["How do I delete a row on the iPad? I can't see the button.","It only appears in the hover state. Show the actions when the device can't hover."],"out":[0,103,104,105,47]},{"name":"Focus ring","section":9,"description":"The visible outline showing which element currently has keyboard focus.","body":"\u003cp>A focus ring is the visible outline showing which element currently has keyboard focus. A stylesheet containing \u003ccode>outline: none\u003c/code> with no replacement is a common failure: pressing Tab appears to do nothing, because focus is moving through the page invisibly.\u003c/p>\u003cp>Three WCAG 2.2 criteria apply.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Criterion\u003c/th>\u003cth>Level\u003c/th>\u003cth>Requirement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>2.4.7 Focus Visible\u003c/td>\u003ctd>AA\u003c/td>\u003ctd>A visible indicator exists in keyboard use\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1.4.11 Non-text Contrast\u003c/td>\u003ctd>AA\u003c/td>\u003ctd>A custom indicator has 3:1 contrast against adjacent colors\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.4.13 Focus Appearance\u003c/td>\u003ctd>AAA\u003c/td>\u003ctd>At least the area of a 2px perimeter, with 3:1 change between the focused and unfocused states\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Use \u003ccode>:focus-visible\u003c/code>, which applies when the browser judges that focus should be shown. It shows the ring for keyboard navigation and for text inputs, and generally omits it on mouse clicks of \u003ca href=\"#Button\" data-term=\"Button\">buttons\u003c/a>.\u003c/p>\u003cpre>\u003ccode>:focus-visible {\n  outline: 2px solid var(--color-focus);\n  outline-offset: 2px;\n}\u003c/code>\u003c/pre>\u003cp>Prefer \u003ccode>outline\u003c/code> over \u003ccode>box-shadow\u003c/code> for the ring. Forced colors mode, an accessibility setting that replaces page colors with a user palette, sets \u003ccode>box-shadow\u003c/code> to \u003ccode>none\u003c/code>, so a shadow-only ring disappears. Outlines stay and take on a system color.\u003c/p>\u003cp>One color rarely works on every surface. A blue ring can vanish on a blue button or a dark panel. Either set the color per \u003ca href=\"#Theming\" data-term=\"Theming\">theme\u003c/a>, or draw a two-tone ring using an outline plus a contrasting inner shadow, so that one of the two always stands out.\u003c/p>\u003cp>Clipping is the other frequent bug. An ancestor with \u003ccode>overflow: hidden\u003c/code> cuts off the outer part of the ring, which shows up on items in scroll containers and on \u003ca href=\"#Card\" data-term=\"Card\">cards\u003c/a>. Use a negative \u003ccode>outline-offset\u003c/code> to draw the ring inside the element. A \u003ca href=\"#Sticky%20header\" data-term=\"Sticky header\">sticky header\u003c/a> can also cover the focused element entirely, which fails WCAG 2.4.11 Focus Not Obscured (Minimum), and \u003ccode>scroll-padding\u003c/code> prevents that.\u003c/p>","avoid":"","usage":["I can't tell where I am when I tab through the settings page.","A CSS reset removed the outline. Add a focus ring with \u003ccode>:focus-visible\u003c/code>."],"out":[0,89,64,66]},{"name":"Active state","section":9,"description":"The brief visual change on a control while it is being pressed, confirming that the input registered.","body":"\u003cp>An active state is the brief visual change on a control while it is being pressed, confirming that the input registered. In CSS it is written with \u003ccode>:active\u003c/code>, which with a mouse typically begins on press and ends on release. A \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> with no pressed feedback can feel unresponsive, and people often click it a second time.\u003c/p>\u003cp>The word &quot;active&quot; is also used loosely for a persistent state.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>How to express it\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Active (pressed)\u003c/td>\u003ctd>Being pressed right now\u003c/td>\u003ctd>\u003ccode>:active\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Toggled on\u003c/td>\u003ctd>A \u003ca href=\"#Toggle%20button\" data-term=\"Toggle button\">toggle button\u003c/a> stays on\u003c/td>\u003ctd>\u003ccode>aria-pressed=&quot;true&quot;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Current page\u003c/td>\u003ctd>Where the user is in navigation\u003c/td>\u003ctd>\u003ccode>aria-current=&quot;page&quot;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Selected\u003c/td>\u003ctd>Chosen item in a set\u003c/td>\u003ctd>\u003ccode>aria-selected=&quot;true&quot;\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A nav link styled with \u003ccode>:active\u003c/code> will not stay highlighted on the current page, because the pseudo-class ends on release. Use \u003ccode>aria-current=&quot;page&quot;\u003c/code> and style from that attribute, which also tells screen readers (software that reads the UI aloud) which link is current.\u003c/p>\u003cpre>\u003ccode>.button:hover { background: var(--accent-hover); }\n.button:active { background: var(--accent-pressed); }\u003c/code>\u003c/pre>\u003cp>A later \u003ccode>:hover\u003c/code> rule with equal specificity overrides \u003ccode>:active\u003c/code>, so the pressed style never shows while the pointer is over the element. For links, declare the rules in the order \u003ccode>:link\u003c/code>, \u003ccode>:visited\u003c/code>, \u003ccode>:hover\u003c/code>, \u003ccode>:active\u003c/code>.\u003c/p>\u003cp>Moving the control on press can lose the click. If \u003ccode>:active\u003c/code> applies \u003ccode>transform: translateY(2px)\u003c/code> and the user presses near the top edge, the button slides from under the pointer. The release then lands on another element, and the browser fires \u003ccode>click\u003c/code> on their common ancestor, so the button's handler does not run. Apply the movement to an inner element, or use a color or a slight shadow change.\u003c/p>\u003cp>Browsers differ on whether \u003ccode>:active\u003c/code> matches during keyboard or touch activation, so do not make it the only feedback for an action. Under \u003ca href=\"#Reduced%20motion\" data-term=\"Reduced motion\">reduced motion\u003c/a>, limit press effects to color changes.\u003c/p>","avoid":"","usage":["The current nav item only highlights while I'm clicking it.","You've used the active state. Set \u003ccode>aria-current=&quot;page&quot;\u003c/code> and style that instead."],"out":[0,2,111]},{"name":"Disabled state","section":9,"description":"A control shown but currently unavailable, with its interaction blocked until a condition changes.","body":"\u003cp>A disabled state shows a control that exists but is currently unavailable, with interaction blocked until a condition changes. A greyed-out Submit \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> is the familiar case, and also the familiar complaint: the user cannot tell why it is grey or what would enable it.\u003c/p>\u003cp>HTML offers \u003ccode>disabled\u003c/code>, and ARIA (attributes for assistive technology) offers \u003ccode>aria-disabled\u003c/code>. They behave differently.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Behaviour\u003c/th>\u003cth>\u003ccode>disabled\u003c/code>\u003c/th>\u003cth>\u003ccode>aria-disabled=&quot;true&quot;\u003c/code>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>In the Tab order\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Blocks activation\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No, your code must block it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Automatic styles\u003c/td>\u003ctd>Yes, via \u003ccode>:disabled\u003c/code>\u003c/td>\u003ctd>No, style the attribute\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Submitted in forms\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes, handle it yourself\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Works on any element\u003c/td>\u003ctd>Form controls only\u003c/td>\u003ctd>Any element with a suitable role\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The WAI-ARIA Authoring Practices advise using \u003ccode>disabled\u003c/code> when users can infer the control from what is around it, such as Previous on the first page of results. Use \u003ccode>aria-disabled\u003c/code> when the control should remain discoverable, such as items in a \u003ca href=\"#Toolbar\" data-term=\"Toolbar\">toolbar\u003c/a> or menu, since people using a screen reader, which reads the UI aloud, find content largely by moving focus.\u003c/p>\u003cpre>\u003ccode>&lt;button aria-disabled=&quot;true&quot; aria-describedby=&quot;why&quot;&gt;Publish&lt;/button&gt;\n&lt;p id=&quot;why&quot;&gt;Add a title before publishing.&lt;/p&gt;\u003c/code>\u003c/pre>\u003cp>With \u003ccode>aria-disabled\u003c/code>, block both click and keyboard activation in script. \u003ccode>pointer-events: none\u003c/code> stops the mouse only.\u003c/p>\u003cp>Often it is better not to disable the control. Leave Submit enabled, and on click show what is missing with \u003ca href=\"#Inline%20validation\" data-term=\"Inline validation\">inline validation\u003c/a> or an \u003ca href=\"#Error%20summary\" data-term=\"Error summary\">error summary\u003c/a>.\u003c/p>\u003cp>Native \u003ccode>disabled\u003c/code> has its own traps. If a focused button becomes disabled during a request, focus can be lost. A \u003ca href=\"#Tooltip\" data-term=\"Tooltip\">tooltip\u003c/a> explaining the reason generally will not work on it either, because the button cannot receive focus and may not fire pointer events. Use \u003ccode>aria-disabled\u003c/code> when an explanation is needed.\u003c/p>\u003cp>WCAG 1.4.3 and 1.4.11 exempt inactive components from contrast requirements, but keep the label readable so users know what the control is.\u003c/p>","avoid":"","usage":["Why can't I click Publish? Nothing tells me.","It's in a disabled state until there's a title. Enable it and show the error on submit."],"out":[0,6,25,26,47]},{"name":"Touch target","section":9,"description":"The area of a control that accepts a tap or click, which can be larger than the visible icon or text.","body":"\u003cp>A touch target is the area of a control that accepts a tap or click, which can be larger than the visible icon or text. When it is too small, or too close to a neighbour, users tap the wrong item or need several attempts. A 16px close icon beside a Delete \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> is the kind of layout that produces these errors, particularly for people with tremors or limited dexterity.\u003c/p>\u003cp>WCAG 2.2 has two criteria for size, and they are often confused. Both apply to all pointer input, including a mouse.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Criterion\u003c/th>\u003cth>Level\u003c/th>\u003cth>Minimum size\u003c/th>\u003cth>Spacing exception\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>2.5.8 Target Size (Minimum)\u003c/td>\u003ctd>AA\u003c/td>\u003ctd>24 by 24 CSS px\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2.5.5 Target Size (Enhanced)\u003c/td>\u003ctd>AAA\u003c/td>\u003ctd>44 by 44 CSS px\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Under 2.5.8, a smaller target can still pass through spacing. Draw a 24px diameter circle centred on the target's bounding box. The target passes if its circle does not intersect another target or the circle of another undersized target.\u003c/p>\u003cp>Other exceptions apply to 2.5.8:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Exception\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Equivalent\u003c/td>\u003ctd>Another compliant control on the page does the same job\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Inline\u003c/td>\u003ctd>A link inside a sentence\u003c/td>\u003c/tr>\u003ctr>\u003ctd>User agent control\u003c/td>\u003ctd>An unstyled native control\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Essential\u003c/td>\u003ctd>Pins on a map where position carries meaning\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Criterion 2.5.5 has similar exceptions for equivalent, inline, user agent and essential targets, but no spacing exception.\u003c/p>\u003cp>The visible element can stay small while the target grows. Add padding, or extend the hit area with a pseudo-element:\u003c/p>\u003cpre>\u003ccode>.icon-button { position: relative; width: 1rem; height: 1rem; }\n.icon-button::after {\n  content: &quot;&quot;;\n  position: absolute;\n  inset: -0.25rem;\n}\u003c/code>\u003c/pre>\u003cp>Here a 16px icon gets a 24px target at the default font size. Check that expanded hit areas do not overlap, because the element painted on top then takes the tap. Dense \u003ca href=\"#Toolbar\" data-term=\"Toolbar\">toolbars\u003c/a>, \u003ca href=\"#Data%20table\" data-term=\"Data table\">data table\u003c/a> row actions, \u003ca href=\"#Chip\" data-term=\"Chip\">chip\u003c/a> remove buttons and \u003ca href=\"#Icon%20button\" data-term=\"Icon button\">icon buttons\u003c/a> often fall short.\u003c/p>","avoid":"","usage":["People keep hitting Delete when they mean to hit Edit on mobile.","Those icons are 16px and touching. Give each a bigger touch target and some space between them."],"out":[0,6,65,73,1]},{"name":"Roving tabindex","section":9,"description":"A focus technique where one item in a group is tabbable and arrow keys move focus among the rest.","body":"\u003cp>Roving tabindex is a focus technique where only one item in a group is in the Tab order, and arrow keys move focus among the rest. It makes a composite widget, one control made of many focusable parts, behave as a single Tab stop. Without it, a \u003ca href=\"#Toolbar\" data-term=\"Toolbar\">toolbar\u003c/a> with 20 \u003ca href=\"#Button\" data-term=\"Button\">buttons\u003c/a> takes 20 presses of Tab to get past.\u003c/p>\u003cp>The WAI-ARIA Authoring Practices describe the steps.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>When\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Widget loads\u003c/td>\u003ctd>One item gets \u003ccode>tabindex=&quot;0&quot;\u003c/code>, the others \u003ccode>tabindex=&quot;-1&quot;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Arrow key pressed\u003c/td>\u003ctd>Current item is set to \u003ccode>-1\u003c/code>, next item is set to \u003ccode>0\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Same key handler\u003c/td>\u003ctd>Call \u003ccode>.focus()\u003c/code> on the new item\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>User tabs away and back\u003c/td>\u003ctd>Focus returns to the item holding \u003ccode>tabindex=&quot;0&quot;\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cpre>\u003ccode>&lt;div role=&quot;toolbar&quot; aria-label=&quot;Formatting&quot;&gt;\n  &lt;button tabindex=&quot;0&quot;&gt;Bold&lt;/button&gt;\n  &lt;button tabindex=&quot;-1&quot;&gt;Italic&lt;/button&gt;\n  &lt;button tabindex=&quot;-1&quot;&gt;Underline&lt;/button&gt;\n&lt;/div&gt;\u003c/code>\u003c/pre>\u003cp>The usual alternative is \u003ccode>aria-activedescendant\u003c/code>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technique\u003c/th>\u003cth>Real DOM focus\u003c/th>\u003cth>Scrolling\u003c/th>\u003cth>Typical use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Roving tabindex\u003c/td>\u003ctd>Moves to the item\u003c/td>\u003ctd>Browser handles it\u003c/td>\u003ctd>Toolbars, tabs, \u003ca href=\"#Tree%20view\" data-term=\"Tree view\">tree views\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>aria-activedescendant\u003c/code>\u003c/td>\u003ctd>Stays on container\u003c/td>\u003ctd>You handle it\u003c/td>\u003ctd>\u003ca href=\"#Combobox\" data-term=\"Combobox\">Combobox\u003c/a> with typing focus in the input\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Use \u003ccode>aria-activedescendant\u003c/code> when focus must stay in a text input while the user moves through suggestions.\u003c/p>\u003cp>A common bug is losing the Tab stop. If the item holding \u003ccode>tabindex=&quot;0&quot;\u003c/code> is removed or disabled, no item in the group is tabbable, and the widget can no longer be reached by keyboard. Whenever items change, confirm that exactly one remains at \u003ccode>0\u003c/code>. If the focused item was removed, move focus to a neighbour.\u003c/p>\u003cp>Decide whether arrows wrap at the ends, and support Home and End where the pattern calls for them. Do not trap Tab inside the group, because Tab should always leave the widget. Keep the visible \u003ca href=\"#Focus%20ring\" data-term=\"Focus ring\">focus ring\u003c/a> on the current item.\u003c/p>","avoid":"","usage":["It takes 14 tabs to get past the editor's formatting bar.","It needs roving tabindex, so the bar is one Tab stop and arrows move inside it."],"out":[6,0,40,13,103]},{"name":"Drag and drop","section":9,"description":"Moving an item by pressing it, carrying it with a pointer and releasing it over a target.","body":"\u003cp>Drag and drop is moving an item by pressing it, carrying it with a pointer and releasing it over a target. It is used to reorder lists, move \u003ca href=\"#Kanban%20board\" data-term=\"Kanban board\">kanban board\u003c/a> \u003ca href=\"#Card\" data-term=\"Card\">cards\u003c/a> and add files to a \u003ca href=\"#File%20upload\" data-term=\"File upload\">file upload\u003c/a>. It should not be the only way to do something, because it is difficult or impossible for many people.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phase\u003c/th>\u003cth>User action\u003c/th>\u003cth>Interface response\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pick up\u003c/td>\u003ctd>Presses and moves\u003c/td>\u003ctd>Item lifts, valid targets are indicated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Move\u003c/td>\u003ctd>Carries the item\u003c/td>\u003ctd>Insertion point shown, edges auto-scroll\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Drop\u003c/td>\u003ctd>Releases\u003c/td>\u003ctd>Item lands, result saved\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cancel\u003c/td>\u003ctd>Presses Escape\u003c/td>\u003ctd>Item returns to its origin\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>WCAG treats input methods separately. Under 2.5.7 Dragging Movements (AA), anything done by dragging must also be achievable with a single pointer without dragging, unless dragging is essential. A keyboard alternative alone does not meet this, because it has to work with clicks or taps. Under 2.1.1 Keyboard (A), the function also has to work from a keyboard. A &quot;Move to&quot; menu or Up and Down buttons cover both. Announce each result through a \u003ccode>role=&quot;status&quot;\u003c/code> region.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>API\u003c/th>\u003cth>Good at\u003c/th>\u003cth>Limitation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>HTML Drag and Drop\u003c/td>\u003ctd>Files, dragging between windows\u003c/td>\u003ctd>Limited styling, uneven touch support\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pointer Events\u003c/td>\u003ctd>Custom reordering, touch and mouse\u003c/td>\u003ctd>You build the behaviour\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>With the HTML API, a drop target that never fires \u003ccode>drop\u003c/code> is a common bug. An element only becomes a valid target if its \u003ccode>dragover\u003c/code> event is cancelled.\u003c/p>\u003cpre>\u003ccode>zone.addEventListener(&quot;dragover&quot;, (event) =&gt; event.preventDefault());\u003c/code>\u003c/pre>\u003cp>With Pointer Events, touch drags can be cancelled when the browser decides to scroll instead, which fires \u003ccode>pointercancel\u003c/code>. Set \u003ccode>touch-action: none\u003c/code> on a dedicated drag handle, not the whole item, so that users can still scroll and pinch zoom the page.\u003c/p>\u003cp>Save the result \u003ca href=\"#Optimistic%20UI\" data-term=\"Optimistic UI\">optimistically\u003c/a> and return the item to its origin if the request fails.\u003c/p>","avoid":"","usage":["Reordering works with a mouse but the list just scrolls on my phone.","The drag and drop handle needs \u003ccode>touch-action: none\u003c/code>, or the browser takes over the gesture."],"out":[75,64,19,63]},{"name":"Micro-interaction","section":9,"description":"A small, contained response to a single user action, such as a switch sliding or a heart filling in.","body":"\u003cp>A micro-interaction is a small, contained response to a single user action, such as a \u003ca href=\"#Switch\" data-term=\"Switch\">switch\u003c/a> sliding across, a heart filling in or a field shaking on invalid input. Its job is to confirm that something happened and show what changed. When it is missing, people click twice because they are unsure the first click worked. When it is overdone, a small animation that was pleasant once becomes a delay they sit through a hundred times a day.\u003c/p>\u003cp>A common way to break one down uses four parts.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Question it answers\u003c/th>\u003cth>Example: &quot;Copy link&quot; \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Trigger\u003c/td>\u003ctd>What starts it?\u003c/td>\u003ctd>User clicks Copy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rules\u003c/td>\u003ctd>What happens?\u003c/td>\u003ctd>URL is written to the clipboard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Feedback\u003c/td>\u003ctd>How does the user know?\u003c/td>\u003ctd>Label changes to &quot;Copied&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loops and modes\u003c/td>\u003ctd>What happens later or on repeat?\u003c/td>\u003ctd>Label resets after two seconds\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The animation must never hold up the action. A menu that accepts no input until its 400ms opening transition ends makes the whole product feel slow. Apply the state change at once, and let the visual catch up. Keep durations short, commonly somewhere around 100 to 300 milliseconds, with an \u003ca href=\"#Easing\" data-term=\"Easing\">easing\u003c/a> curve suited to the motion. Animating \u003ccode>transform\u003c/code> and \u003ccode>opacity\u003c/code> is usually smoother than animating \u003ccode>width\u003c/code> or \u003ccode>top\u003c/code>, which force the browser to recalculate layout.\u003c/p>\u003cpre>\u003ccode>.switch-thumb { transition: transform 150ms ease-out; }\n[aria-checked=&quot;true&quot;] .switch-thumb { transform: translateX(1.25rem); }\n\n@media (prefers-reduced-motion: reduce) {\n  .switch-thumb { transition: none; }\n}\u003c/code>\u003c/pre>\u003cp>Feedback seen only as motion does not reach everyone. A &quot;Copied&quot; message should also be written to a \u003ccode>role=&quot;status&quot;\u003c/code> region so that screen readers, which read the UI aloud, announce it.\u003c/p>\u003cp>Respect \u003ca href=\"#Reduced%20motion\" data-term=\"Reduced motion\">reduced motion\u003c/a> by replacing movement with an instant change or a fade. Shaking and bouncing are the effects most worth removing, since large or repeated movement can cause discomfort for people with vestibular conditions.\u003c/p>","avoid":"","usage":["Users keep double-clicking Copy because nothing seems to happen.","Add a micro-interaction that swaps the label to Copied, and announce it through a status region."],"out":[11,0,110,111]},{"name":"Easing","section":9,"description":"The curve that controls how an animation's speed changes between its start and end.","body":"\u003cp>Easing is the curve that controls how an animation's speed changes between its start and end. The same 200ms movement can feel abrupt, mechanical or smooth depending on the curve.\u003c/p>\u003cp>CSS provides keywords, each equivalent to a specific function.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Keyword\u003c/th>\u003cth>Equivalent\u003c/th>\u003cth>Common use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>linear\u003c/code>\u003c/td>\u003ctd>\u003ccode>cubic-bezier(0, 0, 1, 1)\u003c/code>\u003c/td>\u003ctd>\u003ca href=\"#Spinner\" data-term=\"Spinner\">Spinners\u003c/a>, \u003ca href=\"#Progress%20bar\" data-term=\"Progress bar\">progress bars\u003c/a>, opacity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ease\u003c/code>\u003c/td>\u003ctd>\u003ccode>cubic-bezier(0.25, 0.1, 0.25, 1)\u003c/code>\u003c/td>\u003ctd>The CSS default\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ease-in\u003c/code>\u003c/td>\u003ctd>\u003ccode>cubic-bezier(0.42, 0, 1, 1)\u003c/code>\u003c/td>\u003ctd>Elements leaving the screen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ease-out\u003c/code>\u003c/td>\u003ctd>\u003ccode>cubic-bezier(0, 0, 0.58, 1)\u003c/code>\u003c/td>\u003ctd>Elements entering the screen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ease-in-out\u003c/code>\u003c/td>\u003ctd>\u003ccode>cubic-bezier(0.42, 0, 0.58, 1)\u003c/code>\u003c/td>\u003ctd>Elements moving across screen\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The usual convention is to use \u003ccode>ease-out\u003c/code> for things that appear, because they respond right away and then settle. Use \u003ccode>ease-in\u003c/code> for things that leave. Using \u003ccode>ease-in\u003c/code> on an entrance is a common mistake: the slow start reads as lag right after the user clicks.\u003c/p>\u003cp>Beyond the keywords, three functions give finer control. \u003ccode>cubic-bezier()\u003c/code> defines a custom curve. Its x values must stay between 0 and 1, while its y values may go outside that range to create overshoot. \u003ccode>linear()\u003c/code> draws a curve through points, and \u003ccode>steps()\u003c/code> jumps in discrete stages.\u003c/p>\u003cpre>\u003ccode>.popover {\n  transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1);\n}\u003c/code>\u003c/pre>\u003cp>The y value of 1.56 makes the element pass its target and settle back.\u003c/p>\u003cp>In a \u003ccode>@keyframes\u003c/code> animation, the timing function applies between each pair of keyframes, not across the whole animation. A three-keyframe animation with \u003ccode>ease-in-out\u003c/code> slows to a stop at the middle keyframe, which appears as a stutter. Remove the middle keyframe, or set a timing function per keyframe.\u003c/p>\u003cp>Easing does not make motion safe. A gently curved animation can still cause discomfort, so honour \u003ca href=\"#Reduced%20motion\" data-term=\"Reduced motion\">reduced motion\u003c/a> separately. Define a few named curves as CSS variables so that \u003ca href=\"#Micro-interaction\" data-term=\"Micro-interaction\">micro-interactions\u003c/a> across the product feel related.\u003c/p>","avoid":"","usage":["The dropdown feels laggy even though it's only 150ms.","It's using \u003ccode>ease-in\u003c/code>, so it starts slowly. Change the easing to \u003ccode>ease-out\u003c/code>."],"out":[58,57,111,109]},{"name":"Reduced motion","section":9,"description":"Honouring a user's system setting that asks for less non-essential animation.","body":"\u003cp>Reduced motion means honouring a user's system setting that asks for less non-essential animation. Large movement such as parallax, zooming and sliding panels can cause dizziness or nausea for people with vestibular disorders, so an animation that looks harmless to its author can make a page unusable for someone else. Browsers expose the setting through the \u003ccode>prefers-reduced-motion\u003c/code> media feature, with the values \u003ccode>no-preference\u003c/code> and \u003ccode>reduce\u003c/code>.\u003c/p>\u003cp>The setting does not require removing all animation. Replace large motion with a gentler effect, and keep feedback that carries information.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Original effect\u003c/th>\u003cth>Under reduced motion\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Page or panel slide\u003c/td>\u003ctd>Crossfade or instant change\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Zoom into a \u003ca href=\"#Lightbox\" data-term=\"Lightbox\">lightbox\u003c/a>\u003c/td>\u003ctd>Fade in\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Parallax\u003c/td>\u003ctd>Static background\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Auto-rotating \u003ca href=\"#Carousel\" data-term=\"Carousel\">carousel\u003c/a>\u003c/td>\u003ctd>No auto-rotation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Smooth scroll to anchor\u003c/td>\u003ctd>Instant jump\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Spinner\" data-term=\"Spinner\">Spinner\u003c/a> rotation\u003c/td>\u003ctd>Slow opacity pulse\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cpre>\u003ccode>.panel { transition: transform 300ms ease-out; }\n\n@media (prefers-reduced-motion: reduce) {\n  .panel { transition: opacity 150ms linear; }\n}\u003c/code>\u003c/pre>\u003cp>WCAG 2.3.3 Animation from Interactions (AAA) requires that motion triggered by interaction can be disabled unless it is essential. Color or opacity changes that do not alter perceived size, shape or position are outside its definition of motion. WCAG 2.2.2 Pause, Stop, Hide (A) separately covers content that moves automatically for more than five seconds alongside other content. For 2.2.2, provide a visible pause control as well as the media query.\u003c/p>\u003cp>A blanket reset is a common shortcut, and it can break an interface.\u003c/p>\u003cpre>\u003ccode>* { animation: none !important; transition: none !important; }\u003c/code>\u003c/pre>\u003cp>With no transition, the \u003ccode>transitionend\u003c/code> event never fires. Code that waits for it to remove a closed \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a> or unlock a form then hangs, and the UI gets stuck for exactly the users who turned on this setting. Prefer targeted rules, and do not depend on animation events for state changes without a fallback.\u003c/p>\u003cp>JavaScript-driven animation ignores CSS media queries, so check \u003ccode>matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;)\u003c/code> and listen for changes.\u003c/p>","avoid":"","usage":["With reduced motion on, the settings modal never closes.","Our reset removes the transition, so \u003ccode>transitionend\u003c/code> never fires. Close it without waiting for the event."],"out":[76,71,58,42]}]}
    </script>
    <script>
      (() => {
        const data = JSON.parse(
          document.getElementById("graph-data").textContent
        );
        const $ = (id) => document.getElementById(id);
        const stage = $("stage");
        const panel = $("panel");
        const panelBody = $("panel-body");
        const resizer = $("resizer");
        const search = $("search");
        const input = $("search-input");
        const results = $("results");
        const info = $("info");
        const infoBtn = $("info-btn");
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

        const INK = "#1c1c1a";
        const BG = "#ededE9";
        // Hubs keep their label even when it crosses another circle.
        const HUB_WEIGHT = 0.7;
        const esc = (s) =>
          s.replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
          );
        const hashFor = (name) => "#" + encodeURIComponent(name);

        const nodes = data.terms.map((term, i) => ({
          ...term,
          id: i,
          incoming: [],
        }));
        const links = [];
        const linkKeys = new Set();
        nodes.forEach((n) =>
          n.out.forEach((t) => {
            nodes[t].incoming.push(n.id);
            links.push({ source: n.id, target: t, from: n.id, to: t });
            linkKeys.add(n.id + ">" + t);
          })
        );
        // A two-way pair is drawn as one line; both directions keep their particles.
        links.forEach((l) => {
          l.hiddenTwin = l.from > l.to && linkKeys.has(l.to + ">" + l.from);
        });

        const maxIncoming = Math.max(...nodes.map((n) => n.incoming.length), 1);
        const sectionCount = data.sections.length;
        const stageBox = stage.getBoundingClientRect();
        const landscape = stageBox.width >= stageBox.height;
        const anchorRadiusX = landscape ? 360 : 170;
        const anchorRadiusY = landscape ? 190 : 320;
        nodes.forEach((n, i) => {
          const weight = Math.sqrt(n.incoming.length / maxIncoming);
          const shade = Math.round(214 - weight * 158);
          n.weight = weight;
          n.r = 4 + Math.sqrt(n.incoming.length) * 2.9;
          n.fill = `rgb(${shade},${shade},${shade - 3})`;
          n.neighbors = new Set([n.id, ...n.out, ...n.incoming]);
          const angle = (n.section / sectionCount) * Math.PI * 2;
          n.anchorX = sectionCount > 1 ? Math.cos(angle) * anchorRadiusX : 0;
          n.anchorY = sectionCount > 1 ? Math.sin(angle) * anchorRadiusY : 0;
          n.x = n.anchorX + Math.cos(i * 2.4) * (30 + i);
          n.y = n.anchorY + Math.sin(i * 2.4) * (30 + i);
        });
        const byName = new Map(nodes.map((n) => [n.name, n]));

        let selected = null;
        let hovered = null;
        let userMoved = false;
        let pauseTimer = 0;
        let particleFocus = null;
        // The selected term keeps the highlight; hovering only adds to it.
        const focusNode = () => selected || hovered;
        const isVisible = (n, f) =>
          !f || f.neighbors.has(n.id) || n === hovered;
        const endpoint = (v) => (typeof v === "object" ? v.id : v);
        const isFocusLink = (l) => {
          const f = focusNode();
          return (
            !!f && (endpoint(l.source) === f.id || endpoint(l.target) === f.id)
          );
        };

        function collideForce() {
          let all = [];
          const force = () => {
            for (let i = 0; i < all.length; i++) {
              for (let j = i + 1; j < all.length; j++) {
                const a = all[i],
                  b = all[j];
                const dx = b.x - a.x || 0.01,
                  dy = b.y - a.y || 0.01;
                const d = Math.hypot(dx, dy);
                const min = a.r + b.r + 9;
                if (d >= min) continue;
                const push = ((min - d) / d) * 0.5;
                b.x += dx * push;
                b.y += dy * push;
                a.x -= dx * push;
                a.y -= dy * push;
              }
            }
          };
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function sectionForce() {
          let all = [];
          const force = (alpha) =>
            all.forEach((n) => {
              n.vx += (n.anchorX - n.x) * 0.035 * alpha;
              n.vy += (n.anchorY - n.y) * 0.035 * alpha;
            });
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function drawNode(n, ctx, k) {
          const near = isVisible(n, focusNode());
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          if (!near) {
            // An opaque base stops lines showing through dimmed circles.
            ctx.fillStyle = BG;
            ctx.fill();
          }
          ctx.globalAlpha = near ? 1 : 0.15;
          ctx.fillStyle = n.fill;
          ctx.fill();
          ctx.globalAlpha = 1;
          if (n === selected) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 3.2 / Math.max(k, 0.6), 0, Math.PI * 2);
            ctx.strokeStyle = INK;
            ctx.lineWidth = 1.4 / k;
            ctx.stroke();
          }
        }

        function drawLabels(ctx, k) {
          const f = focusNode();
          const rank = (n) =>
            (n === hovered
              ? 4
              : n === f
                ? 3
                : f && f.neighbors.has(n.id)
                  ? 2
                  : 0) + n.weight;
          const placed = [];
          const order = nodes
            .filter((n) => isVisible(n, f))
            .sort((a, b) => rank(b) - rank(a));
          const hitsCircle = (box, self) =>
            order.some((m) => {
              if (m === self) return false;
              const cx = Math.max(box.l, Math.min(m.x, box.r));
              const cy = Math.max(box.t, Math.min(m.y, box.b));
              return Math.hypot(m.x - cx, m.y - cy) < m.r;
            });
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.lineJoin = "round";
          for (const n of order) {
            const pinned = n === f || n === hovered;
            const px = n === f ? 15 : n === hovered ? 13 : 8.5 + n.weight * 5.5;
            const size = px / k;
            ctx.font = `${size}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
            if ("letterSpacing" in ctx) ctx.letterSpacing = `${size * 0.06}px`;
            const text = n.name.toUpperCase();
            const w = ctx.measureText(text).width;
            const y = n.y - n.r - 5 / k;
            const box = {
              l: n.x - w / 2 - 3 / k,
              r: n.x + w / 2 + 3 / k,
              t: y - size - 1 / k,
              b: y + 1 / k,
            };
            if (
              !pinned &&
              ((n.weight < HUB_WEIGHT && hitsCircle(box, n)) ||
                placed.some(
                  (p) =>
                    box.l < p.r && box.r > p.l && box.t < p.b && box.b > p.t
                ))
            )
              continue;
            placed.push(box);
            ctx.globalAlpha = 0.9;
            ctx.strokeStyle = BG;
            ctx.lineWidth = 3.5 / k;
            ctx.strokeText(text, n.x, y);
            ctx.globalAlpha = pinned ? 1 : f ? 0.82 : 0.38 + n.weight * 0.55;
            ctx.fillStyle = INK;
            ctx.fillText(text, n.x, y);
          }
          ctx.globalAlpha = 1;
          if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
        }

        const graph = new ForceGraph($("graph"))
          .backgroundColor("rgba(0,0,0,0)")
          .nodeId("id")
          .nodeLabel(() => "")
          .nodeCanvasObject(drawNode)
          .nodePointerAreaPaint((n, color, ctx) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 2, 0, Math.PI * 2);
            ctx.fill();
          })
          .linkColor((l) => {
            if (l.hiddenTwin) return "rgba(0,0,0,0)";
            if (!focusNode()) return "rgba(28,28,26,.09)";
            return isFocusLink(l) ? "rgba(28,28,26,.5)" : "rgba(28,28,26,.025)";
          })
          .linkWidth((l) => (isFocusLink(l) ? 0.9 : 0.5))
          .linkDirectionalParticles((l) =>
            !reducedMotion.matches && isFocusLink(l) ? 2 : 0
          )
          .linkDirectionalParticleWidth(2.2)
          .linkDirectionalParticleSpeed(0.005)
          .linkDirectionalParticleColor(() => INK)
          .minZoom(0.25)
          .maxZoom(6)
          .warmupTicks(280)
          .cooldownTicks(70)
          .onRenderFramePost(drawLabels)
          .onNodeClick((n) => go(n.name))
          .onBackgroundClick(() => go(null))
          .onNodeHover((n) => {
            hovered = n || null;
            wake();
          })
          .onNodeDragEnd((n) => {
            n.fx = undefined;
            n.fy = undefined;
          })
          .onZoom((t) => {
            if (t && programmaticUntil < performance.now()) userMoved = true;
          });

        graph.d3Force("charge").strength(-340).distanceMax(760);
        graph
          .d3Force("link")
          .distance((l) => 46 + l.source.r + l.target.r)
          .strength(
            (l) =>
              0.55 / Math.min(l.source.neighbors.size, l.target.neighbors.size)
          );
        graph.d3Force("collide", collideForce());
        graph.d3Force("section", sectionForce());
        graph.graphData({ nodes, links });

        let programmaticUntil = 0;
        const camera = (ms) => {
          programmaticUntil = performance.now() + ms + 80;
        };

        function fitAll(ms = 0) {
          camera(ms);
          graph.zoomToFit(ms, 54);
        }

        function focusCamera(ms = 650) {
          if (!selected) return;
          const box = stage.getBoundingClientRect();
          let reach = selected.r;
          selected.neighbors.forEach((id) => {
            const m = nodes[id];
            reach = Math.max(
              reach,
              Math.hypot(m.x - selected.x, m.y - selected.y) + m.r
            );
          });
          const k = Math.min(
            2.2,
            Math.max(0.5, (Math.min(box.width, box.height) / 2 - 40) / reach)
          );
          camera(ms);
          graph.centerAt(selected.x, selected.y, ms);
          graph.zoom(k, ms);
        }

        function wake() {
          const f = focusNode();
          if (f !== particleFocus) {
            particleFocus = f;
            // force-graph only rebuilds particles when this prop is set.
            graph.linkDirectionalParticles((l) =>
              !reducedMotion.matches && isFocusLink(l) ? 2 : 0
            );
          }
          graph.autoPauseRedraw(false);
          clearTimeout(pauseTimer);
          if (!focusNode() || reducedMotion.matches) {
            pauseTimer = setTimeout(() => graph.autoPauseRedraw(true), 160);
          }
        }

        function renderPanel(n) {
          const chip = (id) =>
            `<a class="chip" href="${hashFor(nodes[id].name)}" data-term="${esc(nodes[id].name)}">${esc(nodes[id].name)}</a>`;
          const linkedFrom = n.incoming.filter((id) => !n.out.includes(id));
          panelBody.innerHTML = `
            <div class="eyebrow">${esc(data.sections[n.section])}</div>
            <h1 tabindex="-1">${esc(n.name)}</h1>
            ${n.description ? `<p class="lede">${esc(n.description)}</p>` : ""}
            ${n.usage.length ? `<section class="block"><span class="label">${esc(data.labels.quotes)}</span>
              <div class="bubbles">${n.usage.map((u) => `<div class="bubble">${u}</div>`).join("")}</div>
            </section>` : ""}
            ${n.avoid ? `<section class="block"><span class="label">${esc(data.labels.note)}</span><p class="avoid">${n.avoid}</p></section>` : ""}
            ${n.out.length ? `<section class="block"><span class="label">${esc(data.labels.outgoing)}</span><div class="chips">${n.out.map(chip).join("")}</div></section>` : ""}
            ${linkedFrom.length ? `<section class="block"><span class="label">${esc(data.labels.incoming)}</span><div class="chips">${linkedFrom.map(chip).join("")}</div></section>` : ""}
            ${n.body ? `<section class="block"><details><summary><span class="label">${esc(data.labels.body)}</span></summary><div class="entry">${n.body}</div></details></section>` : ""}`;
          panel.scrollTop = 0;
        }

        function applyHash({ moveFocus = false } = {}) {
          let name = "";
          try {
            name = decodeURIComponent(location.hash.slice(1));
          } catch {
            name = "";
          }
          selected = byName.get(name) || null;
          hovered = null;
          $("hint").hidden = !!selected;
          document.body.classList.toggle("has-selection", !!selected);
          document.title = selected
            ? `${selected.name} — ${data.title}`
            : `${data.title} — Graph`;
          if (selected) {
            renderPanel(selected);
            panel.hidden = false;
            if (moveFocus)
              panelBody.querySelector("h1").focus({ preventScroll: true });
          } else {
            panel.hidden = true;
          }
          resizer.hidden = !selected;
          syncResizer();
          resize();
          if (selected) focusCamera();
          else if (graphReady) {
            userMoved = false;
            fitAll(600);
          }
          wake();
        }

        function go(name) {
          closePopovers();
          const next = name ? hashFor(name) : "";
          if (location.hash === next) {
            if (name) focusCamera();
            return;
          }
          location.hash = next;
        }

        function resize() {
          const box = stage.getBoundingClientRect();
          graph.width(Math.round(box.width)).height(Math.round(box.height));
        }

        const PANEL_MIN = 300;
        const STAGE_MIN = 320;
        const PANEL_WIDTH_KEY = `graph-explorer:${data.title}:panel-width`;
        let preferredWidth = readPanelWidth();
        let resizing = false;
        let grabOffset = 0;

        function readPanelWidth() {
          try {
            const value = Number(localStorage.getItem(PANEL_WIDTH_KEY));
            return Number.isFinite(value) && value > 0 ? value : null;
          } catch {
            return null;
          }
        }

        function savePanelWidth() {
          try {
            if (preferredWidth === null)
              localStorage.removeItem(PANEL_WIDTH_KEY);
            else localStorage.setItem(PANEL_WIDTH_KEY, String(preferredWidth));
          } catch {
            // Storage can be unavailable; the width still applies this visit.
          }
        }

        const maxPanelWidth = () => Math.max(PANEL_MIN, innerWidth - STAGE_MIN);
        const clampPanelWidth = (width) =>
          Math.round(Math.min(maxPanelWidth(), Math.max(PANEL_MIN, width)));

        function syncResizer() {
          resizer.setAttribute("aria-valuemin", String(PANEL_MIN));
          resizer.setAttribute("aria-valuemax", String(maxPanelWidth()));
          if (!panel.hidden) {
            resizer.setAttribute(
              "aria-valuenow",
              String(Math.round(panel.getBoundingClientRect().width))
            );
          }
        }

        // The saved width is kept as-is so it returns when the window grows.
        function applyPanelWidth() {
          const root = document.documentElement;
          if (preferredWidth === null)
            root.style.removeProperty("--panel-width");
          else
            root.style.setProperty(
              "--panel-width",
              `${clampPanelWidth(preferredWidth)}px`
            );
          syncResizer();
        }

        function setPanelWidth(width) {
          preferredWidth = clampPanelWidth(width);
          applyPanelWidth();
        }

        function endResize() {
          if (!resizing) return;
          resizing = false;
          document.body.classList.remove("resizing");
          savePanelWidth();
          focusCamera(200);
        }

        resizer.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          resizer.setPointerCapture(e.pointerId);
          grabOffset = e.clientX - panel.getBoundingClientRect().left;
          resizing = true;
          document.body.classList.add("resizing");
        });
        resizer.addEventListener("pointermove", (e) => {
          if (!resizing) return;
          const right = $("app").getBoundingClientRect().right;
          setPanelWidth(right - (e.clientX - grabOffset));
        });
        resizer.addEventListener("pointerup", endResize);
        resizer.addEventListener("pointercancel", endResize);
        resizer.addEventListener("lostpointercapture", endResize);
        resizer.addEventListener("dblclick", () => {
          preferredWidth = null;
          applyPanelWidth();
          savePanelWidth();
        });
        resizer.addEventListener("keydown", (e) => {
          const step = e.shiftKey ? 64 : 24;
          const current = panel.getBoundingClientRect().width;
          const next = {
            ArrowLeft: current + step,
            ArrowRight: current - step,
            Home: PANEL_MIN,
            End: maxPanelWidth(),
          }[e.key];
          if (next === undefined) return;
          e.preventDefault();
          setPanelWidth(next);
          savePanelWidth();
        });
        window.addEventListener("resize", applyPanelWidth);
        applyPanelWidth();

        new ResizeObserver(() => {
          resize();
          if (selected) focusCamera(resizing ? 0 : 250);
          else if (graphReady && !userMoved) fitAll(0);
          wake();
        }).observe(stage);

        function closePopovers() {
          search.hidden = true;
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
        }

        let matches = [];
        let active = 0;

        function renderResults() {
          const q = input.value.trim().toLowerCase();
          const score = (n) => {
            const name = n.name.toLowerCase();
            if (!q) return 3;
            if (name === q) return 0;
            if (name.startsWith(q)) return 1;
            if (name.includes(q)) return 2;
            return n.description.toLowerCase().includes(q) ? 3 : 9;
          };
          matches = nodes
            .filter((n) => score(n) < 9)
            .sort(
              (a, b) => score(a) - score(b) || a.name.localeCompare(b.name)
            );
          active = Math.min(active, Math.max(matches.length - 1, 0));
          results.innerHTML = matches.length
            ? matches
                .map(
                  (n, i) =>
                    `<li id="result-${i}" role="option" aria-selected="${i === active}" data-name="${esc(n.name)}">${esc(n.name)}<small>${esc(n.description)}</small></li>`
                )
                .join("")
            : `<li class="none">No matching ${esc(data.nouns)}</li>`;
          if (matches.length) {
            input.setAttribute("aria-activedescendant", `result-${active}`);
            $(`result-${active}`).scrollIntoView({ block: "nearest" });
          } else input.removeAttribute("aria-activedescendant");
        }

        function openSearch() {
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
          search.hidden = false;
          input.value = "";
          active = 0;
          renderResults();
          input.focus();
        }

        function pick(name) {
          go(name);
          requestAnimationFrame(() => {
            const heading = panelBody.querySelector("h1");
            if (heading) heading.focus({ preventScroll: true });
          });
        }

        input.addEventListener("input", () => {
          active = 0;
          renderResults();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (!matches.length) return;
            active =
              (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) %
              matches.length;
            renderResults();
          } else if (e.key === "Enter" && matches[active]) {
            e.preventDefault();
            pick(matches[active].name);
          }
        });
        results.addEventListener("mousedown", (e) => e.preventDefault());
        results.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-name]");
          if (li) pick(li.dataset.name);
        });

        $("search-btn").addEventListener("click", () =>
          search.hidden ? openSearch() : closePopovers()
        );
        infoBtn.addEventListener("click", () => {
          const open = info.hidden;
          closePopovers();
          info.hidden = !open;
          infoBtn.setAttribute("aria-expanded", String(open));
        });
        $("close").addEventListener("click", () => go(null));
        $("info-counts").textContent =
          `${nodes.length} ${nodes.length === 1 ? data.noun : data.nouns}, ${links.length} ${links.length === 1 ? "link" : "links"}, ${data.sections.length} ${data.sections.length === 1 ? "group" : "groups"}.`;

        panel.addEventListener("mouseover", (e) => {
          const a = e.target.closest("[data-term]");
          const next = a ? byName.get(a.dataset.term) || null : null;
          if (next !== hovered) {
            hovered = next;
            wake();
          }
        });
        panel.addEventListener("mouseleave", () => {
          hovered = null;
          wake();
        });

        document.addEventListener("keydown", (e) => {
          const typing = /^(INPUT|TEXTAREA)$/.test(
            document.activeElement?.tagName || ""
          );
          if (
            (e.key === "/" && !typing) ||
            (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))
          ) {
            e.preventDefault();
            openSearch();
          } else if (e.key === "Escape") {
            if (!search.hidden || !info.hidden) {
              const fromSearch = !search.hidden;
              closePopovers();
              if (fromSearch) $("search-btn").focus();
            } else if (selected) go(null);
          }
        });

        window.addEventListener("hashchange", () =>
          applyHash({ moveFocus: true })
        );

        let graphReady = false;
        resize();
        setTimeout(() => {
          graphReady = true;
          if (location.hash.length > 1) applyHash();
          else fitAll(0);
        }, 60);
      })();
    </script>
  </body>
</html>
