t;\u003c/code> with \u003ccode>showModal()\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Non-modal\u003c/td>\u003ctd>Usable\u003c/td>\u003ctd>Details alongside a map or list\u003c/td>\u003ctd>Labelled region, or \u003ccode>show()\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A modal sheet is a dialog with different positioning. Using \u003ccode>&lt;dialog&gt;\u003c/code> provides focus handling, an inert background and Escape, and you still add the dragging.\u003c/p>\u003cpre>\u003ccode>dialog.sheet {\n  margin: auto 0 0;\n  width: 100%;\n  max-width: none;\n  max-height: 90dvh;\n  padding-bottom: env(safe-area-inset-bottom);\n  overscroll-behavior: contain;\n}\u003c/code>\u003c/pre>\u003cp>Dragging must not be the only way to operate it. WCAG 2.5.7 requires a single-pointer alternative, so provide a visible close \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>, and make the handle a real button that cycles between heights. This also gives keyboard and screen reader users a way to resize it.\u003c/p>\u003cp>Scrolling and dragging can conflict. A person scrolls the sheet's list to the top, keeps swiping, and the sheet closes or the page behind starts moving. Start a drag-to-close only when the inner content is already at its top. \u003ccode>overscroll-behavior: contain\u003c/code> stops scrolling from chaining to the page in browsers that support it, and a \u003ca href=\"#Scroll%20lock\" data-term=\"Scroll lock\">scroll lock\u003c/a> handles the rest.\u003c/p>\u003cp>The on-screen keyboard can also cover a \u003ca href=\"#Text%20field\" data-term=\"Text field\">text field\u003c/a> near the bottom of the sheet. Units such as \u003ccode>dvh\u003c/code> do not always account for it, so test on real devices and scroll the focused input into view.\u003c/p>\u003cp>Respect the device's \u003ca href=\"#Safe%20area\" data-term=\"Safe area\">safe area\u003c/a>, and use \u003ca href=\"#Reduced%20motion\" data-term=\"Reduced motion\">reduced motion\u003c/a> for the slide. Return focus to the trigger on close.\u003c/p>","avoid":"","usage":["Scrolling up in the filters keeps closing the whole sheet.","The bottom sheet drag is firing during scroll. Only start it when the list is at the top."],"out":[42,46,44,0,51,7,83,111]},{"name":"Popover","section":4,"description":"A non-modal floating panel opened from a control, showing content above the page while the rest stays usable.","body":"\u003cp>A popover is a non-modal floating panel opened from a control, such as a date filter or a small settings panel. The rest of the page stays usable, and it usually closes on an outside click. Choose it for short supplementary content that may contain controls. Use a \u003ca href=\"#Tooltip\" data-term=\"Tooltip\">tooltip\u003c/a> for a brief text hint, and a \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a> when the page must be blocked.\u003c/p>\u003cp>The HTML Popover API handles the mechanics declaratively.\u003c/p>\u003cpre>\u003ccode>&lt;button popovertarget=&quot;filters&quot;&gt;Filters&lt;/button&gt;\n&lt;div id=&quot;filters&quot; popover role=&quot;dialog&quot; aria-label=&quot;Filters&quot;&gt;...&lt;/div&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Value\u003c/th>\u003cth>Closes on outside click or Escape\u003c/th>\u003cth>Other popovers\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>auto\u003c/code>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Closes unrelated \u003ccode>auto\u003c/code> popovers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hint\u003c/code>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Leaves \u003ccode>auto\u003c/code> popovers open\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>manual\u003c/code>\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Independent, several can be open\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A bare \u003ccode>popover\u003c/code> attribute means \u003ccode>auto\u003c/code>. MDN lists the API as widely available since April 2024, with some parts varying, so check \u003ccode>hint\u003c/code> support.\u003c/p>\u003cp>An open popover is placed in the browser's top layer, above the page regardless of \u003ccode>z-index\u003c/code>. This avoids clipping by a parent with \u003ccode>overflow: hidden\u003c/code> and the stacking problems that previously required a \u003ca href=\"#Portal\" data-term=\"Portal\">portal\u003c/a>.\u003c/p>\u003cp>Keyboard behaviour differs from a dialog. Opening a popover does not move focus into it. The browser places it next in the Tab order after its invoker, so the next Tab enters it. Closing with Escape returns focus to the invoker. If the content should receive focus at once, add \u003ccode>autofocus\u003c/code> to an element inside.\u003c/p>\u003cp>The attribute adds no semantic role, so a plain \u003ccode>&lt;div popover&gt;\u003c/code> is announced as nothing in particular. Add a suitable role, such as \u003ccode>dialog\u003c/code> with a label for a panel of controls, or use a list of links. A \u003ccode>popovertarget\u003c/code> \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> gets an implicit expanded state, so do not manage \u003ccode>aria-expanded\u003c/code> by hand.\u003c/p>\u003cp>By default an open popover is centred in the viewport, so pair it with \u003ca href=\"#Anchor%20positioning\" data-term=\"Anchor positioning\">anchor positioning\u003c/a>.\u003c/p>","avoid":"","usage":["The filter panel gets clipped by the table's scroll container.","Make it a popover. It renders in the top layer, so \u003ccode>overflow\u003c/code> can't cut it off."],"out":[47,42,49,0,52]},{"name":"Tooltip","section":4,"description":"A small text label that appears on hover or keyboard focus to describe a control, and contains nothing interactive.","body":"\u003cp>A tooltip is a small text label that appears when a control is hovered or receives keyboard focus, usually after a short delay. It describes that control, such as naming an \u003ca href=\"#Icon%20button\" data-term=\"Icon button\">icon button\u003c/a>. It holds plain text only. If the content includes a link or \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>, use a \u003ca href=\"#Popover\" data-term=\"Popover\">popover\u003c/a> or \u003ca href=\"#Hover%20card\" data-term=\"Hover card\">hover card\u003c/a>, because focus never moves into a tooltip and a pointer user may not be able to reach it.\u003c/p>\u003cp>The WAI-ARIA Authoring Practices tooltip pattern is marked as work in progress. It describes the following behaviour.\u003c/p>\u003cpre>\u003ccode>&lt;button type=&quot;button&quot; aria-describedby=&quot;tip&quot;&gt;Publish&lt;/button&gt;\n&lt;div id=&quot;tip&quot; role=&quot;tooltip&quot; hidden&gt;Visible to everyone in the workspace&lt;/div&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Trigger\u003c/th>\u003cth>Behaviour\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>Opens. Focus stays on the control\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Blur\u003c/td>\u003ctd>Closes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pointer enter\u003c/td>\u003ctd>Opens after a short delay\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pointer leave\u003c/td>\u003ctd>Closes, unless the pointer moved onto the tooltip\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Escape\u003c/td>\u003ctd>Closes, with focus staying where it is\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>WCAG 1.4.13, Content on Hover or Focus, sets three requirements. The tooltip must be dismissible without moving the pointer or focus, which is why Escape matters. It must be hoverable, so someone using screen magnification can move onto it and read it. It must persist until the user leaves or dismisses it, so a timer that hides it fails.\u003c/p>\u003cp>Essential information in a tooltip is out of reach for touch users, who have no hover. A tooltip on a disabled control may never appear, because a natively \u003ca href=\"#Disabled%20state\" data-term=\"Disabled state\">disabled\u003c/a> button cannot receive focus and some browsers do not fire pointer events on it. Use \u003ccode>aria-disabled\u003c/code> or explain the reason in visible text. The \u003ccode>title\u003c/code> attribute is not a substitute either, since it is generally unavailable from the keyboard and on touch screens.\u003c/p>\u003cp>Use \u003ccode>aria-describedby\u003c/code> when it adds a description. If it is the control's only name, use \u003ccode>aria-labelledby\u003c/code> instead.\u003c/p>\u003cp>Placement is often handled with \u003ccode>popover=&quot;hint&quot;\u003c/code> plus \u003ca href=\"#Anchor%20positioning\" data-term=\"Anchor positioning\">anchor positioning\u003c/a>, where supported.\u003c/p>","avoid":"","usage":["The tooltip disappears when I try to move my mouse onto it to read it.","That fails WCAG 1.4.13. Keep it open while the pointer is over the tooltip itself."],"out":[1,0,46,48,105,52]},{"name":"Hover card","section":4,"description":"A rich preview that appears when hovering or focusing a link, such as a user's profile summary.","body":"\u003cp>A hover card is a rich preview that appears when someone hovers over or focuses a link, such as a profile summary on a username or a page preview on a wiki link. Because it depends on a pointer or focus, treat it as a convenience: everything inside must also be available at the link's destination.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Content\u003c/th>\u003cth>Opens on\u003c/th>\u003cth>Interactive\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Tooltip\" data-term=\"Tooltip\">Tooltip\u003c/a>\u003c/td>\u003ctd>Short text\u003c/td>\u003ctd>Hover, focus\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover card\u003c/td>\u003ctd>Rich preview\u003c/td>\u003ctd>Hover, focus\u003c/td>\u003ctd>Sometimes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Popover\" data-term=\"Popover\">Popover\u003c/a>\u003c/td>\u003ctd>Panel of content\u003c/td>\u003ctd>Click\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The Authoring Practices tooltip pattern says hover content with focusable elements should be a non-modal dialog rather than a tooltip. A card with a &quot;Follow&quot; \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> therefore needs a dialog role, a label, and a keyboard route into it. If that is too much, keep the card read-only and put the action on the destination page.\u003c/p>\u003cp>WCAG 1.4.13, Content on Hover or Focus, applies directly. The card must be dismissible with a key such as Escape without moving the pointer, stay open while the pointer is over it, and remain until the user moves away.\u003c/p>\u003cp>A hover card can close before the pointer reaches it. As the pointer crosses the gap between link and card, the link fires \u003ccode>mouseleave\u003c/code> and the card closes. A short close delay, or an invisible bridge element across the gap, fixes it. An opening delay stops a series of cards flashing as the mouse crosses a list.\u003c/p>\u003cp>Touch screens have no hover, so a tap should follow the link.\u003c/p>\u003cp>The \u003ccode>interestfor\u003c/code> attribute is an emerging way to declare this behaviour. Support is limited, so treat it as an enhancement over a normal link.\u003c/p>","avoid":"","usage":["The profile preview closes before I can reach the Follow button.","The hover card closes on \u003ccode>mouseleave\u003c/code>. Add a short delay so the pointer can cross the gap."],"out":[47,46,0]},{"name":"Portal","section":4,"description":"Rendering a component's output at a different place in the DOM from where it is declared, typically at the end of body.","body":"\u003cp>A portal renders a piece of interface at a different place in the DOM from where it is declared, typically at the end of \u003ccode>&lt;body&gt;\u003c/code>. The code still treats it as a child of the component that owns it. Portals exist to solve a visual problem: a menu inside a \u003ca href=\"#Card\" data-term=\"Card\">card\u003c/a> gets cut off by \u003ccode>overflow: hidden\u003c/code>, or sits behind a header despite \u003ccode>z-index: 9999\u003c/code>, because an ancestor created a stacking context, a group of elements layered together. Moving the element out of that ancestor frees it.\u003c/p>\u003cp>Native features now cover many of these cases.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Prefer\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Modal overlay\u003c/td>\u003ctd>\u003ccode>&lt;dialog&gt;\u003c/code> with \u003ccode>showModal()\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Menu or panel above the page\u003c/td>\u003ctd>The \u003ca href=\"#Popover\" data-term=\"Popover\">\u003ccode>popover\u003c/code>\u003c/a> attribute\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Placing it next to its trigger\u003c/td>\u003ctd>\u003ca href=\"#Anchor%20positioning\" data-term=\"Anchor positioning\">Anchor positioning\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Older browser support, or a library that requires it\u003c/td>\u003ctd>Portal\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The top layer used by \u003ccode>&lt;dialog&gt;\u003c/code> and popovers escapes clipping and stacking without moving the element, so it keeps its position in the DOM.\u003c/p>\u003cp>A portal's main cost is that document order and visual order diverge, and Tab and screen reader order follow the DOM. A \u003ca href=\"#Dropdown%20menu\" data-term=\"Dropdown menu\">dropdown menu\u003c/a> portalled to the end of \u003ccode>&lt;body&gt;\u003c/code> looks adjacent to its \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>, but is reached only after everything else on the page. WCAG failure F85 describes this case. Move focus into the portalled content when it opens, return it on close, and close it when focus leaves.\u003c/p>\u003cp>Inherited CSS from the old parent stops applying, so a \u003ca href=\"#Theming\" data-term=\"Theming\">theming\u003c/a> class on a wrapper is lost. In some frameworks, events still bubble through the component tree, so a click in a portalled menu can trigger a handler on a parent row.\u003c/p>\u003cp>Remove portalled nodes when the owner unmounts, or stale overlays stay on the page.\u003c/p>","avoid":"","usage":["The portalled menu looks right, but Tab jumps to the page footer.","It's at the end of \u003ccode>body\u003c/code> now. Use the top layer instead so it stays in DOM order."],"out":[64,46,52,36,0,89]},{"name":"Focus trap","section":4,"description":"Keeping keyboard focus inside an open overlay, so Tab cycles through its controls and cannot reach the page behind it.","body":"\u003cp>A focus trap keeps keyboard focus inside an open overlay, so Tab cycles through its controls and cannot reach the page behind. Without one, a keyboard user tabs out of a \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a> and carries on through hidden links and controls, with no visible sign of where they are. It belongs on modal overlays only. A \u003ca href=\"#Popover\" data-term=\"Popover\">popover\u003c/a> or non-modal panel should let focus leave.\u003c/p>\u003cp>A trap is only acceptable if the user can get out. WCAG 2.1.2, No Keyboard Trap, requires that focus can be moved away using the keyboard alone, or that the user is told how. In a modal, Escape and a visible close \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> meet that need.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>Blocks Tab\u003c/th>\u003cth>Hides page from screen readers\u003c/th>\u003cth>Work needed\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>&lt;dialog&gt;\u003c/code> \u003ccode>showModal()\u003c/code>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>None\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>inert\u003c/code> on the background\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Toggle it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Script handling Tab\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Most, and fragile\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The third row explains a common misunderstanding. Intercepting Tab does nothing for a screen reader's virtual cursor, which moves through content without moving focus. The user can read the page behind a dialog that looks trapped. Making the background inert solves both problems at once.\u003c/p>\u003cpre>\u003ccode>// Custom overlay rendered as a sibling of the app root\napp.inert = true;\noverlay.querySelector(&quot;[autofocus]&quot;)?.focus();\n\n// On close\napp.inert = false;\ntrigger.focus();\u003c/code>\u003c/pre>\u003cp>With \u003ccode>showModal()\u003c/code>, Tab cycles through the dialog's controls and may also reach the browser's own interface. Do not force focus back, because that stops people reaching the address bar.\u003c/p>\u003cp>A hand-written trap breaks in predictable ways. A cached list of focusable elements goes stale when content changes, and elements in iframes or shadow DOM are missed. A trap left active after closing makes the page unreachable by keyboard, so remove it in the same code path that closes the overlay, including route changes.\u003c/p>\u003cp>When the overlay closes, return focus to the element that opened it.\u003c/p>","avoid":"","usage":["Screen reader users can still read the page behind our modal.","Our focus trap only handles Tab. Set \u003ccode>inert\u003c/code> on the app root while it's open."],"out":[42,46,0]},{"name":"Scroll lock","section":4,"description":"Stopping the page behind an open overlay from scrolling, without shifting the layout or losing the scroll position.","body":"\u003cp>A scroll lock stops the page behind an open overlay from scrolling. Without one, someone scrolling a long \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a> reaches its end and the page underneath starts moving, so when the dialog closes they are in a different place. The native \u003ccode>&lt;dialog&gt;\u003c/code> does not do this for you: \u003ccode>showModal()\u003c/code> makes the page inert, but the page can still scroll.\u003c/p>\u003cpre>\u003ccode>html {\n  scrollbar-gutter: stable;\n}\n\nhtml:has(dialog:modal) {\n  overflow: hidden;\n}\n\ndialog {\n  overscroll-behavior: contain;\n}\u003c/code>\u003c/pre>\u003cp>The options address different parts of the problem.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technique\u003c/th>\u003cth>Effect\u003c/th>\u003cth>Drawback\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>overflow: hidden\u003c/code> on the root\u003c/td>\u003ctd>Stops page scrolling\u003c/td>\u003ctd>Removes the scrollbar, shifting layout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>scrollbar-gutter: stable\u003c/code>\u003c/td>\u003ctd>Reserves the scrollbar's space\u003c/td>\u003ctd>Leaves a visible empty gutter\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>overscroll-behavior: contain\u003c/code>\u003c/td>\u003ctd>Stops scroll chaining from the overlay\u003c/td>\u003ctd>Applies only to scroll containers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>position: fixed\u003c/code> on the body\u003c/td>\u003ctd>Holds the page where \u003ccode>overflow\u003c/code> is not enough\u003c/td>\u003ctd>Resets scroll unless restored\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A common bug is layout shift. On systems with classic scrollbars, hiding overflow removes the scrollbar, the page becomes wider, and everything jumps sideways as the dialog opens. \u003ccode>scrollbar-gutter: stable\u003c/code> on the root prevents this by keeping the space reserved.\u003c/p>\u003cp>Scroll chaining is when scrolling past the end of one container continues on its parent. Support for stopping it varies, so test on real devices.\u003c/p>\u003cp>Setting \u003ccode>position: fixed\u003c/code> on the body sends the page to the top unless you store \u003ccode>scrollY\u003c/code>, offset the body by it, and restore it on close.\u003c/p>\u003cp>A lock can also fail to release. If a route change unmounts the overlay without running its cleanup, the page stays unscrollable. Deriving the lock from CSS, as in the \u003ccode>:has()\u003c/code> rule above, avoids this because the lock ends when the dialog closes. With nested overlays and a script-based lock, count open layers and release only when the last one closes.\u003c/p>\u003cp>Keep the overlay's own content scrollable so zoomed-in users can reach all of it.\u003c/p>","avoid":"","usage":["The page jumps sideways every time the modal opens.","The scroll lock removes the scrollbar. Add \u003ccode>scrollbar-gutter: stable\u003c/code> to the root."],"out":[42]},{"name":"Anchor positioning","section":4,"description":"A CSS feature that positions an element relative to another element, with fallbacks when it would overflow the viewport.","body":"\u003cp>Anchor positioning is a CSS feature that places one element relative to another, such as a \u003ca href=\"#Tooltip\" data-term=\"Tooltip\">tooltip\u003c/a> above its \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> or a menu below its trigger. It replaces JavaScript libraries that measure elements and recalculate on scroll, which is a common cause of menus lagging behind their trigger.\u003c/p>\u003cpre>\u003ccode>.trigger {\n  anchor-name: --menu-trigger;\n}\n\n.menu {\n  position: fixed;\n  position-anchor: --menu-trigger;\n  position-area: bottom span-right;\n  position-try-fallbacks: flip-block, flip-inline;\n}\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Property\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>anchor-name\u003c/code>\u003c/td>\u003ctd>Names the element to position against\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>position-anchor\u003c/code>\u003c/td>\u003ctd>Says which anchor this element uses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>position-area\u003c/code>\u003c/td>\u003ctd>Places it on a 3x3 grid around the anchor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>anchor()\u003c/code>\u003c/td>\u003ctd>Uses an anchor edge inside inset properties\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>position-try-fallbacks\u003c/code>\u003c/td>\u003ctd>Alternative placements if it would overflow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>position-visibility\u003c/code>\u003c/td>\u003ctd>Hides it, for example when the anchor scrolls out of view\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The positioned element must be \u003ccode>position: absolute\u003c/code> or \u003ccode>fixed\u003c/code>. A \u003ca href=\"#Popover\" data-term=\"Popover\">popover\u003c/a> opened with \u003ccode>popovertarget\u003c/code> gets an implicit anchor to its invoker, so \u003ccode>position-area\u003c/code> works with no \u003ccode>anchor-name\u003c/code> at all.\u003c/p>\u003cp>The browser tries fallbacks only on overflow and takes the first that fits. If none fits, it keeps the original position, so set a \u003ccode>max-height\u003c/code> on tall menus.\u003c/p>\u003cp>A frequent bug comes from reusing a name. If several elements share an \u003ccode>anchor-name\u003c/code>, as in a repeated table row, the positioned element binds to the last one in the document, and every menu opens at the bottom row. Give each instance a unique name, or limit the name to a subtree with \u003ccode>anchor-scope\u003c/code>.\u003c/p>\u003cp>MDN marks \u003ccode>anchor-name\u003c/code> as Baseline 2026, newly available since January 2026, with some parts varying in support. Older browsers will ignore these properties, so provide a usable fallback position or keep a library for them.\u003c/p>\u003cp>Anchoring changes only the visual position, so the trigger and panel still need their usual roles and focus handling.\u003c/p>","avoid":"","usage":["Every row's menu opens at the bottom of the table.","They all share one \u003ccode>anchor-name\u003c/code>, so anchor positioning picks the last. Add \u003ccode>anchor-scope\u003c/code> to each row."],"out":[47,0,46]},{"name":"Toast","section":5,"description":"A brief, non-blocking message that appears over the page to report a result, then usually leaves by itself.","body":"\u003cp>A toast is a brief message that appears over the page to report the result of an action, such as &quot;Message sent&quot;, and usually leaves after a few seconds. It does not block the interface or take focus. A common failure is an &quot;Upload failed&quot; toast that disappears while the user is looking elsewhere, leaving no record of what went wrong.\u003c/p>\u003cp>Use a toast only for information the user can afford to miss or can find again.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003cth>Component\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Saved, copied, sent\u003c/td>\u003ctd>Toast\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Condition affecting the whole page or account\u003c/td>\u003ctd>\u003ca href=\"#Banner\" data-term=\"Banner\">Banner\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Problem with one section\u003c/td>\u003ctd>\u003ca href=\"#Inline%20alert\" data-term=\"Inline alert\">Inline alert\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Decision needed before continuing\u003c/td>\u003ctd>\u003ca href=\"#Alert%20dialog\" data-term=\"Alert dialog\">Alert dialog\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Screen readers, which read the interface aloud, learn about toasts through a live region: an element whose changes are announced without moving focus. Keep an empty container with \u003ccode>role=&quot;status&quot;\u003c/code> in the page from the start, then insert each message into it. A region created at the same moment as its text may not be announced. Reserve \u003ccode>role=&quot;alert&quot;\u003c/code> for errors, because it can interrupt current speech.\u003c/p>\u003cpre>\u003ccode>&lt;div role=&quot;status&quot; class=&quot;toast-region&quot;&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\u003cp>A timeout is acceptable when the same information exists elsewhere, such as a sent message appearing in the Sent folder. If the toast is the only place the information appears, WCAG 2.2.1 Timing Adjustable applies, so keep it on screen until dismissed. Pause the timer while the toast is hovered or contains focus.\u003c/p>\u003cp>Actions inside toasts need a second route. Live regions usually announce content as plain text, so a screen reader user may not learn that a \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> exists, and a keyboard user may not reach it in time. Offer any \u003ca href=\"#Undo%20pattern\" data-term=\"Undo pattern\">undo\u003c/a> from a menu, history view or shortcut as well. Queue multiple toasts and cap how many show at once.\u003c/p>","avoid":"","usage":["The export error toast disappeared before I could read which file failed.","Errors should not time out. Keep it until dismissed, and list the failure on the exports page too."],"out":[54,55,43,0,62]},{"name":"Banner","section":5,"description":"A full-width message at the top of a page or region describing a condition that affects everything below it.","body":"\u003cp>A banner is a full-width message at the top of a page or region that describes a condition affecting everything below it, such as scheduled maintenance, an expired payment card or lost connectivity. It stays in the layout until the condition ends or the user dismisses it. Unlike a \u003ca href=\"#Toast\" data-term=\"Toast\">toast\u003c/a>, it does not time out. Unlike an \u003ca href=\"#Inline%20alert\" data-term=\"Inline alert\">inline alert\u003c/a>, it is not tied to one part of the content.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Scope of the message\u003c/th>\u003cth>Component\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Whole product or account, ongoing\u003c/td>\u003ctd>Banner\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Result of one action, brief\u003c/td>\u003ctd>Toast\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One section or form\u003c/td>\u003ctd>Inline alert\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Must be answered to continue\u003c/td>\u003ctd>\u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">Modal dialog\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The ARIA role named \u003ccode>banner\u003c/code> is a different thing. ARIA is a set of attributes that describe an interface to assistive technology, and \u003ccode>role=&quot;banner&quot;\u003c/code> marks the site-wide header landmark, which a top-level \u003ccode>&lt;header&gt;\u003c/code> already provides. Do not put it on a notification.\u003c/p>\u003cp>A message present at page load needs no live role, because it is read in document order. A message that appears later should be inserted into an existing \u003ccode>role=&quot;status&quot;\u003c/code> container, or \u003ccode>role=&quot;alert&quot;\u003c/code> if urgent, so that screen readers, which read the UI aloud, announce it.\u003c/p>\u003cp>Sticky banners reduce the visible area, and on small or zoomed screens several stacked banners can fill the viewport. A sticky banner can also cover the element a keyboard user has just tabbed to, which fails WCAG 2.4.11 Focus Not Obscured (Minimum) when that element is entirely hidden. Let banners scroll away, show one at a time, or reserve space with \u003ccode>scroll-padding-top\u003c/code>.\u003c/p>\u003cp>A dismissed banner that returns on every page load teaches users to ignore it. Store the dismissal and show the banner again only when the message changes. Keep billing or security notices visible until resolved.\u003c/p>","avoid":"","usage":["Users keep closing the maintenance notice and it comes back on every route.","The banner's dismissal is only in component state. Persist it against the notice ID."],"out":[53,55,42]},{"name":"Inline alert","section":5,"description":"A message placed in the page content beside the thing it concerns, reporting information, success, a warning or an error.","body":"\u003cp>An inline alert is a message placed within the page content, next to the thing it concerns, that reports information, success, a warning or an error. Because it occupies space in the layout, it stays readable for as long as it is relevant. Use it instead of a \u003ca href=\"#Toast\" data-term=\"Toast\">toast\u003c/a> when the user needs to read the message while working on that part of the page, and instead of a \u003ca href=\"#Banner\" data-term=\"Banner\">banner\u003c/a> when the condition does not affect the whole page.\u003c/p>\u003cp>For forms, narrower patterns exist. \u003ca href=\"#Inline%20validation\" data-term=\"Inline validation\">Inline validation\u003c/a> belongs to a single field, and an \u003ca href=\"#Error%20summary\" data-term=\"Error summary\">error summary\u003c/a> collects every error after submission. An inline alert suits a problem with the form as a whole, such as &quot;Your payment could not be processed.&quot;\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Severity\u003c/th>\u003cth>Example\u003c/th>\u003cth>Role if inserted after load\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Info\u003c/td>\u003ctd>Plan changes next month\u003c/td>\u003ctd>\u003ccode>status\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Success\u003c/td>\u003ctd>Settings saved\u003c/td>\u003ctd>\u003ccode>status\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warning\u003c/td>\u003ctd>API key expires today\u003c/td>\u003ctd>\u003ccode>status\u003c/code>, or \u003ccode>alert\u003c/code> if urgent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>Payment failed\u003c/td>\u003ctd>\u003ccode>alert\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>These roles make screen readers, which read the UI aloud, announce a change without moving focus. An alert already on the page at load is generally not announced, so a static notice needs no live role and is read in document order.\u003c/p>\u003cp>Severity cannot rely on color alone, as WCAG 1.4.1 Use of Color requires another visual cue. Pair the color with an icon and a word such as &quot;Error&quot;, and give meaningful icons a text alternative.\u003c/p>\u003cp>An error rendered at the top of a long form can appear off-screen, so the submit \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> seems to do nothing. An alert inserted above a control can also push that control down just as the user clicks it. Render the alert near the action, reserve its space, or move focus to it after a failed submission.\u003c/p>","avoid":"","usage":["Clicking Pay does nothing when the card is declined.","It does show an error, but above the fold. Move the inline alert next to the Pay button."],"out":[53,54,25,26,0]},{"name":"Badge","section":5,"description":"A small read-only label attached to another element, showing a count or short status such as 3 or Beta.","body":"\u003cp>A badge is a small read-only label attached to another element that shows a count or short status, such as &quot;3&quot; on an inbox icon or &quot;Beta&quot; beside a feature name. If the user can click, remove or toggle it, use a \u003ca href=\"#Chip\" data-term=\"Chip\">chip\u003c/a> instead.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Component\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Count or status on another element\u003c/td>\u003ctd>Badge\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Removable or selectable value\u003c/td>\u003ctd>Chip\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sentence explaining a condition\u003c/td>\u003ctd>\u003ca href=\"#Inline%20alert\" data-term=\"Inline alert\">Inline alert\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A number alone gives little context to someone using a screen reader, software that reads the UI aloud. An inbox link containing a badge may be read as &quot;Inbox 3&quot;, which does not say three of what. A dot badge has no text at all. Provide the meaning in text that is visually hidden but still exposed to assistive technology:\u003c/p>\u003cpre>\u003ccode>&lt;a href=&quot;/inbox&quot;&gt;\n  Inbox\n  &lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;3&lt;/span&gt;\n  &lt;span class=&quot;visually-hidden&quot;&gt;, 3 unread messages&lt;/span&gt;\n&lt;/a&gt;\u003c/code>\u003c/pre>\u003cp>Updating a badge does not announce anything by itself. If the user needs to know about the change, such as an item being added to a cart, write a short message into a \u003ccode>role=&quot;status&quot;\u003c/code> region, which screen readers read without moving focus. Do not announce every increment of a busy counter.\u003c/p>\u003cp>Color needs two checks. Status cannot be conveyed by color alone under WCAG 1.4.1, so a red or green badge also needs a word or icon. Small text on a colored fill must still meet the 4.5:1 text contrast ratio in WCAG 1.4.3, and this is often where badges fail.\u003c/p>\u003cp>A badge positioned over an icon gets clipped when an ancestor has \u003ccode>overflow: hidden\u003c/code>, and a long count can cover the icon. Cap the display at a value like \u003ccode>99+\u003c/code> while keeping the full number in the hidden text, and set a \u003ccode>min-width\u003c/code> equal to the height so single digits stay round. Hide the badge at zero, because a permanent indicator stops carrying information.\u003c/p>","avoid":"","usage":["VoiceOver just says 'Notifications 12' on that button.","The badge needs hidden text saying 12 unread, otherwise the number has no meaning."],"out":[73,55]},{"name":"Progress bar","section":5,"description":"A track that fills to show how much of a task has finished, or that work continues when the amount is unknown.","body":"\u003cp>A progress bar is a track that fills to show how much of a task has finished. A determinate bar shows a measured value, and an indeterminate bar shows only that work is continuing. A bar that races to 99 percent and then stalls for a minute is usually driven by a timer or a poor estimate instead of measured work.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Wait\u003c/th>\u003cth>Indicator\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Known amount of work\u003c/td>\u003ctd>Determinate progress bar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unknown length, several seconds+\u003c/td>\u003ctd>Indeterminate bar with status text\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Short and unknown\u003c/td>\u003ctd>\u003ca href=\"#Spinner\" data-term=\"Spinner\">Spinner\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Content with a known layout\u003c/td>\u003ctd>\u003ca href=\"#Skeleton%20screen\" data-term=\"Skeleton screen\">Skeleton screen\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Use the native \u003ccode>&lt;progress&gt;\u003c/code> element where possible. Removing its \u003ccode>value\u003c/code> attribute makes it indeterminate. With a custom \u003ccode>role=&quot;progressbar&quot;\u003c/code>, omit \u003ccode>aria-valuenow\u003c/code> for the same result. The bar needs an accessible name, and text between the \u003ccode>&lt;progress&gt;\u003c/code> tags is only a fallback, not a label.\u003c/p>\u003cpre>\u003ccode>&lt;label for=&quot;upload&quot;&gt;Uploading report.pdf&lt;/label&gt;\n&lt;progress id=&quot;upload&quot; value=&quot;40&quot; max=&quot;100&quot;&gt;40%&lt;/progress&gt;\u003c/code>\u003c/pre>\u003cp>A screen reader, which reads the UI aloud, should not speak every percentage. Announce milestones, such as each quarter and completion, in a separate \u003ccode>role=&quot;status&quot;\u003c/code> region. When the bar reports on a page region, set \u003ccode>aria-busy=&quot;true&quot;\u003c/code> on that region and clear it when loading ends, including when it fails, because assistive technology may hold back changes while it is set.\u003c/p>\u003cp>Several failures are common. The bar jumps backward when a second stage resets the value, so combine stages into one total or label them &quot;Step 2 of 3&quot;. The bar freezes at 62 percent after a failure, so switch it to a visible \u003ca href=\"#Error%20state\" data-term=\"Error state\">error state\u003c/a> with a retry. Long tasks also need a way to cancel.\u003c/p>\u003cp>Use \u003ccode>&lt;meter&gt;\u003c/code> instead for a measurement that is not a task, such as disk usage.\u003c/p>","avoid":"","usage":["The upload sits at 100 percent for ages before it finishes.","That progress bar only tracks bytes sent. Add a processing stage so it doesn't claim to be done early."],"out":[58,59,61]},{"name":"Spinner","section":5,"description":"A looping animation showing that work is in progress without saying how much remains.","body":"\u003cp>A spinner is a looping animation that shows work is in progress without saying how much remains. It suits short waits of unknown length, such as a \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> submitting a form. A spinner that never stops usually means the request failed and the code has no path out of its loading state.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Situation\u003c/th>\u003cth>Indicator\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Short wait, unknown length\u003c/td>\u003ctd>Spinner\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Measurable work\u003c/td>\u003ctd>\u003ca href=\"#Progress%20bar\" data-term=\"Progress bar\">Progress bar\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Content with a predictable layout\u003c/td>\u003ctd>\u003ca href=\"#Skeleton%20screen\" data-term=\"Skeleton screen\">Skeleton screen\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Action almost certain to succeed\u003c/td>\u003ctd>\u003ca href=\"#Optimistic%20UI\" data-term=\"Optimistic UI\">Optimistic UI\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An animation conveys nothing to a screen reader, which reads the UI aloud. Add text such as &quot;Loading results&quot; to a \u003ccode>role=&quot;status&quot;\u003c/code> region that already exists in the page, so the message is announced without moving focus. Hide the decorative graphic with \u003ccode>aria-hidden=&quot;true&quot;\u003c/code>.\u003c/p>\u003cpre>\u003ccode>&lt;div role=&quot;status&quot;&gt;\n  &lt;svg class=&quot;spinner&quot; aria-hidden=&quot;true&quot;&gt;&lt;!-- ... --&gt;&lt;/svg&gt;\n  &lt;span class=&quot;visually-hidden&quot;&gt;Loading results&lt;/span&gt;\n&lt;/div&gt;\u003c/code>\u003c/pre>\u003cp>Spinners inside a button have their own problems. Replacing the label changes the button's width and removes its accessible name, so keep the label in place and overlay the graphic. Setting \u003ccode>disabled\u003c/code> during the request can drop keyboard focus. Use \u003ccode>aria-disabled=&quot;true&quot;\u003c/code> and ignore repeat clicks instead.\u003c/p>\u003cp>On a fast response, a spinner appears as a brief flicker, so delay it by a few hundred milliseconds. Once shown, keep it visible briefly so it does not flash. Add a timeout that leads to an \u003ca href=\"#Error%20state\" data-term=\"Error state\">error state\u003c/a>.\u003c/p>\u003cp>Under WCAG 2.2.2 Pause, Stop, Hide, moving content that runs for more than five seconds alongside other content needs a way to stop it, unless the movement is essential. A preloader that is the only content on the page is not in that position. For long waits beside usable content, show text instead. Under \u003ca href=\"#Reduced%20motion\" data-term=\"Reduced motion\">reduced motion\u003c/a>, replace rotation with a slow opacity change.\u003c/p>","avoid":"","usage":["The dashboard spinner has been going for ten minutes.","The fetch rejected and nothing clears the loading flag. It needs a timeout and an error state."],"out":[0,57,59,63,61,111]},{"name":"Skeleton screen","section":5,"description":"A placeholder that shows grey shapes in the layout of the coming content while the real data loads.","body":"\u003cp>A skeleton screen is a placeholder that shows grey shapes in the layout of the coming content while the real data loads. Because the shapes hold the space the content will use, the page does not jump when data arrives. It suits content regions whose structure is known in advance, such as a feed, profile or \u003ca href=\"#Data%20table\" data-term=\"Data table\">data table\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Situation\u003c/th>\u003cth>Indicator\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Known layout, loading content\u003c/td>\u003ctd>Skeleton screen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Button\" data-term=\"Button\">Button\u003c/a> or small inline wait\u003c/td>\u003ctd>\u003ca href=\"#Spinner\" data-term=\"Spinner\">Spinner\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Long task with measurable progress\u003c/td>\u003ctd>\u003ca href=\"#Progress%20bar\" data-term=\"Progress bar\">Progress bar\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Response usually instant\u003c/td>\u003ctd>No indicator\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A skeleton that does not match the final layout causes the jump it was meant to prevent. If it shows three lines and the content has five, everything below shifts on load. Build skeletons from the same layout as the real component, and give images a reserved size with \u003ca href=\"#Aspect%20ratio\" data-term=\"Aspect ratio\">aspect ratio\u003c/a>.\u003c/p>\u003cp>The shapes mean nothing to a screen reader, which reads the UI aloud, so hide them with \u003ccode>aria-hidden=&quot;true&quot;\u003c/code>. Announce loading through a short message in a \u003ccode>role=&quot;status&quot;\u003c/code> region. You can set \u003ccode>aria-busy=&quot;true&quot;\u003c/code> on the region being replaced, which asks assistive technology to wait for the update to finish. Clear it on success and on failure.\u003c/p>\u003cpre>\u003ccode>&lt;section aria-busy=&quot;true&quot; aria-labelledby=&quot;orders&quot;&gt;\n  &lt;h2 id=&quot;orders&quot;&gt;Orders&lt;/h2&gt;\n  &lt;div class=&quot;skeleton-row&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;\n  &lt;div class=&quot;skeleton-row&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;\n&lt;/section&gt;\u003c/code>\u003c/pre>\u003cp>Shimmer animations need the same care as other motion. Stop or soften them under \u003ca href=\"#Reduced%20motion\" data-term=\"Reduced motion\">reduced motion\u003c/a>, and remember that WCAG 2.2.2 Pause, Stop, Hide applies to movement lasting over five seconds alongside other content unless it is essential.\u003c/p>\u003cp>Two other failures are common. A request that fails can leave the skeleton in place forever, so every loading path needs an \u003ca href=\"#Error%20state\" data-term=\"Error state\">error state\u003c/a>. A skeleton shown for a fast response flashes on screen, so delay it briefly or skip it for cached data.\u003c/p>","avoid":"","usage":["The orders page jumps about a second after it loads.","The skeleton has fixed rows but the real rows wrap to two lines. Match the row height."],"out":[65,0,58,57,82,111,61]},{"name":"Empty state","section":5,"description":"The content shown when a view has nothing to display, explaining why and what the user can do next.","body":"\u003cp>An empty state is the content shown when a view has nothing to display, explaining why and what the user can do next. Without one, a new user opens a project list and sees a blank area, with no way to tell whether the page is broken, still loading or empty.\u003c/p>\u003cp>The right message depends on why the view is empty.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cause\u003c/th>\u003cth>Example message\u003c/th>\u003cth>Next action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>First use\u003c/td>\u003ctd>&quot;No projects yet&quot;\u003c/td>\u003ctd>Create project\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No search results\u003c/td>\u003ctd>&quot;No results for 'invoce'&quot;\u003c/td>\u003ctd>Clear search\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Filters too narrow\u003c/td>\u003ctd>&quot;No open tickets match&quot;\u003c/td>\u003ctd>Reset filters\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Work completed\u003c/td>\u003ctd>&quot;All caught up&quot;\u003c/td>\u003ctd>None needed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No permission\u003c/td>\u003ctd>&quot;You don't have access&quot;\u003c/td>\u003ctd>Request access\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Keep empty, loading and failed as three separate states. A common bug is initialising the list to \u003ccode>[]\u003c/code>, which renders &quot;No invoices&quot; for a moment before the data arrives. A worse one is falling back to \u003ccode>[]\u003c/code> when the request fails, which tells users their data is gone. Track request status explicitly and show an \u003ca href=\"#Error%20state\" data-term=\"Error state\">error state\u003c/a> for failures and a \u003ca href=\"#Skeleton%20screen\" data-term=\"Skeleton screen\">skeleton screen\u003c/a> while loading.\u003c/p>\u003cp>For accessibility, use real text and a real heading or paragraph. Illustrations are usually decorative here, so give them \u003ccode>alt=&quot;&quot;\u003c/code>. When a search or filter empties the results without a page load, announce the outcome through a \u003ccode>role=&quot;status&quot;\u003c/code> region that already exists, such as &quot;No results found&quot;. WCAG 4.1.3 Status Messages covers this kind of update, which should reach screen readers (software that reads the UI aloud) without moving focus.\u003c/p>\u003cp>Keep the message specific and offer one primary action. When filters caused the empty result, repeat the active filters so the user can see what to change. Do not fill the space with marketing copy on a screen where someone is trying to work.\u003c/p>","avoid":"","usage":["A customer thought we deleted their invoices.","The API timed out and we rendered the empty state. A failed fetch needs its own error state."],"out":[61,59]},{"name":"Error state","section":5,"description":"The content shown when data or an action fails, saying what happened and how the user can recover.","body":"\u003cp>An error state is the content shown when data or an action fails, saying what happened and how the user can recover. A generic &quot;Something went wrong&quot; with no next step leaves the user unable to tell whether to retry, wait or contact support.\u003c/p>\u003cp>Match the size of the error to the size of the failure, so one broken widget does not take down the page.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Scope\u003c/th>\u003cth>Treatment\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>One field\u003c/td>\u003ctd>\u003ca href=\"#Inline%20validation\" data-term=\"Inline validation\">Inline validation\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A submitted form\u003c/td>\u003ctd>\u003ca href=\"#Error%20summary\" data-term=\"Error summary\">Error summary\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One section or widget\u003c/td>\u003ctd>\u003ca href=\"#Inline%20alert\" data-term=\"Inline alert\">Inline alert\u003c/a> with retry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Whole product degraded\u003c/td>\u003ctd>\u003ca href=\"#Banner\" data-term=\"Banner\">Banner\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Page cannot render\u003c/td>\u003ctd>Full-page error with navigation still available\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A useful error state answers three questions: what failed, whether the user's work is safe, and what to do next. &quot;We couldn't load your invoices. Your data is safe. Try again.&quot; is more useful than a status code. Distinguish causes when you can, because being offline, lacking permission and a server fault each call for a different action.\u003c/p>\u003cp>Keep it distinct from an \u003ca href=\"#Empty%20state\" data-term=\"Empty state\">empty state\u003c/a>. Code that catches a failed request and returns an empty list makes an outage look like missing data.\u003c/p>\u003cp>Preserve what the user entered. A retry that clears a long form turns a small failure into lost work.\u003c/p>\u003cp>For accessibility, an error that appears after an action should reach screen readers, which read the UI aloud. Insert it into a \u003ccode>role=&quot;alert&quot;\u003c/code> region, which announces it without moving focus. When a whole view is replaced by the error, move focus to its heading by giving the heading \u003ccode>tabindex=&quot;-1&quot;\u003c/code> and calling \u003ccode>.focus()\u003c/code>, otherwise focus can be lost with the removed content. Do not signal the error with red alone, since WCAG 1.4.1 Use of Color requires another cue such as an icon or text.\u003c/p>","avoid":"","usage":["When the reports API fails, the whole dashboard goes blank.","Wrap each widget so a failure shows a local error state with a retry button."],"out":[25,26,55,54,60]},{"name":"Undo pattern","section":5,"description":"Applying an action immediately and offering a way to reverse it, instead of asking for confirmation first.","body":"\u003cp>The undo pattern applies an action immediately and offers a way to reverse it, instead of asking for confirmation first. Archiving an email and seeing &quot;Conversation archived. Undo&quot; is the typical example. It avoids the confirmation prompts that users learn to click through without reading.\u003c/p>\u003cp>Choose between undo and confirmation based on whether the action can actually be reversed.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Action\u003c/th>\u003cth>Approach\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Frequent and reversible\u003c/td>\u003ctd>Undo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Destructive but recoverable\u003c/td>\u003ctd>Undo, backed by a trash or history\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Irreversible, or affects other people\u003c/td>\u003ctd>\u003ca href=\"#Alert%20dialog\" data-term=\"Alert dialog\">Alert dialog\u003c/a> confirmation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Payment or legal commitment\u003c/td>\u003ctd>Review step before submitting\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>WCAG 3.3.4 Error Prevention (Legal, Financial, Data) applies to pages that create legal or financial commitments, or that change or delete user-controllable data. Those submissions must be reversible, checked for errors, or confirmed, so undo is one valid way to meet it.\u003c/p>\u003cp>There are three common implementations:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Weakness\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Delayed commit\u003c/td>\u003ctd>Send the request when the window ends\u003c/td>\u003ctd>Closing the tab can lose or skip the action\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Soft delete\u003c/td>\u003ctd>Mark as deleted, purge later\u003c/td>\u003ctd>Needs storage and a cleanup job\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Inverse action\u003c/td>\u003ctd>Run the opposite operation\u003c/td>\u003ctd>Fails if later changes conflict\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The usual failure is an undo offered only in a \u003ca href=\"#Toast\" data-term=\"Toast\">toast\u003c/a>. If the toast times out, the option disappears, and a keyboard user or someone on a screen reader (software that reads the UI aloud) may never reach it. Keep a lasting route as well, such as a Trash view, an activity history or a keyboard shortcut.\u003c/p>\u003cp>Undo must also restore the full previous state, including the item's position in its list. Return focus to the restored item or a sensible neighbour, because the element that had focus may have been removed. Announce both the action and its reversal through a \u003ccode>role=&quot;status&quot;\u003c/code> region.\u003c/p>","avoid":"","usage":["Should deleting a label ask 'Are you sure?'","No, it's easy to reverse. Use the undo pattern, and keep deleted labels recoverable for 30 days."],"out":[43,53]},{"name":"Optimistic UI","section":5,"description":"Showing the result of an action immediately, before the server confirms it, and rolling back if the request fails.","body":"\u003cp>Optimistic UI shows the result of an action immediately, before the server confirms it, and rolls back if the request fails. A like \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> that fills on tap, while the request runs in the background, is the typical example. It removes the visible wait on actions that almost always succeed.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>User\u003c/td>\u003ctd>Triggers the action\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Saves the previous state and updates the UI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Sends the request\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Accepts or rejects it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>On success, reconciles with the response\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>On failure, restores state and tells the user\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Use it for frequent, low-stakes, reversible actions such as starring, reordering or renaming. Do not use it for payments, permission changes or anything where showing success falsely would mislead someone. For those, show a pending state with a \u003ca href=\"#Spinner\" data-term=\"Spinner\">spinner\u003c/a> until the server confirms.\u003c/p>\u003cp>A silent rollback is a common failure. The user likes a post, moves on, and later finds the like has vanished because the request failed and nothing said so. Every rollback needs a message, usually a \u003ca href=\"#Toast\" data-term=\"Toast\">toast\u003c/a> or \u003ca href=\"#Inline%20alert\" data-term=\"Inline alert\">inline alert\u003c/a> with a retry.\u003c/p>\u003cp>Race conditions are the second failure. If a user toggles a star on and off quickly, responses can arrive out of order and leave the wrong final state. Cancel earlier requests, or ignore any response that is not the latest for that item. Retried requests can also create duplicates, so give each create operation a client-generated ID the server can deduplicate.\u003c/p>\u003cp>Assistive technology needs the same truth as the screen. Update states such as \u003ccode>aria-pressed\u003c/code> immediately, and when a rollback occurs, announce it through a \u003ccode>role=&quot;alert&quot;\u003c/code> region, because a state that silently reverts is otherwise easy to miss.\u003c/p>","avoid":"","usage":["Comments sometimes appear twice after a flaky connection.","The optimistic UI retries without an idempotency key. Generate an ID on the client so the server can dedupe."],"out":[0,58,53,55]},{"name":"Card","section":6,"description":"A bounded container that groups content and actions about one item, usually repeated in a grid or list.","body":"\u003cp>A card is a bounded container that groups content and actions about one item, such as a product, article or team member. Cards are usually repeated in a grid or list so people can scan separate items. If people need to compare the same attribute across many items, use a \u003ca href=\"#Data%20table\" data-term=\"Data table\">data table\u003c/a>, because aligned columns make comparison easier than scattered card fields.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Content\u003c/th>\u003cth>Component\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Separate items with mixed content\u003c/td>\u003ctd>Card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Many records compared by attribute\u003c/td>\u003ctd>Data table\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Simple items with one line each\u003c/td>\u003ctd>List\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One group of related settings\u003c/td>\u003ctd>Plain section with a heading\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Clickable cards are where most problems occur. Wrapping the entire card in \u003ccode>&lt;a&gt;\u003c/code> makes a screen reader (software that reads the UI aloud) announce all of its content as one long link name, and placing a \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> inside that link creates invalid nested interactive elements. A safer pattern keeps the link on the heading and stretches its hit area over the card with a pseudo-element:\u003c/p>\u003cpre>\u003ccode>.card { position: relative; }\n.card h3 a::after { content: &quot;&quot;; position: absolute; inset: 0; }\n.card button { position: relative; z-index: 1; }\u003c/code>\u003c/pre>\u003cp>The raised \u003ccode>z-index\u003c/code> keeps secondary buttons clickable above the stretched link. The trade-off is that text in the card becomes harder to select, because the overlay receives the pointer.\u003c/p>\u003cp>Use semantic structure inside the card. Give each one a real heading at the correct level for the page, and mark a repeated set as a list with \u003ccode>&lt;ul&gt;\u003c/code>.\u003c/p>\u003cp>Uneven content is the common visual failure. One long title makes a card taller and misaligns the buttons in its row. Put cards in a grid so they stretch to equal height, make each card a flex column, and push the actions to the bottom with \u003ccode>margin-top: auto\u003c/code>. Reserve image space with \u003ca href=\"#Aspect%20ratio\" data-term=\"Aspect ratio\">aspect ratio\u003c/a> to prevent shifts as images load.\u003c/p>","avoid":"","usage":["The screen reader reads the entire product card as one link.","Move the link onto the card's title and stretch it with a pseudo-element."],"out":[65,0,82]},{"name":"Data table","section":6,"description":"Rows and columns of structured records, built so people can read, compare, sort and act on them.","body":"\u003cp>A data table presents structured records in rows and columns so people can read, compare, sort and act on them. Use it when each row has the same fields and people need to compare values down a column. For a small set of items with varied content, a \u003ca href=\"#Card\" data-term=\"Card\">card\u003c/a> or list is usually easier to scan.\u003c/p>\u003cp>Build it with a native \u003ccode>&lt;table&gt;\u003c/code>, which gives screen readers (software that reads the UI aloud) row and column relationships for free. A table made of \u003ccode>&lt;div&gt;\u003c/code> elements announces no headers unless every role is added by hand.\u003c/p>\u003cpre>\u003ccode>&lt;table&gt;\n  &lt;caption&gt;Open invoices&lt;/caption&gt;\n  &lt;thead&gt;\n    &lt;tr&gt;\n      &lt;th scope=&quot;col&quot; aria-sort=&quot;ascending&quot;&gt;&lt;button&gt;Due date&lt;/button&gt;&lt;/th&gt;\n      &lt;th scope=&quot;col&quot;&gt;Amount&lt;/th&gt;\n    &lt;/tr&gt;\n  &lt;/thead&gt;\n&lt;/table&gt;\u003c/code>\u003c/pre>\u003cp>Put a \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> inside each sortable header and set \u003ccode>aria-sort\u003c/code> on the \u003ccode>&lt;th&gt;\u003c/code> of the sorted column.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Content\u003c/th>\u003cth>Pattern\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Static data, few controls\u003c/td>\u003ctd>Table\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Many interactive cells, spreadsheet-like\u003c/td>\u003ctd>Grid, with arrow-key movement\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The WAI-ARIA Authoring Practices recommend a grid when a table holds many widgets, because a grid has one Tab stop and arrow keys move between cells. It takes significant work, so do not adopt it for a table with one link per row.\u003c/p>\u003cp>Wide tables are the common failure on small screens. Wrap the table in a scrolling container so the page itself does not overflow. Some browsers do not make scrolling regions keyboard-focusable, so add \u003ccode>tabindex=&quot;0&quot;\u003c/code>, \u003ccode>role=&quot;region&quot;\u003c/code> and an \u003ccode>aria-label\u003c/code> to it. WCAG 1.4.10 Reflow allows data tables to scroll in two dimensions, but the headings, search and \u003ca href=\"#Pagination%20control\" data-term=\"Pagination control\">pagination\u003c/a> around them must still reflow.\u003c/p>\u003cp>For long data, use pagination or a \u003ca href=\"#Virtualized%20list\" data-term=\"Virtualized list\">virtualized list\u003c/a>. If rows are missing from the DOM, set \u003ccode>aria-rowcount\u003c/code> to the total and \u003ccode>aria-rowindex\u003c/code> on each row. Keep column headers visible with a \u003ca href=\"#Sticky%20header\" data-term=\"Sticky header\">sticky header\u003c/a>.\u003c/p>","avoid":"","usage":["Keyboard users have to tab through 400 links in the orders list.","That's a data table acting like a grid. Use the grid pattern, or reduce it to one link per row."],"out":[64,0,34,68,66]},{"name":"Sticky header","section":6,"description":"A header that scrolls with the page until it reaches an edge, then stays visible while content moves beneath it.","body":"\u003cp>A sticky header is a page or table header that scrolls normally until it reaches an edge, then stays visible while content moves beneath it. It keeps column labels or navigation in view on long screens. It is usually built with \u003ccode>position: sticky\u003c/code>, which keeps the element in normal flow. \u003ccode>position: fixed\u003c/code> removes it from flow, so the content below needs a manual offset.\u003c/p>\u003cpre>\u003ccode>th {\n  position: sticky;\n  top: 0;\n  z-index: 1;\n  background: Canvas;\n}\u003c/code>\u003c/pre>\u003cp>A common symptom is a header that does not stick at all. These are the usual causes:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Symptom\u003c/th>\u003cth>Cause\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Scrolls away immediately\u003c/td>\u003ctd>No \u003ccode>top\u003c/code> or other inset set\u003c/td>\u003ctd>Set \u003ccode>top: 0\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sticks to the wrong box\u003c/td>\u003ctd>An ancestor has \u003ccode>overflow: hidden\u003c/code> or \u003ccode>auto\u003c/code>\u003c/td>\u003ctd>Remove it, or use \u003ccode>overflow: clip\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stops partway down\u003c/td>\u003ctd>Its parent ends there\u003c/td>\u003ctd>Move it to a taller parent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Content shows through\u003c/td>\u003ctd>No background\u003c/td>\u003ctd>Set an opaque background\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rows paint over it\u003c/td>\u003ctd>Later content stacks higher\u003c/td>\u003ctd>Raise its \u003ccode>z-index\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Using \u003ccode>overflow: clip\u003c/code> works because it clips without creating a scroll container, but content it clips cannot be scrolled into view, so avoid it around interactive elements. In a \u003ca href=\"#Data%20table\" data-term=\"Data table\">data table\u003c/a>, apply sticky to the \u003ccode>&lt;th&gt;\u003c/code> cells. With \u003ccode>border-collapse: collapse\u003c/code>, cell borders can scroll away from a stuck header, so \u003ccode>border-collapse: separate\u003c/code> is often used.\u003c/p>\u003cp>Sticky headers can hide keyboard focus. When a user presses Shift+Tab, the focused element may land underneath the header, and WCAG 2.4.11 Focus Not Obscured (Minimum) fails if it is entirely hidden. Set \u003ccode>scroll-padding-top\u003c/code> on the scroll container to the header's height.\u003c/p>\u003cp>Height matters on small or zoomed screens, where a tall header can take a large share of the viewport. An \u003ca href=\"#App%20shell\" data-term=\"App shell\">app shell\u003c/a> that scrolls its content pane avoids some of these issues, since the header sits outside the scrolling region.\u003c/p>","avoid":"","usage":["The table header stopped sticking after the redesign.","The new wrapper has \u003ccode>overflow: hidden\u003c/code>, so that's now the sticky header's scroll container."],"out":[65,77]},{"name":"Row selection","section":6,"description":"Letting users mark one or more rows in a table or list so a bulk action can apply to them.","body":"\u003cp>Row selection lets users mark one or more rows in a \u003ca href=\"#Data%20table\" data-term=\"Data table\">data table\u003c/a> or list so an action can apply to all of them, such as archiving twenty invoices at once. It usually appears as a \u003ca href=\"#Checkbox\" data-term=\"Checkbox\">checkbox\u003c/a> column, with a header checkbox for selecting all rows and a \u003ca href=\"#Toolbar\" data-term=\"Toolbar\">toolbar\u003c/a> showing the bulk actions.\u003c/p>\u003cp>The header checkbox has three states, and \u003ccode>indeterminate\u003c/code> is set from script because HTML has no attribute for it.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Rows selected\u003c/th>\u003cth>Header checkbox\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>None\u003c/td>\u003ctd>Unchecked\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Some\u003c/td>\u003ctd>Indeterminate (\u003ccode>aria-checked=&quot;mixed&quot;\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>All\u003c/td>\u003ctd>Checked\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An unclear &quot;select all&quot; can cause data loss. On a paginated table, a user ticks the header, sees every visible row checked and presses Delete, unsure whether that means 25 rows or all 1,240. State the scope in text (&quot;25 selected. Select all 1,240&quot;) and make the larger selection a separate step. Confirm destructive bulk actions with an \u003ca href=\"#Alert%20dialog\" data-term=\"Alert dialog\">alert dialog\u003c/a> that repeats the count.\u003c/p>\u003cp>Store selection by record ID and never by row index. Index-based selection attaches to the wrong records as soon as the table is sorted, filtered or paged.\u003c/p>\u003cp>Each checkbox needs a distinct accessible name, such as &quot;Select invoice 1042&quot;. A column of checkboxes all named &quot;Select&quot; gives someone using a screen reader, which reads the UI aloud, no way to tell them apart. Announce the running count through a \u003ccode>role=&quot;status&quot;\u003c/code> region.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Structure\u003c/th>\u003cth>How selection is exposed\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Native table with checkboxes\u003c/td>\u003ctd>The checkbox state\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Grid widget (\u003ccode>role=&quot;grid&quot;\u003c/code>)\u003c/td>\u003ctd>\u003ccode>aria-selected\u003c/code> on the row or cell\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>In a grid, the WAI-ARIA Authoring Practices require the selected state to look different from the focus indicator, and moving focus in a multi-select grid should not change the selection. If clicking a row also opens it, keep the checkbox as a separate target so that selecting does not navigate.\u003c/p>","avoid":"","usage":["Sorting by date changed which rows were selected.","We're tracking row selection by index. Key it on the invoice ID."],"out":[65,9,6,43]},{"name":"Virtualized list","section":6,"description":"A long list that renders only the rows near the viewport and swaps them as the user scrolls.","body":"\u003cp>A virtualized list renders only the rows near the viewport and swaps them as the user scrolls, while a spacer keeps the scrollbar the correct size for the full list. A list of 50,000 rows might have only 30 in the DOM at any moment. Without it, a very long list can make the page slow to render and scroll.\u003c/p>\u003cp>Virtualization has real costs, so try simpler options first.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Option\u003c/th>\u003cth>Keeps rows in DOM\u003c/th>\u003cth>Find-in-page\u003c/th>\u003cth>Suits\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Pagination%20control\" data-term=\"Pagination control\">Pagination\u003c/a>\u003c/td>\u003ctd>Current page only\u003c/td>\u003ctd>Current page\u003c/td>\u003ctd>Most business data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>content-visibility: auto\u003c/code>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Long pages, moderate lists\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Virtualization\u003c/td>\u003ctd>Visible rows only\u003c/td>\u003ctd>Rendered rows only\u003c/td>\u003ctd>Very large lists\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The CSS \u003ccode>content-visibility: auto\u003c/code> property skips rendering for off-screen content while leaving it available to find-in-page and the Tab order.\u003c/p>\u003cp>Removing rows from the DOM causes the failures people notice. Pressing Ctrl+F does not find a row that is not rendered, so provide a \u003ca href=\"#Search%20field\" data-term=\"Search field\">search field\u003c/a>. Scrolling quickly can show blank space until rows mount, which rendering a few extra rows reduces. Rows of varying height can make the scroll position jump when estimates are corrected, so measure them or use a fixed height.\u003c/p>\u003cp>Focus is the main accessibility risk. If the focused row scrolls out and unmounts, focus falls to the document body and a keyboard user loses their place. Keep the focused row mounted, or restore focus when it returns.\u003c/p>\u003cp>Screen readers, which read the UI aloud, only see what is in the DOM, so state the true size:\u003c/p>\u003cpre>\u003ccode>&lt;ul aria-label=&quot;Contacts&quot;&gt;\n  &lt;li aria-setsize=&quot;50000&quot; aria-posinset=&quot;1201&quot;&gt;Ada Moreno&lt;/li&gt;\n  &lt;li aria-setsize=&quot;50000&quot; aria-posinset=&quot;1202&quot;&gt;Ben Okafor&lt;/li&gt;\n&lt;/ul&gt;\u003c/code>\u003c/pre>\u003cp>For tables, use \u003ccode>aria-rowcount\u003c/code> on the table and \u003ccode>aria-rowindex\u003c/code> on each row. Use stable item IDs as keys, since reusing a row by index can leak state such as a checked box into a different record.\u003c/p>","avoid":"","usage":["Ctrl+F can't find a customer I can see further down the list.","It's a virtualized list, so that row isn't in the DOM. We need a search box."],"out":[34,21]},{"name":"Infinite scroll","section":6,"description":"A list that loads and appends more items automatically as the user nears the end.","body":"\u003cp>Infinite scroll loads and appends more items automatically as the user nears the end of a list. It is usually triggered by an \u003ccode>IntersectionObserver\u003c/code>, a browser API that reports when a marker element near the bottom comes into view. It suits feeds that people browse without a specific target, and it works poorly when people need to find, compare or return to a particular item.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Pattern\u003c/th>\u003cth>Position shareable\u003c/th>\u003cth>Footer reachable\u003c/th>\u003cth>Suits\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Pagination%20control\" data-term=\"Pagination control\">Pagination\u003c/a>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Search, records\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Load more \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>\u003c/td>\u003ctd>With extra work\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Product listings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Infinite scroll\u003c/td>\u003ctd>With extra work\u003c/td>\u003ctd>No, unless moved\u003c/td>\u003ctd>Social-style feeds\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Several failures are characteristic. The footer keeps moving away as items load, so its links cannot be clicked. Opening an item and pressing Back returns the user to the top of the list. Memory grows as thousands of items accumulate, which a \u003ca href=\"#Virtualized%20list\" data-term=\"Virtualized list\">virtualized list\u003c/a> can address. To restore position, store the page or item in the URL with \u003ccode>history.replaceState\u003c/code> and reload that slice on return.\u003c/p>\u003cp>People using a keyboard or a screen reader, which reads the UI aloud, face a further problem. Content that loads as focus moves can trap them in the list, unable to reach anything after it. A &quot;Load more&quot; button avoids this, because the user decides when content is added.\u003c/p>\u003cp>If you do build a feed, the WAI-ARIA Authoring Practices define a \u003ccode>feed\u003c/code> pattern:\u003c/p>\u003cpre>\u003ccode>&lt;div role=&quot;feed&quot; aria-label=&quot;Updates&quot; aria-busy=&quot;false&quot;&gt;\n  &lt;article aria-posinset=&quot;1&quot; aria-setsize=&quot;-1&quot; aria-labelledby=&quot;t1&quot;&gt;...&lt;/article&gt;\n&lt;/div&gt;\u003c/code>\u003c/pre>\u003cp>Use \u003ccode>aria-setsize=&quot;-1&quot;\u003c/code> when the total is unknown. Set \u003ccode>aria-busy=&quot;true&quot;\u003c/code> while articles are being added and return it to \u003ccode>false\u003c/code> afterwards. The pattern recommends Page Down and Page Up to move between articles, and Control+End to move past the feed. Announce loading and the end of the list through a \u003ccode>role=&quot;status&quot;\u003c/code> region, and never remove the item that has focus.\u003c/p>","avoid":"","usage":["I can't click Privacy in the footer because the page keeps growing.","That's infinite scroll pushing it away. Switch to a Load more button."],"out":[34,0,68]},{"name":"Accordion","section":6,"description":"A vertical stack of headers that each expand or collapse a section of content.","body":"\u003cp>An accordion is a vertical stack of headers that each expand or collapse a section of content. It shortens long pages where people need only some sections, such as an FAQ or a settings list. If people need to read most of the content, leave it expanded, because collapsed sections add clicks and hide text from a quick scan.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Component\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Several optional sections, stacked\u003c/td>\u003ctd>Accordion\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Peer views, one visible at a time\u003c/td>\u003ctd>\u003ca href=\"#Tabs\" data-term=\"Tabs\">Tabs\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One show or hide control\u003c/td>\u003ctd>Disclosure (\u003ccode>&lt;details&gt;\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Content everyone must read\u003c/td>\u003ctd>Plain headings\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The WAI-ARIA Authoring Practices define the structure. Each header is a real \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> inside a heading, and the button is the only element in that heading. The button carries \u003ccode>aria-expanded\u003c/code> and \u003ccode>aria-controls\u003c/code>. Enter and Space toggle the panel, and Tab moves through the page as usual.\u003c/p>\u003cpre>\u003ccode>&lt;h3&gt;\n  &lt;button aria-expanded=&quot;true&quot; aria-controls=&quot;ship&quot;&gt;Shipping&lt;/button&gt;\n&lt;/h3&gt;\n&lt;div id=&quot;ship&quot;&gt;Orders leave within two days.&lt;/div&gt;\u003c/code>\u003c/pre>\u003cp>A panel can also take \u003ccode>role=&quot;region&quot;\u003c/code> with \u003ccode>aria-labelledby\u003c/code> pointing at its button. Avoid this when many panels can be open at once, roughly more than six, because it adds too many landmarks for people using a screen reader, which reads the UI aloud, to navigate.\u003c/p>\u003cp>Native \u003ccode>&lt;details&gt;\u003c/code> elements sharing the same \u003ccode>name\u003c/code> attribute form an exclusive group with no script, so opening one closes the others. Test it with a screen reader.\u003c/p>\u003cp>Single-open behaviour can move content away from the pointer. When a user opens a lower section, the open section above collapses, the content shifts up, and the header they clicked can move out of view. Allow several panels open, or scroll the opened header back into view. Text in a collapsed panel may not appear in find-in-page, so test it and offer an &quot;Expand all&quot; control on long pages. Animate height only when \u003ca href=\"#Reduced%20motion\" data-term=\"Reduced motion\">reduced motion\u003c/a> is not requested.\u003c/p>","avoid":"","usage":["Opening question eight jumps the page and I lose my place.","The accordion closes question three above it. Let multiple panels stay open."],"out":[3
