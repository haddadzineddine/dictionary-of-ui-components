3,0,111]},{"name":"Carousel","section":6,"description":"A region that shows one slide or a few items at a time, with controls for moving through the rest.","body":"\u003cp>A carousel is a region that shows one slide or a few items at a time, with controls for moving through the rest. It saves vertical space, but content on later slides is easy to miss, and a slide that advances while someone is reading takes the text away from them. If every item matters, a stacked list or a grid of \u003ca href=\"#Card\" data-term=\"Card\">cards\u003c/a> keeps all of it visible.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Component\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>All items must be seen\u003c/td>\u003ctd>Grid or list\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Browse similar items sideways\u003c/td>\u003ctd>Scroll container with snap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gallery of images\u003c/td>\u003ctd>Thumbnails and \u003ca href=\"#Lightbox\" data-term=\"Lightbox\">lightbox\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rotating promotional slides\u003c/td>\u003ctd>Carousel with a stop control\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Auto-rotation carries the strictest requirements. WCAG 2.2.2 Pause, Stop, Hide requires a way to pause moving content that starts automatically, lasts more than five seconds and appears alongside other content. The WAI-ARIA Authoring Practices add specific behaviour:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Requirement\u003c/th>\u003cth>Behaviour\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Rotation control\u003c/td>\u003ctd>A \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> to stop and restart, first in the Tab sequence\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pointer hover\u003c/td>\u003ctd>Rotation stops while hovering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Keyboard focus\u003c/td>\u003ctd>Rotation stops when focus enters, until explicitly restarted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Live region\u003c/td>\u003ctd>\u003ccode>aria-live=&quot;off&quot;\u003c/code> while rotating, \u003ccode>polite\u003c/code> when stopped\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Next, Previous\u003c/td>\u003ctd>Buttons that keep focus in place when activated\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cpre>\u003ccode>&lt;section aria-roledescription=&quot;carousel&quot; aria-label=&quot;Featured plans&quot;&gt;\n  &lt;button&gt;Stop slide rotation&lt;/button&gt;\n  &lt;div aria-live=&quot;off&quot; aria-atomic=&quot;false&quot;&gt;\n    &lt;div role=&quot;group&quot; aria-roledescription=&quot;slide&quot; aria-label=&quot;2 of 5&quot;&gt;...&lt;/div&gt;\n  &lt;/div&gt;\n&lt;/section&gt;\u003c/code>\u003c/pre>\u003cp>Hidden slides are a common accessibility bug. If off-screen slides stay focusable, Tab moves focus to links the user cannot see. Apply the \u003ccode>inert\u003c/code> attribute or \u003ccode>hidden\u003c/code> to inactive slides.\u003c/p>\u003cp>Touch-only swiping is another gap. WCAG 2.5.7 Dragging Movements requires a single-pointer alternative, so visible Next and Previous buttons are needed. If you set \u003ccode>touch-action\u003c/code>, keep vertical panning and pinch zoom available, for example with \u003ccode>pan-y pinch-zoom\u003c/code>. Also honour \u003ca href=\"#Reduced%20motion\" data-term=\"Reduced motion\">reduced motion\u003c/a> by disabling auto-rotation and sliding transitions.\u003c/p>","avoid":"","usage":["The hero slide changes while I'm still reading it.","The carousel needs to stop on hover and focus, and it needs a visible pause button."],"out":[64,76,0,111]},{"name":"Avatar","section":6,"description":"A small image, initials or icon that represents a person or account in an interface.","body":"\u003cp>An avatar is a small image, set of initials or icon that represents a person or account. It helps people recognise who wrote a comment, who owns a task or which account is signed in.\u003c/p>\u003cp>A fallback chain prevents the broken-image icon that appears when a photo URL fails.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Priority\u003c/th>\u003cth>Display\u003c/th>\u003cth>When\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Photo\u003c/td>\u003ctd>Image loads successfully\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Initials\u003c/td>\u003ctd>No image, or loading failed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Generic icon\u003c/td>\u003ctd>No name available\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The correct alt text depends on what sits next to the image. When the person's name is adjacent, the avatar repeats it, so use \u003ccode>alt=&quot;&quot;\u003c/code> and screen readers, which read the UI aloud, skip it. When the avatar stands alone, the alt text should be the person's name. Do not use &quot;avatar&quot; or &quot;profile picture&quot; as alt text.\u003c/p>\u003cpre>\u003ccode>&lt;img src=&quot;/u/42.jpg&quot; alt=&quot;&quot; width=&quot;40&quot; height=&quot;40&quot; class=&quot;avatar&quot; /&gt;\n&lt;span&gt;Priya Shah&lt;/span&gt;\u003c/code>\u003c/pre>\u003cp>Uploaded photos are rarely square, and stretching them distorts faces. Set equal width and height attributes to reserve the space and prevent layout shift, then crop with \u003ccode>object-fit: cover\u003c/code>. For a shape that scales, use \u003ca href=\"#Aspect%20ratio\" data-term=\"Aspect ratio\">aspect ratio\u003c/a>.\u003c/p>\u003cp>Initials fallbacks have their own traps. Names do not always split into a first and last name, so derive initials carefully and handle single names and non-Latin scripts. Background colors generated from a hash can produce unreadable combinations, so choose from a fixed palette that meets the 4.5:1 text contrast ratio.\u003c/p>\u003cp>An avatar that opens an account menu is a control, so wrap it in a real \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> with a name such as &quot;Account menu&quot;. Its \u003ca href=\"#Touch%20target\" data-term=\"Touch target\">touch target\u003c/a> should meet WCAG 2.5.8, which asks for 24 by 24 CSS pixels or enough spacing around a smaller target. A stack of overlapping avatars can fail both. In a group, summarise the overflow with a &quot;+3&quot; item whose accessible name says &quot;3 more members&quot;.\u003c/p>","avoid":"","usage":["Half the comment avatars are showing a broken image icon.","Those users have expired photo URLs. Fall back to initials on the image error event."],"out":[82,0,106]},{"name":"Chip","section":6,"description":"A compact interactive element representing a value, filter or choice that can be selected or removed.","body":"\u003cp>A chip is a compact interactive element that represents a value, filter or choice, usually drawn as a rounded pill. Selecting &quot;In stock&quot; on a product page or removing a recipient from an email field are typical uses. A \u003ca href=\"#Badge\" data-term=\"Badge\">badge\u003c/a> looks similar but is read-only, so the deciding question is whether the user can act on it.\u003c/p>\u003cp>Chips cover several behaviours, and each needs different markup.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Purpose\u003c/th>\u003cth>Semantics\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Filter\u003c/td>\u003ctd>Turns a filter on/off\u003c/td>\u003ctd>\u003ca href=\"#Button\" data-term=\"Button\">Button\u003c/a> with \u003ccode>aria-pressed\u003c/code>, or a \u003ca href=\"#Checkbox\" data-term=\"Checkbox\">checkbox\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Choice\u003c/td>\u003ctd>Pick one of a set\u003c/td>\u003ctd>Radio inputs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Input\u003c/td>\u003ctd>A value the user added\u003c/td>\u003ctd>Text plus a remove button\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Suggestion\u003c/td>\u003ctd>Run an action\u003c/td>\u003ctd>Plain button\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>For a value the user entered, as in a \u003ca href=\"#Tag%20input\" data-term=\"Tag input\">tag input\u003c/a>, the chip is text with a separate remove button. That button needs a specific name, because a list of buttons all announced as &quot;Remove&quot; or &quot;×&quot; does not say what each one removes.\u003c/p>\u003cpre>\u003ccode>&lt;li&gt;\n  Design\n  &lt;button aria-label=&quot;Remove Design&quot;&gt;×&lt;/button&gt;\n&lt;/li&gt;\u003c/code>\u003c/pre>\u003cp>The small remove icon often fails on size. WCAG 2.5.8 Target Size (Minimum) requires pointer targets of at least 24 by 24 CSS pixels, unless spacing or another exception applies. Extend the hit area with padding or a pseudo-element, without enlarging the icon, so users do not delete the wrong chip with a slightly misplaced tap.\u003c/p>\u003cp>Removing a chip destroys the element that had focus, and focus can fall back to the top of the page. Move focus to the next chip, or to the input when none remain, and report the removal in a \u003ccode>role=&quot;status&quot;\u003c/code> region.\u003c/p>\u003cp>Selected state must not rely on color alone under WCAG 1.4.1, so add a check mark or a change in border. A group of filter chips needs a label, using \u003ccode>role=&quot;group&quot;\u003c/code> with \u003ccode>aria-label\u003c/code> or a \u003ccode>&lt;fieldset&gt;\u003c/code>.\u003c/p>","avoid":"","usage":["After deleting a filter, Tab starts from the top of the page again.","The chip had focus when it was removed. Move focus to the next chip."],"out":[56,0,9,15]},{"name":"Timeline","section":6,"description":"A chronological display of events along a line, showing what happened and when.","body":"\u003cp>A timeline is a chronological display of events along a line, showing what happened and when. Order histories, audit logs, incident reports and account activity commonly use one. A \u003ca href=\"#Stepper\" data-term=\"Stepper\">stepper\u003c/a> looks similar but shows progress through a defined process with future steps, while a timeline mainly records events that have already occurred.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Component\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Record of past events\u003c/td>\u003ctd>Timeline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Progress through known steps\u003c/td>\u003ctd>Stepper\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Records compared by field\u003c/td>\u003ctd>\u003ca href=\"#Data%20table\" data-term=\"Data table\">Data table\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stream of incoming messages\u003c/td>\u003ctd>Log (\u003ccode>role=&quot;log&quot;\u003c/code>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Use an ordered list, because sequence is the meaning of the component. Mark each date with \u003ccode>&lt;time&gt;\u003c/code> so the machine-readable value is available, and add the \u003ccode>reversed\u003c/code> attribute when the newest event comes first so the numbering stays correct.\u003c/p>\u003cpre>\u003ccode>&lt;ol reversed&gt;\n  &lt;li&gt;\n    &lt;time datetime=&quot;2026-03-14T09:30Z&quot;&gt;14 Mar, 09:30 UTC&lt;/time&gt;\n    Order shipped\n  &lt;/li&gt;\n  &lt;li&gt;\n    &lt;time datetime=&quot;2026-03-13T16:05Z&quot;&gt;13 Mar, 16:05 UTC&lt;/time&gt;\n    Payment received\n  &lt;/li&gt;\n&lt;/ol&gt;\u003c/code>\u003c/pre>\u003cp>Draw the connecting line and dots with CSS pseudo-elements so they stay out of the accessibility tree. If a dot's color signals a status such as failed or completed, add text or an icon as well, since WCAG 1.4.1 does not allow color to be the only cue.\u003c/p>\u003cp>Date handling is where timelines usually go wrong. &quot;2 days ago&quot; is easy to scan but useless in an audit or a support call, so show the absolute time as well. Decide which timezone is displayed and label it. Without that, two people comparing an incident can read the same event as different times. Rendering relative or local time on the server can also produce a different value from the browser's, causing a mismatch when the page becomes interactive.\u003c/p>\u003cp>Long histories need \u003ca href=\"#Pagination%20control\" data-term=\"Pagination control\">pagination\u003c/a> or a &quot;Show earlier&quot; \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>, plus grouping by day. If events arrive live, avoid moving content while someone reads it. Add new entries through a notice such as &quot;3 new events&quot;, and let the user choose when to load them.\u003c/p>","avoid":"","usage":["Support and the customer disagree about when the refund happened.","The timeline only says 'yesterday'. Show the exact time and timezone on each event."],"out":[35,65,34,0]},{"name":"Kanban board","section":6,"description":"A board of columns representing workflow stages, with cards that move between them as work progresses.","body":"\u003cp>A kanban board is a set of columns representing workflow stages, with \u003ca href=\"#Card\" data-term=\"Card\">cards\u003c/a> that move between them as work progresses. A typical board has To do, In progress and Done. If people mainly need to sort, filter or edit many fields, a \u003ca href=\"#Data%20table\" data-term=\"Data table\">data table\u003c/a> is a better default.\u003c/p>\u003cp>The structure is a list of lists. Each column is a labelled section containing a list of cards, which gives screen readers (software that reads the UI aloud) the column name and item count.\u003c/p>\u003cpre>\u003ccode>&lt;section aria-labelledby=&quot;doing&quot;&gt;\n  &lt;h2 id=&quot;doing&quot;&gt;In progress (3)&lt;/h2&gt;\n  &lt;ul&gt;\n    &lt;li&gt;&lt;a href=&quot;/task/18&quot;&gt;Fix invoice rounding&lt;/a&gt;&lt;/li&gt;\n  &lt;/ul&gt;\n&lt;/section&gt;\u003c/code>\u003c/pre>\u003cp>\u003ca href=\"#Drag%20and%20drop\" data-term=\"Drag and drop\">Drag and drop\u003c/a> is the expected way to move cards, but it cannot be the only way. WCAG 2.5.7 Dragging Movements requires a single-pointer alternative, and a keyboard method alone does not satisfy it. A &quot;Move to&quot; \u003ca href=\"#Dropdown%20menu\" data-term=\"Dropdown menu\">dropdown menu\u003c/a> on each card works for pointer, keyboard and screen reader users together.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Input\u003c/th>\u003cth>How a card moves\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Mouse, touch\u003c/td>\u003ctd>Drag to a column, or use the &quot;Move to&quot; menu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Keyboard\u003c/td>\u003ctd>Open the menu, or pick up with Space and move with arrows\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Screen reader\u003c/td>\u003ctd>Use the menu and hear &quot;Moved to Done, position 2&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Announce each move through a \u003ccode>role=&quot;status&quot;\u003c/code> region, and keep focus on the moved card.\u003c/p>\u003cp>Persistence causes the less visible failures. If position is stored as an integer index, one move rewrites every card below it, and two people moving cards at once can overwrite each other. A sortable rank value between neighbours changes only the moved card. Moves are usually \u003ca href=\"#Optimistic%20UI\" data-term=\"Optimistic UI\">optimistic\u003c/a>, so a rejected request must return the card to its column and say why.\u003c/p>\u003cp>On narrow screens, the columns exceed the viewport. Horizontal scrolling is acceptable for the board, but dragging near an edge then needs auto-scroll. A single-column view with a stage picker often works better on phones.\u003c/p>","avoid":"","usage":["Two of us moved cards and the order came back scrambled.","The kanban board saves integer positions. Switch to a rank between neighbours."],"out":[64,65,108,36,63]},{"name":"Lightbox","section":6,"description":"A full-screen overlay that shows an enlarged image or media item above a dimmed page.","body":"\u003cp>A lightbox is a full-screen overlay that shows an enlarged image or media item above a dimmed page. It is a specialised \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a>, so it inherits the same focus and dismissal rules. For a simple image, a link to the full-size file may be enough, and it works without script.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Component\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Inspect one image closely\u003c/td>\u003ctd>Lightbox, or link to the file\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Step through a gallery\u003c/td>\u003ctd>Lightbox with Next and Previous\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Browse items inline\u003c/td>\u003ctd>\u003ca href=\"#Carousel\" data-term=\"Carousel\">Carousel\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Short preview on hover\u003c/td>\u003ctd>\u003ca href=\"#Hover%20card\" data-term=\"Hover card\">Hover card\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The thumbnail must be a real control. An \u003ccode>&lt;img&gt;\u003c/code> with a click handler cannot be reached by keyboard, so wrap it in a \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> or link whose name describes the action.\u003c/p>\u003cpre>\u003ccode>&lt;button aria-label=&quot;Enlarge: harbour at dusk&quot;&gt;\n  &lt;img src=&quot;harbour-thumb.jpg&quot; alt=&quot;&quot; /&gt;\n&lt;/button&gt;\n\n&lt;dialog aria-label=&quot;Image viewer&quot;&gt;\n  &lt;button&gt;Close&lt;/button&gt;\n  &lt;img src=&quot;harbour.jpg&quot; alt=&quot;Fishing boats in a harbour at dusk&quot; /&gt;\n&lt;/dialog&gt;\u003c/code>\u003c/pre>\u003cp>Opening a native \u003ccode>&lt;dialog&gt;\u003c/code> with \u003ccode>showModal()\u003c/code> moves focus inside it, makes the rest of the page inert, closes on Escape and returns focus to the thumbnail. A custom overlay has to build each of those itself, along with a \u003ca href=\"#Focus%20trap\" data-term=\"Focus trap\">focus trap\u003c/a>. Add a \u003ca href=\"#Scroll%20lock\" data-term=\"Scroll lock\">scroll lock\u003c/a> so that the page does not move behind the image.\u003c/p>\u003cp>Galleries need labelled Next and Previous buttons, plus Left and Right arrow keys as a convenience. Announce the position, such as &quot;Image 3 of 12&quot;, in a \u003ccode>role=&quot;status&quot;\u003c/code> region, and update the alt text with each image. Swiping cannot be the only way to move, because WCAG 2.5.7 Dragging Movements requires a single-pointer alternative.\u003c/p>\u003cp>Blocked zoom is a common failure. Viewing detail is the reason to open a lightbox, yet custom touch handlers or \u003ccode>touch-action: none\u003c/code> can block pinch zoom. Keep pinch zoom working, and show a visible Close button, since not every user knows that Escape or a backdrop click will dismiss it. Under \u003ca href=\"#Reduced%20motion\" data-term=\"Reduced motion\">reduced motion\u003c/a>, replace zoom transitions with a fade.\u003c/p>","avoid":"","usage":["On my phone I can't pinch to see the floor plan detail.","The lightbox sets \u003ccode>touch-action: none\u003c/code>. Let the browser handle pinch zoom."],"out":[42,71,48,0,50,51,111]},{"name":"App shell","section":7,"description":"The persistent frame of an application, such as header and navigation, around a content area that changes.","body":"\u003cp>An app shell is the persistent frame of an application, such as its header and navigation, around a content area that changes from view to view. Moving between screens replaces only the content, so the frame stays put and keeps its state. In progressive web apps, the term also refers to caching that frame so it appears before any data has loaded.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Region\u003c/th>\u003cth>Element\u003c/th>\u003cth>Typical content\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Top bar\u003c/td>\u003ctd>\u003ccode>&lt;header&gt;\u003c/code>\u003c/td>\u003ctd>Logo, search, account\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Primary navigation\u003c/td>\u003ctd>\u003ccode>&lt;nav&gt;\u003c/code>\u003c/td>\u003ctd>\u003ca href=\"#Sidebar\" data-term=\"Sidebar\">Sidebar\u003c/a> links\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Content\u003c/td>\u003ctd>\u003ccode>&lt;main&gt;\u003c/code>\u003c/td>\u003ctd>The current view\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mobile navigation\u003c/td>\u003ctd>\u003ccode>&lt;nav&gt;\u003c/code>\u003c/td>\u003ctd>\u003ca href=\"#Bottom%20navigation\" data-term=\"Bottom navigation\">Bottom navigation\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>These elements create landmarks, which let people using a screen reader, software that reads the UI aloud, jump between regions. Give multiple \u003ccode>&lt;nav&gt;\u003c/code> elements distinct labels, and add a \u003ca href=\"#Skip%20link\" data-term=\"Skip link\">skip link\u003c/a> so keyboard users can bypass the frame.\u003c/p>\u003cpre>\u003ccode>.shell {\n  display: grid;\n  grid-template: &quot;top top&quot; auto &quot;nav main&quot; 1fr / 16rem 1fr;\n  height: 100dvh;\n}\n.shell main { overflow: auto; min-height: 0; }\u003c/code>\u003c/pre>\u003cp>On mobile browsers, \u003ccode>100vh\u003c/code> is based on the largest viewport, with browser toolbars retracted, so the bottom of a full-height shell can sit behind them. The \u003ccode>dvh\u003c/code> unit tracks the visible area but changes as toolbars move, which can resize content during scrolling. The \u003ccode>svh\u003c/code> unit is stable and always fits, at the cost of some unused space when toolbars retract.\u003c/p>\u003cp>A grid child will not scroll unless its minimum size is released, so a \u003ccode>&lt;main&gt;\u003c/code> without \u003ccode>min-height: 0\u003c/code> can push the page taller and produce two scrollbars. With scrolling inside \u003ccode>&lt;main&gt;\u003c/code>, the browser may not restore scroll position on Back, so the router may have to do it.\u003c/p>\u003cp>Route changes need explicit handling because no page load happens. Move focus to the new view's heading or \u003ccode>&lt;main&gt;\u003c/code>, and update the document title, or a screen reader user receives no sign that anything changed. Keep a failed view contained in the content area so navigation still works.\u003c/p>","avoid":"","usage":["The bottom nav is hidden behind Safari's toolbar on iPhones.","The app shell uses \u003ccode>100vh\u003c/code>. Switch it to \u003ccode>100dvh\u003c/code> and pad for the \u003ca href=\"#Safe%20area\" data-term=\"Safe area\">safe area\u003c/a>."],"out":[31,39,41,83]},{"name":"Layout container","section":7,"description":"A centred wrapper that limits content to a maximum width and keeps consistent gutters at the page edges.","body":"\u003cp>A layout container is a centred wrapper that limits content to a maximum width and keeps consistent gutters at the page edges. Without one, text on a wide monitor stretches into lines that are tiring to read, and content on a phone touches the screen edge. The name is easy to confuse with a container query, a CSS feature that styles elements based on the size of an ancestor. A layout container only constrains width.\u003c/p>\u003cpre>\u003ccode>.container {\n  width: min(100% - 2rem, 70rem);\n  margin-inline: auto;\n}\u003c/code>\u003c/pre>\u003cp>The element takes the full width minus the gutters until it reaches \u003ccode>70rem\u003c/code>, then stays there and centres.\u003c/p>\u003cp>Most systems define a few widths for different content.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Size\u003c/th>\u003cth>Typical limit\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Prose\u003c/td>\u003ctd>\u003ccode>65ch\u003c/code>\u003c/td>\u003ctd>Articles, documentation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Narrow\u003c/td>\u003ctd>\u003ccode>40rem\u003c/code>\u003c/td>\u003ctd>Forms, settings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wide\u003c/td>\u003ctd>\u003ccode>70rem\u003c/code>\u003c/td>\u003ctd>Dashboards, marketing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Full\u003c/td>\u003ctd>None\u003c/td>\u003ctd>Tables, maps, media\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The \u003ccode>ch\u003c/code> unit is the width of the font's zero character.\u003c/p>\u003cp>Full-width sections inside a container are a common failure. Developers often break a band out of the container with \u003ccode>width: 100vw\u003c/code>. On systems with classic scrollbars, \u003ccode>100vw\u003c/code> can be wider than the visible area, because it does not subtract the scrollbar, and the page gains a horizontal scrollbar. Avoid this by placing the band outside the container, with an inner container for its content.\u003c/p>\u003cp>Nesting containers also causes trouble. Two nested wrappers apply the gutter twice, leaving content indented on mobile. Keep one container per band of the page, and use a \u003ca href=\"#Stack%20layout\" data-term=\"Stack layout\">stack layout\u003c/a> or grid inside it.\u003c/p>\u003cp>Avoid fixed widths. A \u003ccode>width: 1200px\u003c/code> wrapper forces horizontal scrolling on narrow or zoomed screens, and WCAG 1.4.10 Reflow requires content to fit a width equivalent to 320 CSS pixels without two-dimensional scrolling, aside from content that needs it. Let the container shrink and change the inner layout at a \u003ca href=\"#Breakpoint\" data-term=\"Breakpoint\">breakpoint\u003c/a>.\u003c/p>","avoid":"","usage":["There's a horizontal scrollbar on every page on Windows.","The hero uses \u003ccode>100vw\u003c/code> inside the layout container. Move it out and let it fill the body."],"out":[79,84]},{"name":"Stack layout","section":7,"description":"A layout that places children in one direction with a consistent gap between them.","body":"\u003cp>A stack layout places its children in one direction, vertically or horizontally, with a consistent gap between them. It covers \u003ca href=\"#Form%20field\" data-term=\"Form field\">form fields\u003c/a>, \u003ca href=\"#Card\" data-term=\"Card\">card\u003c/a> contents and \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> rows. The parent controls spacing, so individual children do not need margins and can be reused anywhere.\u003c/p>\u003cpre>\u003ccode>.stack {\n  display: flex;\n  flex-direction: column;\n  gap: 1rem;\n}\u003c/code>\u003c/pre>\u003cp>Spacing on the parent solves a recurring bug. When each child carries its own \u003ccode>margin-bottom\u003c/code>, the last child adds unwanted space at the end of its container, and adjacent vertical margins can collapse into one. A \u003ccode>gap\u003c/code> applies only between items.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Layout\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>One direction, even spacing\u003c/td>\u003ctd>Stack\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Row that wraps onto new lines\u003c/td>\u003ctd>Flex with \u003ccode>flex-wrap\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Items aligned in rows and columns\u003c/td>\u003ctd>Grid\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Uneven heights packed in columns\u003c/td>\u003ctd>\u003ca href=\"#Masonry%20layout\" data-term=\"Masonry layout\">Masonry layout\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Take gap values from a \u003ca href=\"#Spacing%20scale\" data-term=\"Spacing scale\">spacing scale\u003c/a>.\u003c/p>\u003cp>An empty child still receives a gap. If a conditional wrapper renders an empty \u003ccode>&lt;div&gt;\u003c/code>, the stack shows a double space with nothing in it. Render nothing instead of an empty element, or apply \u003ccode>.stack &gt; :empty { display: none; }\u003c/code> where that is safe.\u003c/p>\u003cp>Long content is another common failure. Flex items have an automatic minimum size based on their content, so a long URL in a horizontal stack can overflow instead of shrinking. Set \u003ccode>min-width: 0\u003c/code> on the item that should shrink.\u003c/p>\u003cp>Reversing visual order creates an accessibility problem. \u003ccode>flex-direction: column-reverse\u003c/code> and the \u003ccode>order\u003c/code> property move items on screen but leave the DOM order unchanged, so Tab and screen readers (software that reads the UI aloud) follow a different sequence from what is displayed. WCAG 2.4.3 Focus Order requires a sequence that preserves meaning, and 1.3.2 Meaningful Sequence requires a correct reading order where order affects meaning. If the order needs to change at a \u003ca href=\"#Breakpoint\" data-term=\"Breakpoint\">breakpoint\u003c/a>, check that both sequences still make sense.\u003c/p>","avoid":"","usage":["There's a strange double gap above the submit button.","A hidden field wrapper is still rendering in the stack layout. Don't render it at all."],"out":[23,64,0,81,85,84]},{"name":"Split pane","section":7,"description":"Two adjacent regions separated by a movable divider that lets the user resize them.","body":"\u003cp>A split pane is two adjacent regions separated by a movable divider that lets the user resize them. Code editors, email clients and design tools use it to show a list beside a detail view. Use it when people work across both regions and prefer different proportions. If one fixed ratio works for everyone, a plain two-column grid is simpler. For a panel needed only occasionally, a \u003ca href=\"#Drawer\" data-term=\"Drawer\">drawer\u003c/a> leaves more room for the main content.\u003c/p>\u003cp>The divider is a real control. The WAI-ARIA Authoring Practices define it as the window splitter pattern, using a focusable \u003ccode>separator\u003c/code> whose value is the size of the primary pane.\u003c/p>\u003cpre>\u003ccode>&lt;div role=&quot;separator&quot; tabindex=&quot;0&quot;\n     aria-orientation=&quot;vertical&quot;\n     aria-label=&quot;Resize file list&quot;\n     aria-controls=&quot;files&quot;\n     aria-valuenow=&quot;30&quot; aria-valuemin=&quot;15&quot; aria-valuemax=&quot;60&quot;&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Behaviour\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Left, Right Arrow\u003c/td>\u003ctd>Move a vertical splitter\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Up, Down Arrow\u003c/td>\u003ctd>Move a horizontal splitter\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter\u003c/td>\u003ctd>Collapse the primary pane, or restore it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Home (optional)\u003c/td>\u003ctd>Give the primary pane its smallest size\u003c/td>\u003c/tr>\u003ctr>\u003ctd>End (optional)\u003c/td>\u003ctd>Give the primary pane its largest size\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F6 (optional)\u003c/td>\u003ctd>Cycle between panes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>WCAG 2.5.7 Dragging Movements requires a single-pointer alternative to dragging, so add collapse or step \u003ca href=\"#Button\" data-term=\"Button\">buttons\u003c/a> that can be clicked or tapped. The visible divider is often 1px wide, so extend its hit area to meet the \u003ca href=\"#Touch%20target\" data-term=\"Touch target\">touch target\u003c/a> requirement.\u003c/p>\u003cp>A drag can stop following the cursor when the pointer leaves the divider. Call \u003ccode>setPointerCapture()\u003c/code> on pointer down so that later events keep going to the divider. If a pane contains an iframe, test dragging across it, because the frame can receive the pointer events. Setting \u003ccode>pointer-events: none\u003c/code> on the frame during the drag is a common fix.\u003c/p>\u003cp>Clamp sizes so neither pane collapses to an unusable width, and set \u003ccode>min-width: 0\u003c/code> so wide content cannot block resizing. Below a \u003ca href=\"#Breakpoint\" data-term=\"Breakpoint\">breakpoint\u003c/a>, stack the panes or show one at a time.\u003c/p>","avoid":"","usage":["The divider gets stuck whenever I drag over the preview.","The preview is an iframe, so the split pane loses the pointer. Disable its pointer events during the drag."],"out":[44,0,106,84]},{"name":"Masonry layout","section":7,"description":"A layout that packs items of uneven height into columns, placing each in the lane with the most room.","body":"\u003cp>A masonry layout packs items of uneven height into columns, placing each item in the lane with the most available space. Image galleries and pinboards use it to avoid the gaps a regular grid leaves when row heights differ. If items have similar heights, or reading order matters, use a regular grid, which keeps rows aligned and order predictable.\u003c/p>\u003cp>CSS now has a native approach called grid lanes, set with \u003ccode>display: grid-lanes\u003c/code>. Browser support is still limited and the feature is marked experimental in MDN at the time of writing, so check current compatibility data and treat it as a progressive enhancement. Earlier proposals used \u003ccode>grid-template-rows: masonry\u003c/code>, so older articles may show syntax that no longer applies.\u003c/p>\u003cpre>\u003ccode>.gallery {\n  display: grid;\n  gap: 1rem;\n  grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));\n}\n\n@supports (display: grid-lanes) {\n  .gallery { display: grid-lanes; }\n}\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technique\u003c/th>\u003cth>Order of items\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>grid-lanes\u003c/code>\u003c/td>\u003ctd>Across lanes\u003c/td>\u003ctd>Limited browser support\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CSS columns\u003c/td>\u003ctd>Down each column\u003c/td>\u003ctd>Reads top to bottom, then across\u003c/td>\u003c/tr>\u003ctr>\u003ctd>JavaScript\u003c/td>\u003ctd>Across lanes\u003c/td>\u003ctd>Absolute positions, runs on resize\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Grid row spans\u003c/td>\u003ctd>Across lanes\u003c/td>\u003ctd>Needs measured item heights\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>CSS multi-column layout is the common fallback, and it causes a specific surprise. Items flow down the first column before starting the second, so a newest-first feed appears out of order, and appending items can reshuffle the existing columns.\u003c/p>\u003cp>Focus order is the main accessibility issue. Items are placed by available height, so visual order can differ from DOM order, and pressing Tab can make focus jump between lanes. WCAG 2.4.3 Focus Order requires a sequence that preserves meaning and operability. If order carries meaning, such as ranked results, do not use masonry.\u003c/p>\u003cp>Images need reserved dimensions, with \u003ccode>width\u003c/code> and \u003ccode>height\u003c/code> attributes or \u003ca href=\"#Aspect%20ratio\" data-term=\"Aspect ratio\">aspect ratio\u003c/a>. Otherwise items change height as images load, and placement shifts. Combining masonry with \u003ca href=\"#Infinite%20scroll\" data-term=\"Infinite scroll\">infinite scroll\u003c/a> makes these problems harder to notice and to fix.\u003c/p>","avoid":"","usage":["Tabbing through the gallery jumps from column to column.","That comes with the masonry layout. If order matters here, use a normal grid."],"out":[82,69]},{"name":"Aspect ratio","section":7,"description":"The proportion between an element's width and height, used to reserve space and keep media from distorting.","body":"\u003cp>An aspect ratio is the proportion between an element's width and height, such as 16:9 for video or 1:1 for a square thumbnail. In CSS, the \u003ccode>aspect-ratio\u003c/code> property lets the browser calculate one dimension from the other. Its most frequent job is reserving space, so the page does not jump when an image finishes loading and pushes the text below it down.\u003c/p>\u003cpre>\u003ccode>.thumbnail {\n  width: 100%;\n  aspect-ratio: 16 / 9;\n  object-fit: cover;\n}\u003c/code>\u003c/pre>\u003cp>For images, set the \u003ccode>width\u003c/code> and \u003ccode>height\u003c/code> attributes in HTML as well. Browsers use them to work out the ratio before the file arrives, so layout space is reserved early, even when CSS sets \u003ccode>width: 100%\u003c/code> and \u003ccode>height: auto\u003c/code>.\u003c/p>\u003cp>When the media does not match the box, \u003ccode>object-fit\u003c/code> decides what happens.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Value\u003c/th>\u003cth>Result\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>fill\u003c/code>\u003c/td>\u003ctd>Stretches, distorting the image\u003c/td>\u003ctd>Rarely\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cover\u003c/code>\u003c/td>\u003ctd>Fills the box, cropping the edges\u003c/td>\u003ctd>Thumbnails, \u003ca href=\"#Avatar\" data-term=\"Avatar\">avatars\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>contain\u003c/code>\u003c/td>\u003ctd>Fits inside, leaving empty bands\u003c/td>\u003ctd>Logos, product photos\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Content taller than the box is the usual surprise. An element with \u003ccode>aspect-ratio\u003c/code> has an automatic minimum height based on its content, so a \u003ca href=\"#Card\" data-term=\"Card\">card\u003c/a> set to 1:1 grows past square when its text is long. The ratio appears to be ignored. Setting \u003ccode>overflow: auto\u003c/code> or \u003ccode>hidden\u003c/code> makes the element a scroll container, which removes that minimum and keeps the ratio. Setting \u003ccode>min-height: 0\u003c/code> also keeps the ratio, but content then overflows unless you handle it separately.\u003c/p>\u003cp>Forcing text into a fixed ratio carries an accessibility risk. Users who enlarge text need the box to grow, and WCAG 1.4.4 Resize Text does not allow clipped content at 200 percent. Apply fixed ratios to media and let text containers keep their automatic height.\u003c/p>\u003cp>An explicit \u003ccode>width\u003c/code> and \u003ccode>height\u003c/code> together override the ratio, because both dimensions are already known. Set only one when you want the ratio to apply.\u003c/p>","avoid":"","usage":["The article list jumps around as the thumbnails load.","The images have no dimensions. Set an aspect ratio so the space is reserved."],"out":[72,64]},{"name":"Safe area","section":7,"description":"The part of a screen not covered by notches, rounded corners or system bars, where content stays fully visible.","body":"\u003cp>A safe area is the part of a screen not covered by notches, rounded corners or system bars, where content stays fully visible. A fixed bottom bar whose buttons sit under the phone's home indicator, or text clipped by a camera cutout in landscape, is the usual sign that a page has ignored it.\u003c/p>\u003cp>CSS exposes the insets through environment variables, read with the \u003ccode>env()\u003c/code> function.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Variable\u003c/th>\u003cth>Typical cause on a phone\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>safe-area-inset-top\u003c/code>\u003c/td>\u003ctd>Notch or status area\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>safe-area-inset-right\u003c/code>\u003c/td>\u003ctd>Cutout in landscape\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>safe-area-inset-bottom\u003c/code>\u003c/td>\u003ctd>Home indicator\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>safe-area-inset-left\u003c/code>\u003c/td>\u003ctd>Cutout in landscape\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>On devices with cutouts, browsers generally keep the page inside the safe area by default. To draw edge to edge, a page opts in with \u003ccode>viewport-fit=cover\u003c/code>, and from then on it is responsible for keeping content clear of the unsafe regions.\u003c/p>\u003cpre>\u003ccode>&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1, viewport-fit=cover&quot; /&gt;\u003c/code>\u003c/pre>\u003cpre>\u003ccode>.bottom-bar {\n  position: fixed;\n  inset-inline: 0;\n  bottom: 0;\n  padding-block-end: max(0.75rem, env(safe-area-inset-bottom));\n}\u003c/code>\u003c/pre>\u003cp>The \u003ccode>max()\u003c/code> keeps a minimum padding on devices where the inset is 0, which includes rectangular displays with nothing occupying the viewport. The second argument of \u003ccode>env()\u003c/code> is a fallback used when the variable is not available, as in \u003ccode>env(safe-area-inset-bottom, 0px)\u003c/code>.\u003c/p>\u003cp>Three mistakes are common. Adding \u003ccode>viewport-fit=cover\u003c/code> without using the insets puts content under the hardware. Padding only the bottom works in portrait, but rotating the device moves the cutout to a side, so the left and right insets matter as well. Offsetting a bar with \u003ccode>bottom: env(safe-area-inset-bottom)\u003c/code> instead of padding it leaves page content visible in the strip beneath.\u003c/p>\u003cp>\u003ca href=\"#Bottom%20navigation\" data-term=\"Bottom navigation\">Bottom navigation\u003c/a>, \u003ca href=\"#Bottom%20sheet\" data-term=\"Bottom sheet\">bottom sheets\u003c/a>, \u003ca href=\"#Toast\" data-term=\"Toast\">toasts\u003c/a> and \u003ca href=\"#Floating%20action%20button\" data-term=\"Floating action button\">floating buttons\u003c/a> are the components most often affected. Test them on a real device or simulator in both orientations, because a desktop browser usually reports an inset of 0.\u003c/p>","avoid":"","usage":["The checkout button is partly under the iPhone home bar.","We set \u003ccode>viewport-fit=cover\u003c/code> but never added the safe area inset to the footer padding."],"out":[39,45,53,5]},{"name":"Breakpoint","section":7,"description":"A width at which a layout changes, usually written as a CSS media query.","body":"\u003cp>A breakpoint is a width at which a layout changes, such as a \u003ca href=\"#Sidebar\" data-term=\"Sidebar\">sidebar\u003c/a> collapsing into a menu below 48rem. It is usually written as a CSS media query, a rule that applies only when the viewport meets a condition. Breakpoints are one part of responsive design, which adapts a page to the space available.\u003c/p>\u003cpre>\u003ccode>.layout { display: grid; gap: 1rem; }\n\n@media (width &gt;= 48em) {\n  .layout { grid-template-columns: 16rem 1fr; }\n}\u003c/code>\u003c/pre>\u003cp>Choose breakpoints where the content starts to look wrong, instead of copying the dimensions of particular phones. Device sizes change, and a layout tuned to three popular screens can break at every width between them.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Tool\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Does the page have room for a sidebar?\u003c/td>\u003ctd>Media query\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Does this component's parent have room?\u003c/td>\u003ctd>Container query\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Should this size scale smoothly?\u003c/td>\u003ctd>\u003ca href=\"#Fluid%20typography\" data-term=\"Fluid typography\">Fluid typography\u003c/a>, \u003ccode>clamp()\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Should items wrap when they run out of room?\u003c/td>\u003ctd>Flex or grid wrapping\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A container query responds to the size of an ancestor element instead of the viewport, which suits a \u003ca href=\"#Card\" data-term=\"Card\">card\u003c/a> that appears in both a wide page and a narrow sidebar.\u003c/p>\u003cp>Using \u003ccode>em\u003c/code> in media queries has a specific benefit. It resolves against the browser's initial font size, not the page's CSS, so a user who increases their default font size gets the narrower layout sooner, and text has room.\u003c/p>\u003cp>Browser zoom also triggers breakpoints, because zooming reduces the viewport's width in CSS pixels. A 1280px window at 400 percent is 320 CSS pixels wide, which is the width WCAG 1.4.10 Reflow tests. Anything hidden at a small breakpoint must stay available in another form, or zoomed desktop users lose it.\u003c/p>\u003cp>Boundary bugs are a common symptom. Pairing \u003ccode>max-width: 767px\u003c/code> with \u003ccode>min-width: 768px\u003c/code> leaves a gap at fractional widths such as 767.5px, where neither rule applies and the layout looks broken. Range syntax avoids it with \u003ccode>width &lt; 48em\u003c/code> and \u003ccode>width &gt;= 48em\u003c/code>.\u003c/p>","avoid":"","usage":["The nav disappears completely at exactly one window size.","Our two breakpoints leave a gap at 767.5px. Use range syntax so they meet."],"out":[31,87,64]},{"name":"Spacing scale","section":7,"description":"A fixed set of allowed spacing values used for padding, margins and gaps across an interface.","body":"\u003cp>A spacing scale is a fixed set of allowed values for padding, margins and gaps across an interface. Instead of choosing 13px here and 17px there, developers pick the nearest step. Without one, a product drifts into dozens of nearly identical values, and screens look slightly misaligned even though no single rule is wrong.\u003c/p>\u003cp>Many scales build on a base of 4 or 8 pixels, with steps that grow as the values get larger.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Name\u003c/th>\u003cth>Value\u003c/th>\u003cth>Pixels at default\u003c/th>\u003cth>Typical use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>--space-1\u003c/code>\u003c/td>\u003ctd>\u003ccode>0.25rem\u003c/code>\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Icon and label\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--space-2\u003c/code>\u003c/td>\u003ctd>\u003ccode>0.5rem\u003c/code>\u003c/td>\u003ctd>8\u003c/td>\u003ctd>Inside compact controls\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--space-3\u003c/code>\u003c/td>\u003ctd>\u003ccode>0.75rem\u003c/code>\u003c/td>\u003ctd>12\u003c/td>\u003ctd>Control padding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--space-4\u003c/code>\u003c/td>\u003ctd>\u003ccode>1rem\u003c/code>\u003c/td>\u003ctd>16\u003c/td>\u003ctd>Between related fields\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--space-6\u003c/code>\u003c/td>\u003ctd>\u003ccode>1.5rem\u003c/code>\u003c/td>\u003ctd>24\u003c/td>\u003ctd>\u003ca href=\"#Card\" data-term=\"Card\">Card\u003c/a> padding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--space-8\u003c/code>\u003c/td>\u003ctd>\u003ccode>2rem\u003c/code>\u003c/td>\u003ctd>32\u003c/td>\u003ctd>Between groups\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--space-12\u003c/code>\u003c/td>\u003ctd>\u003ccode>3rem\u003c/code>\u003c/td>\u003ctd>48\u003c/td>\u003ctd>Between page sections\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Publish the values as CSS variables or design tokens, which are named design values shared across code and design files. Naming each step by its multiple of the base, as above, leaves room to add a value later without renaming everything. Names like \u003ccode>small\u003c/code> and \u003ccode>medium\u003c/code> run out quickly.\u003c/p>\u003cpre>\u003ccode>.card {\n  display: grid;\n  gap: var(--space-3);\n  padding: var(--space-6);\n}\u003c/code>\u003c/pre>\u003cp>Use spacing to show relationships. Items that belong together get a smaller gap than items that do not, so a label sits closer to its own input than to the previous field. When every gap is the same, grouping is lost and forms become harder to scan.\u003c/p>\u003cp>Reduce large section spacing on narrow screens at a \u003ca href=\"#Breakpoint\" data-term=\"Breakpoint\">breakpoint\u003c/a>.\u003c/p>\u003cp>The common failure is erosion through one-off values added to fix a single screen. Lint for raw pixel values in spacing properties, and add a new step only when several components need it. A \u003ca href=\"#Stack%20layout\" data-term=\"Stack layout\">stack layout\u003c/a> that takes a scale value as its gap keeps these decisions in one place.\u003c/p>","avoid":"","usage":["Why is this form 15px apart when the other one is 16?","Someone hard-coded it. Use the spacing scale so they stay consistent."],"out":[64,84,79]},{"name":"Type scale","section":7,"description":"A limited, related set of font sizes that gives text a consistent hierarchy across an interface.","body":"\u003cp>A type scale is a limited, related set of font sizes that gives text a consistent hierarchy across an interface. Without a scale, a product collects sizes like 15px, 16px and 17px that are too close to read as different levels and too numerous to maintain.\u003c/p>\u003cp>A common way to build one is to multiply a base size by a fixed ratio. The table uses a base of \u003ccode>1rem\u003c/code> and a ratio of 1.25, rounded to three decimals.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Size\u003c/th>\u003cth>Pixels at default\u003c/th>\u003cth>Line height\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>small\u003c/code>\u003c/td>\u003ctd>\u003ccode>0.8rem\u003c/code>\u003c/td>\u003ctd>12.8\u003c/td>\u003ctd>1.5\u003c/td>\u003ctd>Captions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>base\u003c/code>\u003c/td>\u003ctd>\u003ccode>1rem\u003c/code>\u003c/td>\u003ctd>16\u003c/td>\u003ctd>1.5\u003c/td>\u003ctd>Body text\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lg\u003c/code>\u003c/td>\u003ctd>\u003ccode>1.25rem\u003c/code>\u003c/td>\u003ctd>20\u003c/td>\u003ctd>1.4\u003c/td>\u003ctd>Lead text\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>xl\u003c/code>\u003c/td>\u003ctd>\u003ccode>1.563rem\u003c/code>\u003c/td>\u003ctd>25\u003c/td>\u003ctd>1.3\u003c/td>\u003ctd>\u003ca href=\"#Card\" data-term=\"Card\">Card\u003c/a> titles\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>2xl\u003c/code>\u003c/td>\u003ctd>\u003ccode>1.953rem\u003c/code>\u003c/td>\u003ctd>31.25\u003c/td>\u003ctd>1.2\u003c/td>\u003ctd>Section titles\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>3xl\u003c/code>\u003c/td>\u003ctd>\u003ccode>2.441rem\u003c/code>\u003c/td>\u003ctd>39\u003c/td>\u003ctd>1.1\u003c/td>\u003ctd>Page titles\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A larger ratio creates stronger contrast between levels and suits marketing pages. A smaller ratio suits dense dashboards, where big headings would waste space. Define line height with each size, since large text generally needs tighter leading than body text.\u003c/p>\u003cpre>\u003ccode>:root {\n  --text-base: 1rem;\n  --text-xl: 1.563rem;\n}\nh2 { font-size: var(--text-xl); line-height: 1.3; }\u003c/code>\u003c/pre>\u003cp>Keep visual size separate from heading level. A common failure is choosing \u003ccode>&lt;h4&gt;\u003c/code> because it looks the right size, which breaks the outline that people using a screen reader, which reads the UI aloud, navigate by. Choose the heading level from the document's structure, then apply whichever scale step fits.\u003c/p>\u003cp>Use \u003ccode>rem\u003c/code> for font sizes. A size in \u003ccode>px\u003c/code> does not follow the default font size a user sets in their browser, although page zoom still works. Check that nothing clips when text grows, since WCAG 1.4.4 Resize Text requires text to resize to 200 percent without loss of content or function.\u003c/p>\u003cp>To adapt the scale to screen width, change its values at a \u003ca href=\"#Breakpoint\" data-term=\"Breakpoint\">breakpoint\u003c/a> or use \u003ca href=\"#Fluid%20typography\" data-term=\"Fluid typography\">fluid typography\u003c/a>.\u003c/p>","avoid":"","usage":["Our card titles and section headings look almost identical.","They're one pixel apart. Map both onto the type scale so they differ by a full step."],"out":[64,84,87]},{"name":"Fluid typography","section":7,"description":"Text that scales smoothly with the viewport between a minimum and maximum size, usually using clamp().","body":"\u003cp>Fluid typography is text that scales smoothly with the viewport between a minimum and a maximum size, instead of jumping at a \u003ca href=\"#Breakpoint\" data-term=\"Breakpoint\">breakpoint\u003c/a>. It is usually written with the CSS \u003ccode>clamp()\u003c/code> function, which takes a minimum, a preferred value and a maximum.\u003c/p>\u003cpre>\u003ccode>h1 {\n  font-size: clamp(1.5rem, 1rem + 2.5vw, 3rem);\n}\u003c/code>\u003c/pre>\u003cp>The browser resolves \u003ccode>clamp(MIN, VAL, MAX)\u003c/code> as \u003ccode>max(MIN, min(VAL, MAX))\u003c/code>. In this example, the heading is \u003ccode>1.5rem\u003c/code> on small screens, \u003ccode>3rem\u003c/code> on large screens, and grows with the viewport in between.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>Behaviour\u003c/th>\u003cth>Suits\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fixed \u003ca href=\"#Type%20scale\" data-term=\"Type scale\">type scale\u003c/a>\u003c/td>\u003ctd>Same at all widths\u003c/td>\u003ctd>Dense application interfaces\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Steps at breakpoints\u003c/td>\u003ctd>Jumps between sizes\u003c/td>\u003ctd>Simple, predictable control\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fluid with \u003ccode>clamp()\u003c/code>\u003c/td>\u003ctd>Continuous between two limits\u003c/td>\u003ctd>Headings, marketing pages\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The main failure is text that does not respond to zoom. Browser zoom reduces the viewport's width in CSS pixels, so a size set only in \u003ccode>vw\u003c/code> stays about the same physical size however far the user zooms. WCAG lists this as failure F94 under 1.4.4 Resize Text, which requires text to be resizable to 200 percent without loss of content or functionality.\u003c/p>\u003cp>Mixing a \u003ccode>rem\u003c/code> value into the preferred value helps, because the \u003ccode>rem\u003c/code> part responds to zoom and to the user's font-size setting. It does not fully solve the problem, since the \u003ccode>vw\u003c/code> part still shrinks in CSS pixels as zoom increases, so the text grows by less than the zoom factor. MDN advises making the maximum a relative unit at least twice the minimum, so that text can still reach 200 percent. The example above follows that rule. Test it by zooming and comparing the rendered size.\u003c/p>\u003cp>Do not use \u003ccode>px\u003c/code> for the limits, since they ignore the user's default font size. Body text benefits least from fluid scaling, and a fixed \u003ccode>1rem\u003c/code> is often the better choice.\u003c/p>","avoid":"","usage":["The hero title doesn't get any bigger when I zoom to 200 percent.","Its fluid typography is pure \u003ccode>vw\u003c/code>. Add a \u003ccode>rem\u003c/code> component and clamp it."],"out":[84,86]},{"name":"Elevation","section":7,"description":"The apparent height of a surface above the page, shown with shadow or tone to communicate layering.","body":"\u003cp>Elevation is the apparent height of a surface above the page, shown with shadow or tone to communicate what sits on top of what. A \u003ca href=\"#Card\" data-term=\"Card\">card\u003c/a> at a low level looks attached to the page, while a \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a> at a high level looks separate from everything behind it. It is a visual language, and it does not by itself control which element paints in front.\u003c/p>\u003cp>Most systems define a few named levels instead of allowing arbitrary shadows.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Typical surface\u003c/th>\u003cth>Shadow\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>Page background\u003c/td>\u003ctd>None\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Cards, panels\u003c/td>\u003ctd>Subtle\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"#Sticky%20header\" data-term=\"Sticky header\">Sticky headers\u003c/a>\u003c/td>\u003ctd>Small\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Dropdowns, \u003ca href=\"#Popover\" data-term=\"Popover\">popovers\u003c/a>\u003c/td>\u003ctd>Medium\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Dialogs, \u003ca href=\"#Drawer\" data-term=\"Drawer\">drawers\u003c/a>\u003c/td>\u003ctd>Large\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Keep elevation and \u003ccode>z-index\u003c/code> as separate decisions that happen to line up. Painting order is governed by stacking contexts, the groups within which \u003ccode>z-index\u003c/code> values compete. A menu with a level 3 shadow can still render behind a header if its ancestor forms a lower group. A \u003ca href=\"#Portal\" data-term=\"Portal\">portal\u003c/a> is the common way out of that situation.\u003c/p>\u003cpre>\u003ccode>:root {\n  --elevation-1: 0 1px 2px rgb(0 0 0 / 0.15);\n  --elevation-3: 0 4px 12px rgb(0 0 0 / 0.2);\n}\n.menu {\n  box-shadow: var(--elevation-3);\n  border: 1px solid transparent;\n}\u003c/code>\u003c/pre>\u003cp>The transparent border in that example is there for forced colors mode, an accessibility setting that replaces page colors with a user-chosen palette. In this mode, \u003ccode>box-shadow\u003c/code> is forced to \u003ccode>none\u003c/code>, so a menu defined only by its shadow loses its edge and merges with the page. Border colors are replaced by a system color, so the transparent border becomes visible.\u003c/p>\u003cp>Shadows are also hard to see in \u003ca href=\"#Dark%20mode\" data-term=\"Dark mode\">dark mode\u003c/a>, because there is little light to darken. A common approach is to make higher surfaces slightly lighter in tone, and keep a subtle border. Where a boundary is needed to identify a control, WCAG 1.4.11 Non-text Contrast requires 3:1 against adjacent colors, and a soft shadow alone rarely provides it.\u003c/p>","avoid":"","usage":["In high contrast mode the dropdown blends into the page.","Its elevation is only a box shadow, which gets removed. Add a transparent border."],"out":[64,42,66,46,44,49,90]},{"name":"Theming","section":7,"description":"Changing an interface's visual values, such as colors and radii, by swapping named variables without editing components.","body":"\u003cp>Theming is changing an interface's visual values, such as colors, radii and fonts, by swapping named variables without editing the components. The same \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> can follow a customer's brand or switch to \u003ca href=\"#Dark%20mode\" data-term=\"Dark mode\">dark mode\u003c/a> because it refers to \u003ccode>--color-accent\u003c/code> instead of a fixed color. A theme that half works, with one panel staying white, usually means a component has a hard-coded value that bypasses the variables.\u003c/p>\u003cp>CSS custom properties are the usual mechanism, since they inherit through the DOM and can change at runtime without rebuilding styles.\u003c/p>\u003cpre>\u003ccode>:root {\n  --color-surface: #ffffff;\n  --color-text: #1a1a1a;\n}\n[data-theme=&quot;dark&quot;] {\n  --color-surface: #16181d;\n  --color-text: #e8e8e8;\n}\n.panel {\n  background: var(--color-surface);\n  color: var(--color-text);\n}\u003c/code>\u003c/pre>\u003cp>Naming decides whether a theme stays maintainable. Most systems use design tokens, which are named design values, in tiers.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tier\u003c/th>\u003cth>Example\u003c/th>\u003cth>Holds\u003c/th>\u003cth>Changes per theme\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Raw\u003c/td>\u003ctd>\u003ccode>--blue-600\u003c/code>\u003c/td>\u003ctd>A literal color\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Semantic\u003c/td>\u003ctd>\u003ccode>--color-accent\u003c/code>\u003c/td>\u003ctd>A role in the UI\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Component\u003c/td>\u003ctd>\u003ccode>--button-bg\u003c/code>\u003c/td>\u003ctd>One component's value\u003c/td>\u003ctd>Sometimes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Components should use semantic names.\u003c/p>\u003cp>Because custom properties inherit, a theme can apply to a subtree by setting the attribute on any element, which is useful for a dark \u003ca href=\"#Sidebar\" data-term=\"Sidebar\">sidebar\u003c/a> in a light app. Content rendered through a \u003ca href=\"#Portal\" data-term=\"Portal\">portal\u003c/a> moves to another part of the DOM and can lose that scope, so a menu opened from the dark sidebar appears in the light theme. Copy the theme attribute to the portal's container.\u003c/p>\u003cp>A stored theme applied by client-side JavaScript causes a flash of the wrong colors on load. Set the attribute with a small inline script in \u003ccode>&lt;head&gt;\u003c/code> before the body renders, or on the server from a cookie.\u003c/p>\u003cp>Each theme must meet contrast on its own. WCAG 1.4.3 requires 4.5:1 for normal text and 1.4.11 requires 3:1 for control boundaries, and a pair that passes in one theme can fail in another. Check every semantic color pair per theme.\u003c/p>","avoid":"","usage":["The date popup stays light inside our dark sidebar.","It's portalled out of the theming scope. Pass the \u003ccode>data-theme\u003c/code> attribute to the portal root."],"out":[0,90,31,49]},{"name":"Dark mode","section":7,"description":"An alternate color theme with light text on dark surfaces, following a system preference or a user choice.","body":"\u003cp>Dark mode is an alternate color theme with light text on dark surfaces, following a system preference or a user's choice. It is a specific case of \u003ca href=\"#Theming\" data-term=\"Theming\">theming\u003c/a>, and it takes more than inverting colors. A page that flashes white on every load, or a dark page with a bright white scrollbar and date input, is a sign that only some of the required parts were done.\u003c/p>\u003cp>Three CSS features handle different jobs.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Feature\u003c/th>\u003cth>Job\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>prefers-color-scheme\u003c/code>\u003c/td>\u003ctd>Detects the user's system preference\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>color-scheme\u003c/code>\u003c/td>\u003ctd>Tells the browser to render native UI in light or dark\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>light-dark()\u003c/code>\u003c/td>\u003ctd>Picks one of two values based on the used color scheme\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The \u003ccode>color-scheme\u003c/code> property affects the canvas, scrollbars, form controls and system colors. It is also required for \u003ccode>light-dark()\u003c/code> to work.\u003c/p>\u003cpre>\u003ccode>:root { color-scheme: light dark; }\n\nbody {\n  background: light-dark(#ffffff, #16181d);\n  color: light-dark(#1a1a1a, #e8e8e8);\n}\u003c/code>\u003c/pre>\u003cpre>\u003ccode>&lt;meta name=&quot;color-scheme&quot; content=&quot;light dark&quot; /&gt;\u003c/code>\u003c/pre>\u003cp>The meta tag gives the browser the preference before CSS loads, which helps prevent a white flash. If the app offers its own toggle, provide three options: System, Light and Dark. Store the choice, and apply it with a small inline script in \u003ccode>&lt;head&gt;\u003c/code> before the body paints. Setting \u003ccode>color-scheme: dark\u003c/code> on the root for the Dark option keeps native controls in step.\u003c/p>\u003cp>Colors need to be designed for dark surfaces, not flipped. Pure white on pure black can feel harsh, so many palettes soften both ends. Saturated brand colors that work on white may fall below the 4.5:1 text contrast ratio required by WCAG 1.4.3 on a dark background, so check every pair in both themes.\u003c/p>\u003cp>Shadows lose their effect, so show \u003ca href=\"#Elevation\" data-term=\"Elevation\">elevation\u003c/a> with lighter surfaces or borders. Logos with dark transparent backgrounds need an alternate asset.\u003c/p>\u003cp>Dark mode is separate from forced colors mode, an accessibility setting where the user's palette replaces page colors. Test both.\u003c/p>","avoid":"","usage":["Dark mode looks fine except the scrollbars and select menus are bright white.","We never set \u003ccode>color-scheme\u003c/code>, so the browser still renders native controls in light."],"out":[89,88]},{"name":"Component library","section":8,"description":"A versioned collection of reusable UI components that teams install and build products from.","body":"\u003cp>A component library is a versioned collection of reusable UI pieces, such as \u003ca href=\"#Button\" data-term=\"Button\">buttons\u003c/a>, inputs and dialogs, that teams install and build products from. It gives several applications one implementation of each control, so a fix to a \u003ca href=\"#Modal%20dialog\" data-term=\"Modal dialog\">modal dialog\u003c/a> reaches all of them. A design system, the wider set of standards, guidance and shared design decisions, may include a component library, but the library is only its code.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>You get\u003c/th>\u003cth>You give up\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Styled library\u003c/td>\u003ctd>Fast start, finished visuals\u003c/td>\u003ctd>Distinct look, easy overrides\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Headless%20component\" data-term=\"Headless component\">Headless\u003c/a> library\u003c/td>\u003ctd>Behaviour and accessibility\u003c/td>\u003ctd>You write all the styling\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Copied-in source\u003c/td>\u003ctd>Full control of the code\u003c/td>\u003ctd>Upstream fixes arrive manually\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Built in-house\u003c/td>\u003ctd>Exact fit\u003c/td>\u003ctd>Ongoing maintenance cost\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Controls such as a \u003ca href=\"#Combobox\" data-term=\"Combobox\">combobox\u003c/a> or \u003ca href=\"#Date%20picker\" data-term=\"Date picker\">date picker\u003c/a> are expensive to build well, so many teams adopt a tested library for them.\u003c/p>\u003cp>A breaking change can affect every consuming app at once, so follow semantic versioning: major for breaking changes, minor for additions, patch for fixes. Publish a changelog, deprecate an API before removing it. When upgrades become painful, teams stop taking them, and different apps end up pinned to different versions.\u003c/p>\u003cp>Style overrides are the other recurring problem. If consumers reach into internal class names to adjust a component, every internal change can break them. Expose supported options such as a \u003ca href=\"#Variant\" data-term=\"Variant\">variant\u003c/a>, CSS variables or a \u003ca href=\"#Slot\" data-term=\"Slot\">slot\u003c/a>, and treat the internal markup as private.\u003c/p>\u003cp>Using a library does not make a product accessible by itself. It can provide correct roles and keyboard support, but labels, heading order, focus destinations and color choices remain the product team's responsibility.\u003c/p>\u003cp>Document each component in a \u003ca href=\"#Component%20explorer\" data-term=\"Component explorer\">component explorer\u003c/a> with its states, so teams can find what already exists before building a second version.\u003c/p>","avoid":"","usage":["We've got four different date pickers across our apps.","Put one in the component library and migrate them over one at a time."],"out":[0,42,93,13,18,98,96,100]},{"name":"Primitive component","section":8,"description":"A low-level building block with a narrow job, from which larger components in a library are assembled.","body":"\u003cp>A primitive component is a low-level building block with one narrow job, from which larger components are assembled. Text, Box, Icon and a bare \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a> are typical examples. A \u003ccode>SearchBar\u003c/code> is not a primitive, because it combines several parts for a specific purpose.\u003c/p>\u003cp>The term is used in two ways, which can confuse a conversation.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Meaning\u003c/th>\u003cth>Provides\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Visual primitive\u003c/td>\u003ctd>Styling and layout from tokens\u003c/td>\u003ctd>Box, Text, \u003ca href=\"#Stack%20layout\" data-term=\"Stack layout\">Stack\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Behaviour primitive\u003c/td>\u003ctd>State, keyboard and accessibility wiring\u003c/td>\u003ctd>Dialog, Menu, \u003ca href=\"#Tabs\" data-term=\"Tabs\">Tabs\u003c/a> parts\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A behaviour primitive is usually a \u003ca href=\"#Headless%20component\" data-term=\"Headless component\">headless component\u003c/a> with no visual styling. In \u003ca href=\"#Atomic%20design\" data-term=\"Atomic design\">atomic design\u003c/a>, visual primitives roughly correspond to atoms.\u003c/p>\u003cp>A primitive has to stay open, because it does not know where it will be used. It should forward standard attributes, event handlers and refs (handles to the underlying DOM node) to the element it renders. If it drops them, consumers cannot attach an \u003ccode>aria-describedby\u003c/code>, a test ID or a focus call, and they end up writing a replacement.\u003c/p>\u003cpre>\u003ccode>function Text({ as: Tag = &quot;span&quot;, size = &quot;base&quot;, className = &quot;&quot;, ...rest }) {\n  return &lt;Tag className={`text-${size} ${className}`} {...rest} /&gt;;\n}\u003c/code>\u003c/pre>\u003cp>Spreading \u003ccode>...rest\u003c/code> is what passes those attributes through. The \u003ccode>as\u003c/code> prop makes it a \u003ca href=\"#Polymorphic%20component\" data-term=\"Polymorphic component\">polymorphic component\u003c/a>, so the same text styles can apply to a \u003ccode>&lt;p&gt;\u003c/code> or \u003ccode>&lt;h2&gt;\u003c/code> without changing the document's structure.\u003c/p>\u003cp>The common failure is a primitive that accumulates options. A Box gains props for every CSS property, then responsive versions of each, until it is a second styling language. Keep props limited to values from your tokens, and let unusual cases use regular CSS.\u003c/p>\u003cp>The opposite failure is promoting a component too early. A shape that appears twice may be coincidence, and a shared abstraction forces both uses to change together. Extract a primitive once several components need the same behaviour. A change to a primitive affects everything built on it, so it needs visual regression tests and a careful release.\u003c/p>","avoid":"","usage":["I can't add \u003ccode>aria-describedby\u003c/code> to our Input.","The primitive component isn't forwarding extra props. Spread them onto the native element."],"out":[0,79,33,93,101,95]},{"name":"Headless component","section":8,"description":"A component that supplies behaviour, state and accessibility wiring but no visual styling.","body":"\u003cp>A headless component supplies behaviour, state and accessibility wiring but no visual styling. It handles things like opening a menu, tracking the active item and managing keyboard input, while you provide the styling. Teams choose one when a styled library's appearance would need constant overriding, but they do not want to rebuild a complex control such as a \u003ca href=\"#Combobox\" data-term=\"Combobox\">combobox\u003c/a> from scratch.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Option\u003c/th>\u003cth>Behaviour\u003c/th>\u003cth>Styling\u003c/th>\u003cth>Suits\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Styled \u003ca href=\"#Component%20library\" data-term=\"Component library\">component library\u003c/a>\u003c/td>\u003ctd>Included\u003c/td>\u003ctd>Included\u003c/td>\u003ctd>Internal tools, fast starts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Headless component\u003c/td>\u003ctd>Included\u003c/td>\u003ctd>Yours\u003c/td>\u003ctd>Products with their own design\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Built from scratch\u003c/td>\u003ctd>Yours\u003c/td>\u003ctd>Yours\u003c/td>\u003ctd>Unusual interactions\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Headless APIs usually come in one of two forms. Some ship unstyled parts as a \u003ca href=\"#Compound%20component\" data-term=\"Compound component\">compound component\u003c/a>. Others ship a hook, or a function that returns attributes for you to spread on your own elements.\u003c/p>\u003cpre>\u003ccode>function Disclosure({ title, children }) {\n  const { buttonProps, panelProps } = useDisclosure();\n  return (\n    &lt;&gt;\n      &lt;button className=&quot;disclosure-title&quot; {...buttonProps}&gt;{title}&lt;/button&gt;\n      &lt;div className=&quot;disclosure-panel&quot; {...panelProps}&gt;{children}&lt;/div&gt;\n    &lt;/&gt;\n  );\n}\u003c/code>\u003c/pre>\u003cp>Here, \u003ccode>buttonProps\u003c/code> would hold \u003ccode>aria-expanded\u003c/code>, \u003ccode>aria-controls\u003c/code> and a click handler, so the consumer never writes them. The usual way this breaks is a consumer dropping those props or spreading them on the wrong element. The control still looks correct while keyboard behaviour and screen reader output (the UI read aloud) stop working. A \u003ccode>&lt;div&gt;\u003c/code> given the \u003ca href=\"#Button\" data-term=\"Button\">button\u003c/a>'s props, for example, may lack focus and key handling.\u003c/p>\u003cp>A headless library handles only part of accessibility. You remain responsible for visible labels, a \u003ca href=\"#Focus%20ring\" data-term=\"Focus ring\">focus ring\u003c/a> with sufficient contrast, \u003ca href=\"#Touch%20target\" data-term=\"Touch target\">touch target\u003c/a> sizes, color contrast, \u003ca href=\"#Reduced%20motion\" data-term=\"Reduced motion\">reduced motion\u003c/a> and hover and selected styles. An unstyled menu can have correct accessibility attributes and still have no visible indication of which item is focused.\u003c/p>\u003cp>Styling hooks matter when choosing a library. Good ones expose state through data attributes such as \u003ccode>data-state=&quot;open&quot;\u003c/code>, so CSS can respond without extra logic. Check that it lets you control where an overlay renders, because a \u003ca href=\"#Portal\" data-term=\"Portal\">portal\u003c/a> can affect \u003ca href=\"#Theming\" data-term=\"Theming\">theming\u003c/a> and stacking.\u003c/p>","avoid":"","usage":["Should we write our own select so it matches the brand?","No. Use a headless component for the keyboard and ARIA behaviour and style it ourselves."],"out":[13,91,94,0,103,106,111,49,89]},{"name":"Compound component","section":8,"description":"A set of components designed to work together, sharing state implicitly through a common parent.","body":"\u003cp>A compound component is a set of components designed to work together, sharing state implicitly through a common parent. The HTML \u003ccode>&lt;select&gt;\u003c/code> and \u003ccode>&lt;option&gt;\u003c/code> elements work this way: neither is useful alone, and the parent tracks which option is chosen. In a \u003ca href=\"#Component%20library\" data-term=\"Component library\">component library\u003c/a>, the same idea looks like this:\u003c/p>\u003cpre>\u003ccode>&lt;Tabs defaultValue=&quot;account&quot;&gt;\n  &lt;Tabs.List&gt;\n    &lt;Tabs.Trigger value=&quot;account&quot;&gt;Account&lt;/Tabs.Trigger&gt;\n    &lt;Tabs.Trigger value=&quot;billing&quot;&gt;Billing&lt;/Tabs.Trigger&gt;\n  &lt;/Tabs.List&gt;\n  &lt;Tabs.Panel value=&quot;account&quot;&gt;&lt;AccountForm /&gt;&lt;/Tabs.Panel&gt;\n  &lt;Tabs.Panel value=&quot;billing&quot;&gt;&lt;BillingForm /&gt;&lt;/Tabs.Panel&gt;\n&lt;/Tabs&gt;\u003c/code>\u003c/pre>\u003cp>The alternative is a single component configured with data, such as \u003ccode>&lt;Tabs items={[...]} /&gt;\u003c/code>. That API is shorter, but it struggles once one tab needs a \u003ca href=\"#Badge\" data-term=\"Badge\">badge\u003c/a>, another needs a \u003ca href=\"#Tooltip\" data-term=\"Tooltip\">tooltip\u003c/a> and a third needs a different wrapper. Each request adds another prop, and the component ends up with options like \u003ccode>renderTabLabel\u003c/code> and \u003ccode>tabClassNameByIndex\u003c/code>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>API style\u003c/th>\u003cth>Good for\u003c/th>\u003cth>Weakness\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Config prop\u003c/td>\u003ctd>Uniform, data-driven lists\u003c/td>\u003ctd>Grows a prop per exception\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Compound\u003c/td>\u003ctd>Flexible structure and content\u003c/td>\u003ctd>More verbose to use\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Render%20prop\" data-term=\"Render prop\">Render prop\u003c/a>\u003c/td>\u003ctd>Custom output from internal state\u003c/td>\u003ctd>Harder to read when nested\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Slot\" data-term=\"Slot\">Slot\u003c/a>\u003c/td>\u003ctd>Replacing named regions\u003c/td>\u003ctd>Fixed set of regions\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The parent usually shares state through a context, a framework feature that passes data to descendants without props. Older implementations used \u003ccode>cloneElement\u003c/code> to inject props into direct children. That approach breaks as soon as someone wraps a child in a \u003ccode>&lt;div&gt;\u003c/code> or their own component, and the tab silently stops responding. Context works at any depth, so prefer it.\u003c/p>\u003cp>A part rendered outside its parent has no context to read. Throw a clear error such as &quot;Tabs.Trigger must be used within Tabs&quot; rather than failing with an undefined value.\u003c/p>\u003cp>Accessibility wiring is a major benefit of this pattern. The parent can generate IDs and connect \u003ccode>aria-controls\u003c/code>, \u003ccode>aria-labelledby\u003c/code> and \u003ccode>aria-selected\u003c/code> across parts, and it can run \u003ca href=\"#Roving%20tabindex\" data-term=\"Roving tabindex\">roving tabindex\u003c/a> so the caller never handles them.\u003c/p>","avoid":"","usage":["Our Tabs component has 22 props now, mostly for one-off tab labels.","Make it a compound component so callers can put whatever they need inside each trigger."],"out":[91,56,47,97,96,107]},{"name":"Polymorphic component","section":8,"description":"A component that can render as different HTML elements or components, usually through an as prop.","body":"\u003cp>A polymorphic component can render as different HTML elements or components, usually through a prop named \u003ccode>as\u003c/code>. It lets the same styles apply to different semantics. A \u003ccode>Button\u003c/code> can render a \u003ccode>&lt;button&gt;\u003c/code> for an action and an \u003ccode>&lt;a&gt;\u003c/code> for navigation while looking identical.\u003c/p>\u003cpre>\u003ccode>function Button({ as: Tag = &quot;button&quot;, ...props }) {\n  const typeProp = Tag === &quot;button&quot; ? { type: &quo
